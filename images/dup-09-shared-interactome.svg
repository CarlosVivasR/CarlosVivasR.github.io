<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Dos parálogos comparten parte de sus socios de interacción y conservan otros en propiedad">
  <style>
    .disc{fill:#12203a}
    .edge{stroke:#3d5378;stroke-width:1.3;fill:none}
    .sh{stroke:#e8a33d;stroke-width:1.8;fill:none;stroke-dasharray:70;stroke-dashoffset:70;animation:drawIn 5.4s ease-out infinite}
    .d2{animation-delay:0s}
    .node{fill:#2b3f60;stroke:#3d5378;stroke-width:1.2}
    .shared{fill:#e8a33d;animation:lightUp 5.4s ease-out infinite}
    .hub{fill:#e8a33d}
    .link{stroke:#e8a33d;stroke-width:2.4;stroke-linecap:round}
    @keyframes drawIn{ 0%,10%{stroke-dashoffset:70} 52%,100%{stroke-dashoffset:0} }
    @keyframes lightUp{ 0%,26%{fill:#2b3f60} 56%,100%{fill:#e8a33d} }
    @media (prefers-reduced-motion:reduce){
      .sh{animation:none;stroke-dashoffset:0}
      .shared{animation:none;fill:#e8a33d}
    }
  </style>
  <circle class="disc" cx="100" cy="100" r="100"/>

  <!-- socios propios -->
  <line class="edge" x1="72" y1="104" x2="38"  y2="132"/>
  <line class="edge" x1="72" y1="104" x2="34"  y2="88"/>
  <line class="edge" x1="128" y1="104" x2="162" y2="132"/>
  <line class="edge" x1="128" y1="104" x2="166" y2="88"/>

  <!-- socios compartidos: los dos parálogos llegan a ellos -->
  <line class="sh" x1="72"  y1="104" x2="100" y2="48"/>
  <line class="sh" x1="128" y1="104" x2="100" y2="48"/>
  <line class="sh" x1="72"  y1="104" x2="72"  y2="52"/>
  <line class="sh" x1="128" y1="104" x2="72"  y2="52"/>
  <line class="sh" x1="72"  y1="104" x2="128" y2="52"/>
  <line class="sh" x1="128" y1="104" x2="128" y2="52"/>
  <line class="sh" x1="72"  y1="104" x2="100" y2="152"/>
  <line class="sh" x1="128" y1="104" x2="100" y2="152"/>

  <line class="link" x1="72" y1="104" x2="128" y2="104"/>

  <circle class="node" cx="38"  cy="132" r="8"/>
  <circle class="node" cx="34"  cy="88"  r="8"/>
  <circle class="node" cx="162" cy="132" r="8"/>
  <circle class="node" cx="166" cy="88"  r="8"/>

  <circle class="node shared" cx="100" cy="48"  r="9"/>
  <circle class="node shared" cx="72"  cy="52"  r="8"/>
  <circle class="node shared" cx="128" cy="52"  r="8"/>
  <circle class="node shared" cx="100" cy="152" r="9"/>

  <circle class="hub" cx="72"  cy="104" r="13"/>
  <circle class="hub" cx="128" cy="104" r="13"/>
</svg>
