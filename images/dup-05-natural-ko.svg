<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="A gene is switched off and the person carrying it is healthy">
  <style>
    .f4-disc{fill:#12203a}
    .f4-cap{fill:#e8a33d;animation:fgOff 2.8s linear infinite}
    .f4-case{stroke:#12203a;stroke-width:3.4;stroke-linecap:round}
    .f4-core{stroke:#ffffff;stroke-width:2;stroke-linecap:round}
    .f4-ko{opacity:0;animation:fgKo 2.8s ease-out infinite}
    .f4-body{fill:#e8a33d}
    @keyframes fgOff{ 0%,22%{fill:#e8a33d} 46%,100%{fill:#7a8aa6} }
    @keyframes fgKo{ 0%,20%{opacity:0} 44%,100%{opacity:1} }
    @media (prefers-reduced-motion:reduce){
      .f4-cap{animation:none;fill:#7a8aa6}
      .f4-ko{animation:none;opacity:1}
    }
  </style>
  <circle class="f4-disc" cx="100" cy="100" r="100"/>

  <rect class="f4-cap" x="68" y="48" width="64" height="18" rx="5.1"/>
  <g class="f4-ko">
    <g class="f4-case"><line x1="83" y1="42" x2="117" y2="72"/><line x1="117" y1="42" x2="83" y2="72"/></g>
    <g class="f4-core"><line x1="83" y1="42" x2="117" y2="72"/><line x1="117" y1="42" x2="83" y2="72"/></g>
  </g>

  <g class="f4-body">
    <circle cx="100" cy="112" r="12"/>
    <rect x="87" y="128" width="26" height="44" rx="13"/>
  </g>
</svg>
