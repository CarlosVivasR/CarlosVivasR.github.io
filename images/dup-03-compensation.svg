<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="One copy of a pair is switched off; the other copy is drawn as an open dashed outline because whether it covers is not known">
  <style>
    .f6-disc{fill:#12203a}
    .f6-cap{fill:#e8a33d;animation:fgOff 3.4s linear infinite}
    .f6-case{stroke:#12203a;stroke-width:3.4;stroke-linecap:round}
    .f6-core{stroke:#ffffff;stroke-width:2;stroke-linecap:round}
    .f6-ko{opacity:0;animation:fgKo 3.4s ease-out infinite}
    .f6-solid{fill:#e8a33d;animation:fgFade 3.4s linear infinite}
    .f6-ask{fill:none;stroke:#e8a33d;stroke-width:2.6;stroke-dasharray:4.5 3.4;
            opacity:0;animation:fgAsk 3.4s linear infinite}
    @keyframes fgOff { 0%,18%{fill:#e8a33d} 38%,100%{fill:#7a8aa6} }
    @keyframes fgKo  { 0%,16%{opacity:0} 36%,100%{opacity:1} }
    @keyframes fgFade{ 0%,52%{opacity:1} 84%,100%{opacity:0} }
    @keyframes fgAsk { 0%,56%{opacity:0} 88%,100%{opacity:1} }
    @media (prefers-reduced-motion:reduce){
      .f6-cap{animation:none;fill:#7a8aa6}
      .f6-ko{animation:none;opacity:1}
      .f6-solid{animation:none;opacity:0}
      .f6-ask{animation:none;opacity:1}
    }
  </style>
  <circle class="f6-disc" cx="100" cy="100" r="100"/>

  <rect class="f6-cap" x="28" y="91" width="64" height="18" rx="5.1"/>
  <g class="f6-ko">
    <g class="f6-case"><line x1="43" y1="85" x2="77" y2="115"/><line x1="77" y1="85" x2="43" y2="115"/></g>
    <g class="f6-core"><line x1="43" y1="85" x2="77" y2="115"/><line x1="77" y1="85" x2="43" y2="115"/></g>
  </g>

  <rect class="f6-solid" x="108" y="91" width="64" height="18" rx="5.1"/>
  <rect class="f6-ask"   x="108" y="91" width="64" height="18" rx="5.1"/>
</svg>
