<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Se pierde una copia y la copia hermana sube su expresión hasta restituir la dosis conjunta">
  <style>
    .disc{fill:#12203a}
    .axis{stroke:#28405f;stroke-width:2;stroke-linecap:round}
    .level{stroke:#c9d3e6;stroke-width:1.2;stroke-dasharray:5 4;opacity:.4}
    .gene{fill:#e8a33d}
    .lost{fill:#e8a33d;animation:lostFill 5.4s linear infinite}
    .bar{transform-box:fill-box;transform-origin:bottom}
    .barL{fill:#e8a33d;animation:barDown 5.4s cubic-bezier(.4,0,.3,1) infinite}
    .barR{fill:#e8a33d;animation:barUp 5.4s cubic-bezier(.4,0,.3,1) infinite}
    .ko{stroke:#c9d3e6;stroke-width:3.5;stroke-linecap:round;opacity:0;animation:koIn 5.4s ease-out infinite}
    @keyframes lostFill{ 0%,22%{fill:#e8a33d} 40%,100%{fill:#3d4b63} }
    @keyframes barDown{ 0%,22%{transform:scaleY(1)} 44%,100%{transform:scaleY(.03)} }
    @keyframes barUp{   0%,34%{transform:scaleY(1)} 62%,100%{transform:scaleY(2)} }
    @keyframes koIn{    0%,20%{opacity:0} 30%,100%{opacity:1} }
    @media (prefers-reduced-motion:reduce){
      .lost{animation:none;fill:#3d4b63}
      .barL{animation:none;transform:scaleY(.03)}
      .barR{animation:none;transform:scaleY(2)}
      .ko{animation:none;opacity:1}
    }
  </style>
  <circle class="disc" cx="100" cy="100" r="100"/>

  <line class="level" x1="40" y1="64" x2="160" y2="64"/>

  <rect class="bar barL" x="60" y="98" width="22" height="34" rx="2"/>
  <rect class="bar barR" x="118" y="98" width="22" height="34" rx="2"/>

  <line class="axis" x1="46" y1="133" x2="154" y2="133"/>

  <rect class="lost" x="56" y="142" width="30" height="18" rx="4"/>
  <rect class="gene" x="114" y="142" width="30" height="18" rx="4"/>

  <g class="ko">
    <line x1="61" y1="146" x2="81" y2="156"/>
    <line x1="81" y1="146" x2="61" y2="156"/>
  </g>
</svg>
