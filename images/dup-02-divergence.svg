<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="A gene copy picks up changes over time; some later changes land on positions that have already changed, so eight changes leave only five visible differences">
  <style>
    .f3-disc{fill:#12203a}
    .f3-strip{fill:#e8a33d;animation:fgDrift 3.2s linear infinite}
    .f3-hole{fill:#12203a;opacity:0}
    .f3-dot{fill:#ffffff;opacity:0}
    .f3-hole,.f3-dot{animation-name:fgIn;animation-duration:.26s;animation-timing-function:ease-out;
                     animation-iteration-count:1;animation-fill-mode:forwards}
    .f3-t1{animation-delay:.30s}
    .f3-t2{animation-delay:.62s}
    .f3-t3{animation-delay:.94s}
    .f3-t4{animation-delay:1.26s}
    .f3-t5{animation-delay:1.58s}
    .f3-t6{animation-delay:1.90s}
    .f3-t7{animation-delay:2.22s}
    .f3-t8{animation-delay:2.54s}
    @keyframes fgIn{ from{opacity:0} to{opacity:1} }
    @keyframes fgDrift{ 0%,20%{fill:#e8a33d} 92%,100%{fill:#7a8aa6} }
    @media (prefers-reduced-motion:reduce){
      .f3-strip{animation:none;fill:#7a8aa6}
      .f3-hole,.f3-dot{animation:none;opacity:1}
    }
  </style>
  <circle class="f3-disc" cx="100" cy="100" r="100"/>

  <rect class="f3-strip" x="34" y="87" width="132" height="26" rx="7.3"/>

  <rect class="f3-hole f3-t1" x="49"  y="87" width="6" height="26"/>
  <rect class="f3-hole f3-t2" x="117" y="87" width="6" height="26"/>
  <rect class="f3-hole f3-t3" x="71"  y="87" width="6" height="26"/>
  <rect class="f3-hole f3-t5" x="139" y="87" width="6" height="26"/>
  <rect class="f3-hole f3-t6" x="91"  y="87" width="6" height="26"/>

  <circle class="f3-dot f3-t1" cx="52"  cy="80" r="3"/>
  <circle class="f3-dot f3-t2" cx="120" cy="80" r="3"/>
  <circle class="f3-dot f3-t3" cx="74"  cy="80" r="3"/>
  <circle class="f3-dot f3-t4" cx="120" cy="71" r="3"/>
  <circle class="f3-dot f3-t5" cx="142" cy="80" r="3"/>
  <circle class="f3-dot f3-t6" cx="94"  cy="80" r="3"/>
  <circle class="f3-dot f3-t7" cx="74"  cy="71" r="3"/>
  <circle class="f3-dot f3-t8" cx="120" cy="62" r="3"/>
</svg>
