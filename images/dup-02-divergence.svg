<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Dos copias de un gen divergen con el tiempo: una acumula mutaciones y se degrada">
  <style>
    .disc{fill:#12203a}
    .track{fill:#1b2c48}
    .keep{fill:#e8a33d}
    .drift{fill:#7a8aa6;animation:driftFill 6s linear infinite}
    .mut{fill:#12203a}
    .m1{animation:mut1 6s linear infinite}
    .m2{animation:mut2 6s linear infinite}
    .m3{animation:mut3 6s linear infinite}
    .m4{animation:mut4 6s linear infinite}
    .m5{animation:mut5 6s linear infinite}
    .sweep{stroke:#e8a33d;stroke-width:1.5;opacity:.45;animation:sweep 6s linear infinite}
    @keyframes driftFill{ 0%,9%{fill:#e8a33d} 75%,100%{fill:#7a8aa6} }
    @keyframes mut1{ 0%,9%{opacity:0}  12%,100%{opacity:1} }
    @keyframes mut2{ 0%,24%{opacity:0} 27%,100%{opacity:1} }
    @keyframes mut3{ 0%,39%{opacity:0} 42%,100%{opacity:1} }
    @keyframes mut4{ 0%,57%{opacity:0} 60%,100%{opacity:1} }
    @keyframes mut5{ 0%,72%{opacity:0} 75%,100%{opacity:1} }
    @keyframes sweep{ 0%{transform:translateX(0px)} 88%,100%{transform:translateX(96px)} }
    @media (prefers-reduced-motion:reduce){
      .drift{animation:none;fill:#7a8aa6}
      .m1,.m2,.m3,.m4,.m5{animation:none;opacity:1}
      .sweep{animation:none;transform:translateX(96px)}
    }
  </style>
  <circle class="disc" cx="100" cy="100" r="100"/>
  <rect class="track" x="50" y="64" width="100" height="26" rx="5"/>
  <rect class="track" x="50" y="110" width="100" height="26" rx="5"/>
  <rect class="keep" x="52" y="66" width="96" height="22" rx="4"/>
  <rect class="drift" x="52" y="112" width="96" height="22" rx="4"/>
  <g>
    <rect class="mut m1" x="62"  y="112" width="3" height="22"/>
    <rect class="mut m2" x="78"  y="112" width="3" height="22"/>
    <rect class="mut m3" x="95"  y="112" width="3" height="22"/>
    <rect class="mut m4" x="114" y="112" width="3" height="22"/>
    <rect class="mut m5" x="131" y="112" width="3" height="22"/>
  </g>
  <line class="sweep" x1="52" y1="56" x2="52" y2="144"/>
</svg>
