<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="The same gene switched off in a cell in culture, and the cell does not survive it">
  <style>
    .f5-disc{fill:#12203a}
    .f5-cap{fill:#e8a33d;animation:fgOff 3.2s linear infinite}
    .f5-case{stroke:#12203a;stroke-width:3.4;stroke-linecap:round}
    .f5-core{stroke:#ffffff;stroke-width:2;stroke-linecap:round}
    .f5-ko{opacity:0;animation:fgKo 3.2s ease-out infinite}
    .f5-cell{fill:none;stroke:#e8a33d;stroke-width:3.2;animation:fgDie 3.2s linear infinite}
    .f5-nuc{fill:#e8a33d;animation:fgGone 3.2s linear infinite}
    @keyframes fgOff { 0%,18%{fill:#e8a33d} 38%,100%{fill:#7a8aa6} }
    @keyframes fgKo  { 0%,16%{opacity:0} 36%,100%{opacity:1} }
    @keyframes fgDie { 0%,52%{stroke:#e8a33d} 84%,100%{stroke:#7a8aa6} }
    @keyframes fgGone{ 0%,56%{opacity:1} 88%,100%{opacity:0} }
    @media (prefers-reduced-motion:reduce){
      .f5-cap{animation:none;fill:#7a8aa6}
      .f5-ko{animation:none;opacity:1}
      .f5-cell{animation:none;stroke:#7a8aa6}
      .f5-nuc{animation:none;opacity:0}
    }
  </style>
  <circle class="f5-disc" cx="100" cy="100" r="100"/>

  <rect class="f5-cap" x="68" y="48" width="64" height="18" rx="5.1"/>
  <g class="f5-ko">
    <g class="f5-case"><line x1="83" y1="42" x2="117" y2="72"/><line x1="117" y1="42" x2="83" y2="72"/></g>
    <g class="f5-core"><line x1="83" y1="42" x2="117" y2="72"/><line x1="117" y1="42" x2="83" y2="72"/></g>
  </g>

  <circle class="f5-cell" cx="100" cy="130" r="32"/>
  <circle class="f5-nuc"  cx="100" cy="130" r="10"/>
</svg>
