<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Every gene in a set is copied at the same moment: one column of gene copies becomes two identical columns">
  <style>
    .f1-disc{fill:#12203a}
    .f1-cap{fill:#e8a33d}
    .f1-a{animation:fgSplitA 2.8s cubic-bezier(.4,0,.3,1) infinite}
    .f1-b{opacity:0;animation:fgSplitB 2.8s cubic-bezier(.4,0,.3,1) infinite}
    .f1-mark{fill:none;stroke:#ffffff;stroke-width:1.8;opacity:0;animation:fgMark 2.8s ease-out infinite}
    @keyframes fgSplitA{ 0%,18%{transform:translateX(0)} 74%,100%{transform:translateX(-30px)} }
    @keyframes fgSplitB{ 0%,14%{transform:translateX(0);opacity:0} 24%{transform:translateX(0);opacity:1} 74%,100%{transform:translateX(30px);opacity:1} }
    @keyframes fgMark{ 0%,8%{opacity:0} 18%{opacity:.85} 46%,100%{opacity:0} }
    @media (prefers-reduced-motion:reduce){
      .f1-a{animation:none;transform:translateX(-30px)}
      .f1-b{animation:none;transform:translateX(30px);opacity:1}
      .f1-mark{animation:none;opacity:0}
    }
  </style>
  <circle class="f1-disc" cx="100" cy="100" r="100"/>
  <g class="f1-b">
    <rect class="f1-cap" x="79" y="68"  width="42" height="12" rx="3.4"/>
    <rect class="f1-cap" x="79" y="88"  width="42" height="12" rx="3.4"/>
    <rect class="f1-cap" x="79" y="108" width="42" height="12" rx="3.4"/>
    <rect class="f1-cap" x="79" y="128" width="42" height="12" rx="3.4"/>
  </g>
  <g class="f1-a">
    <rect class="f1-cap" x="79" y="68"  width="42" height="12" rx="3.4"/>
    <rect class="f1-cap" x="79" y="88"  width="42" height="12" rx="3.4"/>
    <rect class="f1-cap" x="79" y="108" width="42" height="12" rx="3.4"/>
    <rect class="f1-cap" x="79" y="128" width="42" height="12" rx="3.4"/>
  </g>
  <rect class="f1-mark" x="70" y="59" width="60" height="90" rx="9"/>
</svg>
