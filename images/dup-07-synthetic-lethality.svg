<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Two cells side by side: in the first, one copy of a pair is switched off and the cell lives; in the second, both copies are switched off and the cell does not survive">
  <style>
    .f7-disc{fill:#12203a}
    .f7-live{fill:none;stroke:#e8a33d;stroke-width:3.2}
    .f7-wall{fill:none;stroke:#e8a33d;stroke-width:3.2;animation:fgDie 3.4s linear infinite}
    .f7-on{fill:#e8a33d}
    .f7-off{fill:#7a8aa6}
    .f7-fading{fill:#e8a33d;animation:fgOff 3.4s linear infinite}
    .f7-case{stroke:#12203a;stroke-width:3;stroke-linecap:round}
    .f7-core{stroke:#ffffff;stroke-width:1.8;stroke-linecap:round}
    .f7-ko2{opacity:0;animation:fgKo 3.4s ease-out infinite}
    @keyframes fgOff{ 0%,32%{fill:#e8a33d} 54%,100%{fill:#7a8aa6} }
    @keyframes fgKo { 0%,30%{opacity:0} 52%,100%{opacity:1} }
    @keyframes fgDie{ 0%,62%{stroke:#e8a33d} 90%,100%{stroke:#7a8aa6} }
    @media (prefers-reduced-motion:reduce){
      .f7-fading{animation:none;fill:#7a8aa6}
      .f7-ko2{animation:none;opacity:1}
      .f7-wall{animation:none;stroke:#7a8aa6}
    }
  </style>
  <circle class="f7-disc" cx="100" cy="100" r="100"/>

  <!-- una copia apagada: la celula vive -->
  <circle class="f7-live" cx="56" cy="112" r="38"/>
  <rect class="f7-off" x="36" y="95"  width="40" height="12" rx="3.4"/>
  <rect class="f7-on"  x="36" y="119" width="40" height="12" rx="3.4"/>
  <g class="f7-case"><line x1="46" y1="92" x2="66" y2="110"/><line x1="66" y1="92" x2="46" y2="110"/></g>
  <g class="f7-core"><line x1="46" y1="92" x2="66" y2="110"/><line x1="66" y1="92" x2="46" y2="110"/></g>

  <!-- las dos apagadas: la celula no sobrevive -->
  <circle class="f7-wall" cx="144" cy="112" r="38"/>
  <rect class="f7-off"    x="124" y="95"  width="40" height="12" rx="3.4"/>
  <rect class="f7-fading" x="124" y="119" width="40" height="12" rx="3.4"/>
  <g class="f7-case"><line x1="134" y1="92" x2="154" y2="110"/><line x1="154" y1="92" x2="134" y2="110"/></g>
  <g class="f7-core"><line x1="134" y1="92" x2="154" y2="110"/><line x1="154" y1="92" x2="134" y2="110"/></g>
  <g class="f7-ko2">
    <g class="f7-case"><line x1="134" y1="116" x2="154" y2="134"/><line x1="154" y1="116" x2="134" y2="134"/></g>
    <g class="f7-core"><line x1="134" y1="116" x2="154" y2="134"/><line x1="154" y1="116" x2="134" y2="134"/></g>
  </g>
</svg>
