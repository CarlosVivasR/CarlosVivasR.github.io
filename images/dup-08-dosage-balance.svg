<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Three subunits fitted together in a fixed ratio come apart when a surplus copy of one of them arrives">
  <style>
    .f8-disc{fill:#12203a}
    .f8-ring{fill:none;stroke:#5b6d8c;stroke-width:2;stroke-dasharray:4 6}
    .f8-su{fill:#e8a33d;animation:fgGrey 3.4s linear infinite}
    .f8-s1{animation:fgGrey 3.4s linear infinite, fgOut1 3.4s cubic-bezier(.4,0,.3,1) infinite}
    .f8-s2{animation:fgGrey 3.4s linear infinite, fgOut2 3.4s cubic-bezier(.4,0,.3,1) infinite}
    .f8-s3{animation:fgGrey 3.4s linear infinite, fgOut3 3.4s cubic-bezier(.4,0,.3,1) infinite}
    .f8-extra{fill:#e8a33d;opacity:0;animation:fgArrive 3.4s cubic-bezier(.4,0,.3,1) infinite}
    @keyframes fgGrey{ 0%,52%{fill:#e8a33d} 84%,100%{fill:#7a8aa6} }
    @keyframes fgOut1{ 0%,40%{transform:translate(0,0)} 82%,100%{transform:translate(0,-22px)} }
    @keyframes fgOut2{ 0%,40%{transform:translate(0,0)} 82%,100%{transform:translate(-20px,12px)} }
    @keyframes fgOut3{ 0%,40%{transform:translate(0,0)} 82%,100%{transform:translate(20px,12px)} }
    @keyframes fgArrive{ 0%,10%{transform:translateY(34px);opacity:0} 24%{opacity:1} 62%,100%{transform:translateY(0);opacity:1} }
    @media (prefers-reduced-motion:reduce){
      .f8-s1{animation:none;fill:#7a8aa6;transform:translate(0,-22px)}
      .f8-s2{animation:none;fill:#7a8aa6;transform:translate(-20px,12px)}
      .f8-s3{animation:none;fill:#7a8aa6;transform:translate(20px,12px)}
      .f8-extra{animation:none;transform:translateY(0);opacity:1}
    }
  </style>
  <circle class="f8-disc" cx="100" cy="100" r="100"/>
  <circle class="f8-ring" cx="100" cy="100" r="46"/>

  <circle class="f8-su f8-s2" cx="82"  cy="110" r="20"/>
  <circle class="f8-su f8-s3" cx="118" cy="110" r="20"/>
  <circle class="f8-su f8-s1" cx="100" cy="78"  r="20"/>
  <circle class="f8-extra"    cx="100" cy="150" r="20"/>
</svg>
