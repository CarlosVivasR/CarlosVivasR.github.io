<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="One gene out of a set is copied on its own: the rest of the column is unchanged and the new copy sits somewhere else, tied to its origin by a dashed line">
  <style>
    .f2-disc{fill:#12203a}
    .f2-cap{fill:#e8a33d}
    .f2-copy{fill:#e8a33d;opacity:0;animation:fgTravel 2.8s cubic-bezier(.4,0,.3,1) infinite}
    .f2-tie{stroke:#5b6d8c;stroke-width:2.4;stroke-dasharray:4 3.5;stroke-linecap:round;fill:none;
            opacity:0;animation:fgTie 2.8s ease-out infinite}
    @keyframes fgTravel{
      0%,14%  {transform:translate(0,0);opacity:0}
      26%     {transform:translate(0,0);opacity:1}
      78%,100%{transform:translate(52px,42px);opacity:1}
    }
    @keyframes fgTie{ 0%,72%{opacity:0} 96%,100%{opacity:1} }
    @media (prefers-reduced-motion:reduce){
      .f2-copy{animation:none;transform:translate(52px,42px);opacity:1}
      .f2-tie{animation:none;opacity:1}
    }
  </style>
  <circle class="f2-disc" cx="100" cy="100" r="100"/>
  <rect class="f2-cap" x="79" y="68"  width="42" height="12" rx="3.4"/>
  <rect class="f2-cap" x="79" y="88"  width="42" height="12" rx="3.4"/>
  <rect class="f2-cap" x="79" y="108" width="42" height="12" rx="3.4"/>
  <rect class="f2-cap" x="79" y="128" width="42" height="12" rx="3.4"/>
  <line class="f2-tie" x1="106" y1="122" x2="148" y2="148"/>
  <rect class="f2-copy" x="79" y="108" width="42" height="12" rx="3.4"/>
</svg>
