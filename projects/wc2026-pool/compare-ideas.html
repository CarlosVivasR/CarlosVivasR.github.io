<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo · dos brackets compactos</title>
<style>
  :root{--you:#17a89f;--rival:#C9A227;--ok:#1a9d63;--okbg:rgba(46,194,126,.16);--cc:#d4d8de}
  *{box-sizing:border-box}
  body{margin:0;background:#0e121c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0a0a0a;padding:26px 14px 80px}
  .card{background:#fff;border-radius:16px;max-width:1140px;margin:0 auto 26px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
  .chead{padding:15px 20px;border-bottom:1px solid #eef2f7;background:linear-gradient(180deg,#f9fafb,#fff)}
  .chead .opt{font-size:.66em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--you)}
  .chead h3{margin:3px 0 4px;font-size:1.12em;font-weight:800}
  .chead p{margin:0;font-size:.83em;color:#6b7280;line-height:1.45}
  .cbody{padding:16px 20px 24px;overflow-x:auto}
  .twin{display:flex;gap:30px;min-width:max-content}
  .tcol{flex:0 0 auto}
  .twho{font-size:.8em;font-weight:800;text-align:center;margin-bottom:9px;padding:4px 10px;border-radius:7px;white-space:nowrap}
  .twho.you{color:#0f7b74;background:rgba(23,168,159,.12)}
  .twho.rival{color:#9a7400;background:rgba(201,162,39,.16)}

  /* fan-out tree */
  .ptree{display:flex;gap:14px;align-items:stretch}
  .pround{display:grid;grid-template-rows:auto repeat(16,1fr);gap:0}
  .plbl{grid-row:1;font-size:.54em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9aa3af;text-align:center;margin-bottom:5px}
  .pround.r0 .pcell{grid-row-end:span 1}
  .pround.r1 .pcell{grid-row-end:span 2}
  .pround.r2 .pcell{grid-row-end:span 4}
  .pround.r3 .pcell{grid-row-end:span 8}
  .pround.r4 .pcell{grid-row-end:span 16}
  .pcell{position:relative;display:flex;align-items:center}
  .pround:not(.r0) .pcell::before{content:"";position:absolute;left:-7px;top:25%;height:50%;width:1px;background:var(--cc)}
  .pround:not(.r0) .pcell::after{content:"";position:absolute;left:-7px;top:50%;height:1px;width:7px;background:var(--cc)}
  .pmatch{flex:1;position:relative;background:#fff;border:1px solid #e3e8ef;border-radius:6px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
  .pround:not(.r4) .pmatch::after{content:"";position:absolute;right:-7px;top:50%;height:1px;width:7px;background:var(--cc)}
  .pmatch.fin{border:2px solid #e8c247}
  .pmatch.hit{background:var(--okbg);border-color:rgba(46,194,126,.5)}
  img.fl{width:15px;height:11px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex-shrink:0;vertical-align:-1px}

  /* variant: one line "ESP · FRA" */
  .v1 .pround{min-width:84px}
  .v1 .pmatch{padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:.68em;font-family:ui-monospace,Menlo,monospace}
  .v1 .s{color:#9aa3af;font-weight:700}
  .v1 .s.w{color:#0a0a0a;font-weight:800}
  .v1 i{color:#cbd0d7;font-style:normal}

  /* variant: winner only (flag + abbr) */
  .v2 .pround{min-width:70px}
  .v2 .pmatch{padding:4px 6px;display:flex;align-items:center;gap:5px;justify-content:center}
  .v2 .pmatch b{font-size:.7em;font-family:ui-monospace,Menlo,monospace;font-weight:800}
  .v2 .pmatch.hit b{color:#0e7a45}

  /* variant: stacked mini (two rows, winner bold) */
  .v3 .pround{min-width:80px}
  .v3 .pmatch{padding:2px;display:flex;flex-direction:column;gap:2px}
  .v3 .row{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:4px;background:#f7f8fa;font-size:.66em;color:#8a909a;font-family:ui-monospace,Menlo,monospace;font-weight:700}
  .v3 .row.w{color:#0a0a0a;font-weight:800;background:#eceff3}
  .v3 .pmatch.hit .row.w{background:var(--okbg);color:#0e7a45}

  .note{font-size:.78em;color:#6b7280;margin:0 auto 18px;max-width:1140px;padding:0 6px;line-height:1.5}
  .note b.you{color:#0f7b74}.note b.rival{color:#9a7400}

  /* MÓVIL: apila los dos cuadros (uno encima del otro); cada cuadro se desliza solo si hace falta */
  @media (max-width:760px){
    .cbody{padding:14px 12px 20px}
    .twin{flex-direction:column;gap:18px;min-width:0}
    .tcol{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
    .twho{position:sticky;left:0}
  }
</style></head>
<body>
<div class="note">Datos de ejemplo · <b class="you">TÚ</b> = Carlos · <b class="rival">RIVAL</b> = Agustín · en <b style="color:#1a9d63">verde</b>, los partidos donde coincidís en quién pasa.</div>
<div id="root"></div>
<script>
const T = {
  es:['es','ESP'], br:['br','BRA'], ar:['ar','ARG'], fr:['fr','FRA'], pt:['pt','POR'], nl:['nl','NED'],
  de:['de','GER'], hr:['hr','CRO'], ma:['ma','MAR'], us:['us','USA'], mx:['mx','MEX'], ca:['ca','CAN'],
  jp:['jp','JPN'], kr:['kr','KOR'], sn:['sn','SEN'], uy:['uy','URU'], co:['co','COL'], ec:['ec','ECU'],
  be:['be','BEL'], ch:['ch','SUI'], rs:['rs','SRB'], dk:['dk','DEN'], pl:['pl','POL'], au:['au','AUS'],
  ir:['ir','IRN'], sa:['sa','KSA'], qa:['qa','QAT'], gh:['gh','GHA'], no:['no','NOR'], eg:['eg','EGY'],
  ng:['ng','NGA'], cm:['cm','CMR']
};
const team = k => ({code:T[k][0], ab:T[k][1], key:k});
const ORDER = ['fr','es','ar','br','pt','nl','de','be','ma','hr','uy','co','us','mx','sn','jp','ec','dk','ch','rs','no','kr','pl','ir','eg','ng','ca','au','gh','qa','sa','cm'];
const seed={}; ORDER.forEach((k,i)=>seed[k]=i);
const R32=[['br','no'],['es','ca'],['ar','au'],['fr','sa'],['pt','gh'],['nl','ir'],['de','qa'],['be','cm'],
  ['ma','ec'],['hr','dk'],['uy','pl'],['co','kr'],['us','ng'],['mx','eg'],['sn','ch'],['jp','rs']].map(([a,b])=>({a:team(a),b:team(b)}));
function makeUser(force){
  const F=new Set(force);
  const pick=(a,b)=> F.has(a.key)?a : F.has(b.key)?b : (seed[a.key]<=seed[b.key]?a:b);
  const r32=R32.map(m=>({...m,w:pick(m.a,m.b)}));
  const mk=prev=>{const o=[];for(let i=0;i<prev.length;i+=2){const a=prev[i].w,b=prev[i+1].w;o.push({a,b,w:pick(a,b)});}return o;};
  const r16=mk(r32),qf=mk(r16),sf=mk(qf),f=mk(sf);
  return {r32,r16,qf,sf,f};
}
const YOU=makeUser(['ma','co','us','es']), RIVAL=makeUser(['hr','uy','jp','ar']);
const KEYS=['r32','r16','qf','sf','f'];
const fl=t=>`<img class="fl" src="https://flagcdn.com/w20/${t.code}.png" alt="">`;

function tree(self, other, variant){
  let cols='';
  KEYS.forEach((rk,ri)=>{
    let cells='';
    self[rk].forEach((m,i)=>{
      const o=(other[rk][i]||{}).w; const hit=m.w&&o&&m.w.key===o.key;
      cells+=`<div class="pcell"><div class="pmatch ${hit?'hit':''} ${rk==='f'?'fin':''}">${variant(m,hit)}</div></div>`;
    });
    const lbl=['R32','OCT','CUA','SEM','FIN'][ri];
    cols+=`<div class="pround r${ri}"><div class="plbl">${lbl}</div>${cells}</div>`;
  });
  return `<div class="ptree">${cols}</div>`;
}
const v1=(m)=>{const wa=m.a.key===m.w.key,wb=m.b.key===m.w.key;
  return `<span class="s ${wa?'w':''}">${m.a.ab}</span><i>·</i><span class="s ${wb?'w':''}">${m.b.ab}</span>`;};
const v2=(m,hit)=>`${fl(m.w)}<b>${m.w.ab}</b>`;
const v3=(m)=>{const wa=m.a.key===m.w.key,wb=m.b.key===m.w.key;
  return `<div class="row ${wa?'w':''}">${fl(m.a)}${m.a.ab}</div><div class="row ${wb?'w':''}">${fl(m.b)}${m.b.ab}</div>`;};

function twin(variant,cls){
  return `<div class="twin ${cls}">
    <div class="tcol"><div class="twho you">Carlos (tú)</div>${tree(YOU,RIVAL,variant)}</div>
    <div class="tcol"><div class="twho rival">Agustín</div>${tree(RIVAL,YOU,variant)}</div>
  </div>`;
}

document.getElementById('root').innerHTML = `
  <div class="card">
    <div class="chead"><span class="opt">Idea 1</span><h3>Cruce en una línea (ESP · FRA)</h3>
      <p>Cada partido es UNA línea con los dos equipos; el que pasa va en negro/negrita, el otro en gris. La mitad de alto que las cajas apiladas → caben dos cuadros enteros. Muestra el enfrentamiento completo.</p></div>
    <div class="cbody">${twin(v1,'v1')}</div>
  </div>
  <div class="card">
    <div class="chead"><span class="opt">Idea 2</span><h3>Solo el que pasa (bandera + ABREV)</h3>
      <p>Cada casilla muestra únicamente el equipo que avanza (la siguiente ronda ya dice contra quién juega). Lo más compacto posible. En verde, donde el rival mete al mismo equipo.</p></div>
    <div class="cbody">${twin(v2,'v2')}</div>
  </div>
  <div class="card">
    <div class="chead"><span class="opt">Idea 3</span><h3>Caja mini apilada (abreviaturas)</h3>
      <p>El partido sigue siendo dos equipos apilados (estilo bracket clásico) pero con abreviaturas pequeñas, así que aun así caben dos cuadros. El que pasa, resaltado.</p></div>
    <div class="cbody">${twin(v3,'v3')}</div>
  </div>`;
</script>
</body></html>
