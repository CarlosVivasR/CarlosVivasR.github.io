<style>
  h1{font-size:clamp(1.9em,4vw,2.6em);font-weight:700;letter-spacing:-.02em;margin-bottom:4px;font-family:var(--disp)}
  .sub{color:var(--ink-2);margin-bottom:30px;font-size:.96em;max-width:60ch}
  h2.sec{font-size:1.4em;font-weight:700;margin:40px 0 8px;letter-spacing:-.01em;font-family:var(--disp)}
  h2.sec .k{color:var(--gold)}
  .secsub{color:var(--muted);font-size:.88em;margin-bottom:16px;max-width:64ch}
  /* hero metric */
  .hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px;padding:22px 22px 18px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(232,194,71,.07),rgba(255,255,255,.012))}
  .hero .big{font-family:var(--mono);font-weight:800;font-size:clamp(2.6em,8vw,3.6em);line-height:1;color:var(--gold)}
  .hero .biglab{font-size:.78em;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
  .hero .skill{font-family:var(--mono);font-weight:800;font-size:1.5em;color:var(--green)}
  .hero .skilllab{font-size:.8em;color:var(--ink-2);max-width:22ch}
  /* metric cards */
  .mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .mcard{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
  .mcard .v{font-family:var(--mono);font-weight:800;font-size:1.5em;color:var(--ink)}
  .mcard .l{font-size:.78em;color:var(--muted);margin-top:3px}
  .mcard .h{font-size:.74em;color:var(--ink-2);margin-top:7px;line-height:1.45}
  /* reliability diagram */
  .relwrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
  .relsvg{flex:1 1 360px;min-width:300px;max-width:480px}
  .rellegend{flex:1;min-width:220px;font-size:.86em;color:var(--ink-2);line-height:1.6}
  .rellegend b{color:var(--ink)}
  /* how it works steps */
  .steps{display:grid;gap:10px;margin-top:6px}
  .step{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
  .step .n{font-family:var(--mono);font-weight:800;color:var(--gold);font-size:1.05em;flex:none;width:26px}
  .step .t b{font-weight:700}
  .step .t p{color:var(--muted);font-size:.86em;margin-top:3px;line-height:1.5}
  .step .t code{font-family:var(--mono);font-size:.82em;color:var(--cyan);background:rgba(53,224,216,.08);padding:1px 6px;border-radius:5px}
  /* scope / uncertainty lists */
  .ulist{display:grid;gap:9px;margin-top:6px}
  .uitem{display:flex;gap:12px;padding:12px 15px;border-left:3px solid var(--line-2);background:rgba(255,255,255,.018);border-radius:0 10px 10px 0}
  .uitem.warn{border-left-color:var(--red)}
  .uitem .em{font-size:1.1em;flex:none}
  .uitem b{font-weight:700}.uitem p{color:var(--muted);font-size:.86em;margin-top:2px;line-height:1.5}
  .lvl{font-family:var(--mono);font-weight:800;color:var(--gold);flex:none}
  .note{margin:34px 0 10px;font-size:.8em;color:var(--muted);text-align:center;line-height:1.6}
</style>

const L=k=>wcT(T,k);
const fmtPct=x=>Math.round(x*100)+'%';

function reliabilitySVG(bins, ece){
  bins=(bins||[]).filter(b=>b&&Number.isFinite(b.pred)&&Number.isFinite(b.obs));
  if(!bins.length) return '<p style="color:var(--muted)">—</p>';
  const W=420,H=420,pad=46, x0=pad,y0=H-pad,x1=W-16,y1=16;
  const sx=p=>x0+p*(x1-x0), sy=p=>y0-p*(y0-y1);
  const grid=[0,.25,.5,.75,1].map(t=>`<line x1="${sx(t)}" y1="${y0}" x2="${sx(t)}" y2="${y1}" stroke="rgba(255,255,255,.06)"/><line x1="${x0}" y1="${sy(t)}" x2="${x1}" y2="${sy(t)}" stroke="rgba(255,255,255,.06)"/>`).join('');
  const diag=`<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" stroke="var(--gold)" stroke-opacity=".5" stroke-dasharray="5 5"/>`;
  const maxN=Math.max(...bins.map(b=>b.n||1),1);
  const pts=bins.map(b=>{const r=(5+7*Math.sqrt((b.n||1)/maxN)).toFixed(1); const px=Math.round(b.pred*100), ox=Math.round(b.obs*100);
    return `<circle cx="${sx(b.pred).toFixed(1)}" cy="${sy(b.obs).toFixed(1)}" r="${r}" fill="var(--cyan)" fill-opacity=".8" stroke="#03040c" stroke-width="1.2"><title>${px}% ${L('relPred')} → ${ox}% ${L('relObs')} · n=${b.n||0}</title></circle>`;}).join('');
  const axis=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="var(--line-2)"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--line-2)"/>`;
  const ticks=[0,.5,1].map(t=>`<text x="${sx(t)}" y="${y0+19}" fill="var(--muted)" font-size="12" text-anchor="middle" style="font-family:var(--mono)">${Math.round(t*100)}%</text><text x="${x0-9}" y="${sy(t)+4}" fill="var(--muted)" font-size="12" text-anchor="end" style="font-family:var(--mono)">${Math.round(t*100)}%</text>`).join('');
  const ariaTxt=`${L('secRel')} — ${bins.length} ${L('relBuckets')}, ECE ${ece!=null?(ece*100).toFixed(1)+'%':'—'}. ${L('relAria')}`;
  return `<svg class="relsvg" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="relTitle relDesc">
    <title id="relTitle">${L('secRel')}</title><desc id="relDesc">${ariaTxt}</desc>
    ${grid}${diag}${axis}${ticks}${pts}
    <text x="${(x0+x1)/2}" y="${H-8}" fill="var(--ink-2)" font-size="12.5" text-anchor="middle">${L('relPred')} →</text>
    <text transform="rotate(-90 15 ${(y0+y1)/2})" x="15" y="${(y0+y1)/2}" fill="var(--ink-2)" font-size="12.5" text-anchor="middle">${L('relObs')} →</text>
  </svg>`;
}

(async function(){
  let r;
  try{ r=await fetch('data/ratings.json',{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error(x.status);return x.json();}); }
  catch(e){ document.getElementById('wrap').innerHTML=`<p style="color:var(--red)">${L('fail')}</p>`; return; }
  const b=r.backtest||{};
  const rpsMajor=b.rps_major, base=b.baseline_climatology_rps, skill=base?Math.round((1-rpsMajor/base)*100):null;
  const bins=Array.isArray(b.reliability)?b.reliability:[];
  const step=(n,b_,p)=>`<div class="step"><div class="n">${n}</div><div class="t"><b>${b_}</b><p>${p}</p></div></div>`;
  const uitem=(lvl,b_,p,warn)=>`<div class="uitem${warn?' warn':''}"><span class="lvl">${lvl}</span><div><b>${b_}</b><p>${p}</p></div></div>`;
  const sc=(b_,p)=>`<div class="uitem"><span class="em" aria-hidden="true" style="color:var(--muted)">✕</span><div><b>${b_}</b><p>${p}</p></div></div>`;

  document.getElementById('wrap').innerHTML=`
    <h1>${L('title')}</h1>
    <p class="sub">${L('sub')}</p>

    <div class="hero">
      <div><div class="biglab">${L('bigLab')} · ${L('bigHelp')}</div><div class="big">${rpsMajor!=null?rpsMajor.toFixed(3):'—'}</div></div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="skill">${skill!=null?'+'+skill+'%':'—'}</div>
        <div class="skilllab">${L('skillLab')}</div>
      </div>
    </div>

    <div class="mcards">
      <div class="mcard"><div class="v">${b.acc!=null?fmtPct(b.acc):'—'}</div><div class="l">${L('mAcc')}</div><div class="h">${L('mAccH')}</div></div>
      <div class="mcard"><div class="v">${b.ece!=null?(b.ece*100).toFixed(1)+'%':'—'}</div><div class="l">${L('mEce')}</div><div class="h">${L('mEceH')}</div></div>
      <div class="mcard"><div class="v">${b.n!=null?b.n.toLocaleString():'—'}</div><div class="l">${L('mN')}</div><div class="h">${L('mNH')}</div></div>
    </div>

    <h2 class="sec">${L('secRel')}</h2>
    <p class="secsub">${L('secRelSub')}</p>
    <div class="relwrap">
      ${reliabilitySVG(bins, b.ece)}
      <div class="rellegend">${L('relLeg')}<br><br><span style="color:var(--muted);font-size:.9em">${L('relSize')}.</span></div>
    </div>

    <h2 class="sec">${L('secHow')}</h2>
    <p class="secsub">${L('secHowSub')}</p>
    <div class="steps">
      ${step(1,L('s1b'),L('s1p'))}${step(2,L('s2b'),L('s2p'))}${step(3,L('s3b'),L('s3p'))}${step(4,L('s4b'),L('s4p'))}
    </div>

    <h2 class="sec">${L('secScope')}</h2>
    <p class="secsub">${L('secScopeSub')}</p>
    <div class="ulist">
      ${sc(L('sc1b'),L('sc1p'))}${sc(L('sc2b'),L('sc2p'))}${sc(L('sc3b'),L('sc3p'))}${sc(L('sc4b'),L('sc4p'))}
    </div>

    <h2 class="sec">${L('secUnc')}</h2>
    <p class="secsub">${L('secUncSub')}</p>
    <div class="ulist">
      ${uitem('A',L('uAb'),L('uAp'))}${uitem('B',L('uBb'),L('uBp'))}${uitem('C',L('uCb'),L('uCp'))}
    </div>

    <p class="note">${L('note').replace('{date}', r.snapshot_date||'—')}</p>`;
})();
</script>
