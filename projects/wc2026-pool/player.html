<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player · WC 2026</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03040c;--ink:#fff;--ink-2:rgba(255,255,255,.9);--muted:rgba(255,255,255,.66);
    --gold:#e8c247;--gold-2:#f4d76b;--cyan:#35e0d8;--blue:#5b9bff;--red:#ff5a5f;
    --line:rgba(255,255,255,.12);--glass:rgba(13,17,32,.62);
    --mono:'JetBrains Mono',monospace;--disp:'Space Grotesk',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--cyan);text-decoration:none}
  /* ambient orbs */
  .orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(90px)}
  .orb1{width:520px;height:520px;background:#3a1f8e;opacity:.22;top:-160px;left:-120px}
  .orb2{width:460px;height:460px;background:#0a6e8e;opacity:.18;bottom:-180px;right:-100px}
  .orb3{width:360px;height:360px;background:#6e1f5e;opacity:.14;top:36%;left:55%}
  .grid-lines{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(3,4,12,.7);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1040px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:.92em}
  .nav{display:flex;align-items:center;gap:16px;font-size:.9em}
  .nav a{color:var(--ink-2);font-weight:600}
  .searchbtn{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:99px;
    padding:7px 14px;color:var(--muted);font:600 .82em 'Inter';cursor:pointer}
  .searchbtn:hover{border-color:var(--cyan);color:var(--ink)}
  .searchbtn kbd{font-family:var(--mono);font-size:.85em;background:rgba(255,255,255,.1);border-radius:4px;padding:1px 6px}

  .wrap{max-width:1040px;margin:0 auto;padding:22px 22px 90px;position:relative;z-index:2}

  /* context nav: back to team + prev/next teammate */
  .ctx{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .ctx a,.ctx span{display:inline-flex;align-items:center;gap:8px;font-size:.86em;font-weight:600;color:var(--ink-2);
    background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:8px 14px}
  .ctx a:hover{border-color:var(--cyan);color:var(--ink)}
  .ctx .teamlink img{width:22px;height:15px;object-fit:cover;border-radius:3px}
  .ctx .pn{display:flex;gap:8px}
  .ctx .pn a.disabled{opacity:.35;pointer-events:none}

  .glass{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 8px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.13)}

  /* header */
  .phead{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:22px;margin-bottom:18px}
  .ava{width:104px;height:104px;border-radius:18px;object-fit:cover;flex:none;background:#0a0e22;
    box-shadow:0 0 0 1px var(--line),0 0 30px rgba(53,224,216,.18)}
  .ava-i{width:104px;height:104px;border-radius:18px;flex:none;display:grid;place-items:center;font:800 2em var(--disp);
    background:linear-gradient(150deg,#1a2540,#0a0e22);color:var(--gold);box-shadow:0 0 0 1px var(--line)}
  .phead h1{font-family:var(--disp);font-size:clamp(1.8em,4vw,2.6em);font-weight:700;letter-spacing:-.01em;line-height:1.05}
  .phead .flag{width:28px;height:19px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:9px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .chip{font-size:.78em;font-weight:600;color:var(--ink-2);background:rgba(13,17,32,.5);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
  .chip b{font-family:var(--mono);color:var(--cyan)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{padding:22px}
  .panel h2{font-family:var(--disp);font-size:1.02em;font-weight:700;margin-bottom:3px}
  .panel .h-sub{font-size:.82em;color:var(--muted);margin-bottom:16px}
  .panel .h-sub b{font-family:var(--mono)}

  /* body map */
  .bodymap{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
  @media(max-width:520px){.bodymap{grid-template-columns:1fr}}
  .body-svg{width:100%;height:auto}
  .body-sil{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.2);stroke-width:1}
  .region{cursor:pointer}
  .region .mk{fill:var(--red);opacity:.85;transition:opacity .15s}
  .region .glow{fill:var(--red);opacity:.2}
  .region .ct{fill:#fff;font:800 10px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .region:hover .mk,.region.active .mk{opacity:1}
  .region:hover .glow,.region.active .glow{opacity:.22}
  .rd-head{font-family:var(--disp);font-weight:700;font-size:1.02em;text-transform:capitalize}
  .rd-sub{font-size:.8em;color:var(--muted);margin-bottom:12px}
  .inj-row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
  .inj-row .dt{font-family:var(--mono);font-size:.76em;color:var(--cyan);font-weight:700;min-width:72px}
  .inj-row .nm{font-size:.88em;font-weight:600}
  .inj-row .dd{margin-left:auto;font-family:var(--mono);font-size:.74em;color:var(--muted)}

  .vstat{display:flex;gap:24px;margin-bottom:14px}
  .vstat .v{font-family:var(--mono);font-size:1.5em;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .vstat .k{font-size:.68em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
  .vchart{width:100%;height:auto}.vchart .area{fill:rgba(53,224,216,.12)}.vchart .line{fill:none;stroke:var(--cyan);stroke-width:2}
  .vchart .dot{fill:var(--gold)}

  .timeline{display:flex;flex-direction:column}
  .tl-row{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.9em}
  .tl-row:first-child{border-top:none}
  .tl-row .yr{font-family:var(--mono);color:var(--cyan);font-weight:700;min-width:64px;font-size:.85em}
  .tl-row .mv .arr{color:var(--muted);margin:0 6px}
  .note{margin-top:24px;font-size:.78em;color:var(--muted);text-align:center}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#03040c">
</head>
<body>
<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="grid-lines"></div>

<script>window.PAGE={active:'squads',crumbs:[{label:'Plantillas',href:'plantillas.html'},{label:'…'}]};</script>
<div id="site-nav"></div>

<div class="wrap" id="wrap"><p style="color:var(--muted)">Cargando…</p></div>

<script src="assets/nav.js" defer></script>
<script src="assets/search.js" defer></script>
<script>
const PID=new URLSearchParams(location.search).get('id')||'45320';
const REGIONS={head:{x:120,y:46,label:'Cabeza'},neck:{x:120,y:86,label:'Cuello'},shoulder:{x:90,y:118,label:'Hombro'},
  chest:{x:120,y:140,label:'Pecho'},ribs:{x:150,y:158,label:'Costillas'},elbow:{x:62,y:208,label:'Codo'},
  hand:{x:50,y:262,label:'Mano / muñeca'},abdomen:{x:120,y:188,label:'Abdomen'},back:{x:120,y:170,label:'Espalda'},
  hip:{x:120,y:214,label:'Cadera'},groin:{x:120,y:230,label:'Ingle / aductor'},thigh:{x:104,y:268,label:'Muslo'},
  hamstring:{x:138,y:268,label:'Isquiotibial'},knee:{x:104,y:338,label:'Rodilla'},shin:{x:138,y:392,label:'Espinilla'},
  calf:{x:104,y:392,label:'Gemelo'},ankle:{x:120,y:446,label:'Tobillo'},foot:{x:120,y:476,label:'Pie'}};
const MONTHS={1:'ene',2:'feb',3:'mar',4:'abr',5:'may',6:'jun',7:'jul',8:'ago',9:'sep',10:'oct',11:'nov',12:'dic'};
const fmtDate=iso=>{if(!iso)return'';const[y,m]=iso.split('-');return`${MONTHS[+m]||''} ${y}`;};
const fmtVal=v=>v==null?'—':v>=1e6?'€'+(v/1e6).toFixed(v>=1e7?0:1)+'M':v>=1e3?'€'+Math.round(v/1e3)+'K':'€'+v;
const flagByNat={'Argentina':'ar','Germany':'de','Uruguay':'uy','France':'fr','Portugal':'pt','Spain':'es','Italy':'it','Netherlands':'nl','Brazil':'br','Chile':'cl','Colombia':'co','England':'gb-eng','Mexico':'mx'};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function main(){
  let p, sidx;
  try{ [p,sidx]=await Promise.all([
    fetch(`data/players/${PID}.json`).then(r=>r.json()),
    fetch('data/search_index.json').then(r=>r.json()).catch(()=>({players:[],teams:[]})),
  ]); }
  catch(e){ document.getElementById('wrap').innerHTML='<p style="color:var(--muted)">No se encontró la ficha.</p>'; return; }
  render(p,sidx);
}

function render(p,sidx){
  window.__p=p;
  // team context + prev/next teammate
  const me=sidx.players.find(x=>x.pid===PID);
  let ctxHTML='';
  if(me){
    const mates=sidx.players.filter(x=>x.team===me.team);
    const i=mates.findIndex(x=>x.pid===PID);
    const prev=mates[i-1], next=mates[i+1];
    const team=sidx.teams.find(t=>t.code===me.team)||{name:me.teamName,flag:me.flag};
    const cb=document.querySelector('.sn-crumbs');
    if(cb) cb.innerHTML=`<a href="plantillas.html">Plantillas</a><span class="sep">›</span><a href="team.html?code=${me.team}">${esc(team.name)}</a><span class="sep">›</span><span class="cur">${esc(p.name)}</span>`;
    document.title=`${p.name} · WC 2026`;
    ctxHTML=`<div class="ctx">
      <a class="teamlink" href="team.html?code=${me.team}"><img src="https://flagcdn.com/w40/${team.flag}.png"> ← ${esc(team.name)}</a>
      <div class="pn">
        <a class="${prev?'':'disabled'}" ${prev?`href="player.html?id=${prev.pid}"`:''} title="${prev?esc(prev.name):''}">← Anterior</a>
        <a class="${next?'':'disabled'}" ${next?`href="player.html?id=${next.pid}"`:''} title="${next?esc(next.name):''}">Siguiente →</a>
      </div></div>`;
  }

  const totalDays=p.injuries.reduce((a,i)=>a+(i.days||0),0);
  const fc=flagByNat[p.nationality]; const flag=fc?`<img class="flag" src="https://flagcdn.com/w40/${fc.split('-')[0]==='gb'?fc:fc}.png">`:'';
  const initials=p.name.split(' ').map(s=>s[0]).slice(0,2).join('');
  const avatar=`<img class="ava" src="assets/players/${p.player_id}.jpg" alt="${esc(p.name)}" onerror="this.outerHTML='<div class=ava-i>${initials}</div>'">`;

  document.getElementById('wrap').innerHTML=`
    ${ctxHTML}
    <div class="phead glass">
      ${avatar}
      <div>
        <h1>${flag}${esc(p.name)}</h1>
        <div class="chips">
          <span class="chip">${p.position||'—'}${p.sub_position?` · ${p.sub_position}`:''}</span>
          ${p.age?`<span class="chip"><b>${p.age}</b> años</span>`:''}
          ${p.caps!=null?`<span class="chip"><b>${p.caps}</b> internac. · <b>${p.intl_goals||0}</b> goles</span>`:''}
          ${p.height_cm?`<span class="chip"><b>${p.height_cm}</b> cm</span>`:''}
          ${p.foot?`<span class="chip">${p.foot==='right'?'Diestro':p.foot==='left'?'Zurdo':p.foot}</span>`:''}
          ${p.current_club?`<span class="chip">${esc(p.current_club)}</span>`:''}
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="panel glass">
        <h2>🩹 Historial de lesiones</h2>
        <div class="h-sub"><b style="color:var(--red)">${p.injuries.length}</b> lesiones · <b>${totalDays}</b> días de baja</div>
        <div class="bodymap"><div>${bodySVG(p)}</div><div class="inj-detail" id="injDetail"></div></div>
        <div class="h-sub" style="margin-top:12px">Pasa el ratón (o toca) una zona para ver esas lesiones.</div>
      </div>
      <div class="panel glass">
        <h2>📈 Valor de mercado</h2>
        <div class="h-sub">Histórico Transfermarkt</div>
        <div class="vstat">
          <div><div class="v">${fmtVal(p.market_value_eur)}</div><div class="k">actual</div></div>
          <div><div class="v">${fmtVal(p.highest_value_eur)}</div><div class="k">máximo</div></div>
        </div>
        ${valueChart(p.values)}
        <h2 style="margin-top:24px">👕 Clubes</h2>
        <div class="h-sub"><b>${p.clubs.length}</b> traspasos</div>
        <div class="timeline">${clubsTL(p.clubs)}</div>
      </div>
    </div>
    <div class="note">Foto: Wikimedia Commons (CC BY-SA) · datos del proyecto</div>`;

  const regs=Object.entries(p.injuries_by_region).sort((a,b)=>b[1].length-a[1].length);
  if(regs.length) showRegion(p,regs[0][0]); else document.getElementById('injDetail').innerHTML='<div style="color:var(--muted);font-size:.9em">Sin lesiones registradas.</div>';
}

function bodySVG(p){
  const sil=`<circle class="body-sil" cx="120" cy="46" r="24"/>
    <path class="body-sil" d="M120 70 C140 70 150 78 152 96 L168 120 L196 210 L176 218 L156 150 L156 200
      C156 230 150 250 150 250 L150 320 L156 470 L132 472 L120 330 L108 472 L84 470 L90 320 L90 250
      C90 250 84 230 84 200 L84 150 L64 218 L44 210 L72 120 L88 96 C90 78 100 70 120 70 Z"/>`;
  let mk='';
  for(const[reg,list]of Object.entries(p.injuries_by_region)){
    const R=REGIONS[reg]; if(!R)continue; const n=list.length, r=Math.min(18,7+n*0.9);
    mk+=`<g class="region" data-reg="${reg}"><circle class="glow" cx="${R.x}" cy="${R.y}" r="${r+7}"/>
      <circle class="mk" cx="${R.x}" cy="${R.y}" r="${r}"/><text class="ct" x="${R.x}" y="${R.y}">${n}</text></g>`;
  }
  return `<svg class="body-svg" viewBox="0 0 240 540" xmlns="http://www.w3.org/2000/svg">${sil}${mk}</svg>`;
}
function showRegion(p,reg){
  const list=(p.injuries_by_region[reg]||[]).slice().sort((a,b)=>(b.from||'').localeCompare(a.from||''));
  const R=REGIONS[reg]||{label:reg}; const td=list.reduce((a,i)=>a+(i.days||0),0);
  document.querySelectorAll('.region').forEach(g=>g.classList.toggle('active',g.dataset.reg===reg));
  document.getElementById('injDetail').innerHTML=`<div class="rd-head">${R.label}</div>
    <div class="rd-sub">${list.length} lesiones · ${td} días</div>
    ${list.map(i=>`<div class="inj-row"><span class="dt">${fmtDate(i.from)}</span><span class="nm">${esc(i.injury)}</span>${i.days?`<span class="dd">${i.days}d</span>`:''}</div>`).join('')}`;
}
function clubsTL(clubs){
  if(!clubs.length)return'<div style="color:var(--muted);font-size:.88em">Sin datos.</div>';
  return clubs.slice().reverse().map(c=>{const yr=(c.date||'').slice(0,4)||c.season||'';
    return`<div class="tl-row"><span class="yr">${yr}</span><span class="mv">${esc(c.from||'?')} <span class="arr">→</span> ${esc(c.to||'?')}</span></div>`;}).join('');
}
function valueChart(values){
  const pts=(values||[]).filter(v=>v.value!=null); if(pts.length<2)return'<div style="color:var(--muted);font-size:.88em">Sin histórico.</div>';
  const W=460,H=130,P=6,maxY=Math.max(...pts.map(v=>v.value));
  const sx=i=>P+(i/(pts.length-1))*(W-2*P), sy=v=>H-P-(v/(maxY||1))*(H-2*P);
  let d='',area=`M ${sx(0)} ${H-P}`;
  pts.forEach((v,i)=>{const x=sx(i),y=sy(v.value);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';area+=`L ${x.toFixed(1)} ${y.toFixed(1)} `;});
  area+=`L ${sx(pts.length-1)} ${H-P} Z`;
  return`<svg class="vchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path class="area" d="${area}"/><path class="line" d="${d}"/><circle class="dot" cx="${sx(pts.length-1)}" cy="${sy(pts[pts.length-1].value)}" r="3.5"/></svg>`;
}
document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('.region');if(g&&window.__p)showRegion(window.__p,g.dataset.reg);});
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.region');if(g&&window.__p)showRegion(window.__p,g.dataset.reg);});
main();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
