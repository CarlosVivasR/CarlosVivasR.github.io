const L=k=>wcT(T,k);
const isPh=n=>/^([12][A-L]|W\d+|L\d+|3[A-L])/i.test(n||'');
const norm=n=>(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z]/g,'').replace(/^usa$/,'unitedstates');
/* ESPN name aliases so schedule names match the live feed (e.g. "Czech Republic"→"Czechia") */
const T_ALIAS={czechrepublic:'czechia',drcongo:'congodr',turkey:'turkiye',unitedstatesofamerica:'unitedstates'};
const nrm2=n=>{ const x=norm(n); return T_ALIAS[x]||x; };
const ESPN_SB='https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611-20260719';
/* Pull FINISHED results live from ESPN and key them by the pair of teams, so the table
   updates itself during the tournament instead of waiting on the static results.json. */
async function fetchEspnResults(){
  const byPair={}; const pk=(a,b)=>[nrm2(a),nrm2(b)].sort().join('__');
  try{
    const sb=await fetch(ESPN_SB,{cache:'no-store'}).then(r=>r.json());
    (sb.events||[]).forEach(ev=>{
      const cs=(((ev.competitions||[])[0])||{}).competitors||[];
      const st=(((ev.status||{}).type||{}).state)||'';
      if(st!=='post'||cs.length!==2) return;                 // only count finished matches
      const h=cs.find(x=>x.homeAway==='home')||cs[0], a=cs.find(x=>x.homeAway==='away')||cs[1];
      const hn=(h.team||{}).displayName, an=(a.team||{}).displayName, hs=+h.score, as=+a.score;
      if(isNaN(hs)||isNaN(as)) return;
      byPair[pk(hn,an)]={[nrm2(hn)]:hs,[nrm2(an)]:as};
    });
  }catch(e){}
  return byPair;
}
let __idx, __sched={matches:[]}, __staticResults={}, __fifa={}, __rt=null;
/* ===== model-based group-stage Monte Carlo (qualification probabilities) =====
   Uses the same backtested Dixon-Coles params the match pages use (data/ratings.json):
   simulate every unplayed group game thousands of times, rebuild all 12 tables, take the
   top-2 of each group + the 8 best 3rd-placed, and tally how often each nation goes through. */
/* host advantage is venue-aware: only a host nation playing in ITS OWN country gets it.
   Neutral matches (the vast majority of a World Cup) and a host playing abroad get none. */
const HOSTCODE={unitedstates:'USA',mexico:'MEX',canada:'CAN'};
let __cityHost={};                       // venue city -> 'USA'|'MEX'|'CAN'
function venueHost(city){ if(!city) return null; return __cityHost[city]||__cityHost[String(city).toLowerCase()]||null; }
function fxLambdas(t1,t2,venC){
  const R=__rt; if(!R||!R.dc||!R.dc.teams) return [1.3,1.1];
  const a=R.dc.teams[nrm2(t1)], b=R.dc.teams[nrm2(t2)]; if(!a||!b) return [1.3,1.1];
  const mu=R.dc.mu||0, G=R.dc.gamma||0;
  const g1=(venC&&HOSTCODE[nrm2(t1)]===venC)?G:0, g2=(venC&&HOSTCODE[nrm2(t2)]===venC)?G:0;
  let tilt=0; const v=R.value; if(v&&v.logV){ const la=v.logV[nrm2(t1)], lb=v.logV[nrm2(t2)]; if(la!=null&&lb!=null) tilt=(v.beta||0)*(la-lb)*0.5; }
  return [Math.exp(mu+a.atk-b.def+g1+tilt), Math.exp(mu+b.atk-a.def+g2-tilt)];
}
function samplePois(l){ const e=Math.exp(-Math.max(0,l)); let k=0,p=1; do{ k++; p*=Math.random(); }while(p>e); return k-1; }
function poisArr(l){ const v=[]; let p=Math.exp(-Math.max(0,l)); for(let k=0;k<=8;k++){ v.push(p); p*=Math.max(0,l)/(k+1); } return v; }
function probs1x2(l1,l2){ const A=poisArr(l1),B=poisArr(l2); let h=0,d=0,w=0; for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++){ const p=A[i]*B[j]; if(i>j)h+=p; else if(i===j)d+=p; else w+=p; } const s=h+d+w||1; return [h/s,d/s,w/s]; }
function rps3(p,act){ const o=[0,0,0]; o[act]=1; let cp=0,co=0,s=0; for(let i=0;i<2;i++){ cp+=p[i]; co+=o[i]; s+=(cp-co)*(cp-co); } return s/2; }
/* reliability diagram: predicted confidence (x) vs observed accuracy (y); dots on the dashed
   diagonal = perfectly calibrated, dot size ∝ sample. From the backtest's reliability buckets. */
function reliaSvg(buckets){
  if(!buckets||buckets.length<2) return '';
  const W=200,H=200,p=18,lo=0.3, x=v=>p+((v-lo)/(1-lo))*(W-2*p), y=v=>H-p-((v-lo)/(1-lo))*(H-2*p);
  const grid=[0.4,0.6,0.8].map(v=>`<line x1="${x(v).toFixed(1)}" y1="${(H-p).toFixed(1)}" x2="${x(v).toFixed(1)}" y2="${p}" stroke="rgba(255,255,255,.05)"/><line x1="${p}" y1="${y(v).toFixed(1)}" x2="${(W-p).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(255,255,255,.05)"/>`).join('');
  const diag=`<line x1="${x(lo).toFixed(1)}" y1="${y(lo).toFixed(1)}" x2="${x(1).toFixed(1)}" y2="${y(1).toFixed(1)}" stroke="rgba(255,255,255,.28)" stroke-dasharray="4 3"/>`;
  const line=`<polyline points="${buckets.map(b=>`${x(b.pred).toFixed(1)},${y(b.obs).toFixed(1)}`).join(' ')}" fill="none" stroke="rgba(53,224,216,.5)" stroke-width="2"/>`;
  const dots=buckets.map(b=>`<circle cx="${x(b.pred).toFixed(1)}" cy="${y(b.obs).toFixed(1)}" r="${(3.5+Math.sqrt(b.n)/14).toFixed(1)}" fill="rgba(53,224,216,.85)" stroke="#0a0c18" stroke-width="1.2"><title>dice ${Math.round(b.pred*100)}% → acierta ${Math.round(b.obs*100)}% (n=${b.n})</title></circle>`).join('');
  const ax=`<text x="${W/2}" y="${H-3}" fill="var(--muted)" font-size="9" text-anchor="middle">${L('reliX')}</text><text x="6" y="${H/2}" fill="var(--muted)" font-size="9" text-anchor="middle" transform="rotate(-90 6 ${H/2})">${L('reliY')}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="reli-svg">${grid}${diag}${line}${dots}${ax}</svg>`;
}
function parseThird(ref){ const m=(ref||'').match(/^3([A-L/]+)$/); return m?new Set(m[1].split('/')):null; }
/* full-tournament Monte Carlo: group stage (→ qualification, #2) extended through the entire
   knockout bracket (→ deep-run + champion probabilities, #3). The 8 best thirds are assigned
   to their Round-of-32 slots by a constraint-respecting bipartite match (FIFA's mechanic). */
function simAll(fx, baseRows, koList, N){
  const groups={}; for(const k in baseRows){ const g=baseRows[k].g; (groups[g]=groups[g]||[]).push(k); }
  const gk=Object.keys(groups);
  const thirdSlots=[]; koList.forEach(ko=>{ const a=parseThird(ko.t1), b=parseThird(ko.t2); if(a)thirdSlots.push({mi:ko.i,side:'t1',allowed:a}); if(b)thirdSlots.push({mi:ko.i,side:'t2',allowed:b}); });
  const finalIdx=(koList.find(k=>k.round==='Final')||{}).i;
  const RL={'Round of 32':1,'Round of 16':2,'Quarter-final':3,'Semi-final':4,'Final':5};
  const cnt={}; for(const k in baseRows) cnt[k]={p1:0,p2:0,q:0,r16:0,qf:0,sf:0,fin:0,ch:0};
  for(let s=0;s<N;s++){
    const T={}; for(const k in baseRows){ const r=baseRows[k]; T[k]={pts:r.pts,gd:r.gf-r.ga,gf:r.gf,rk:Math.random()}; }
    for(const f of fx){ const a=samplePois(f.lam[0]), b=samplePois(f.lam[1]); const A=T[f.k1],B=T[f.k2]; if(!A||!B)continue;
      A.gf+=a;A.gd+=(a-b);B.gf+=b;B.gd+=(b-a); if(a>b)A.pts+=3; else if(a<b)B.pts+=3; else {A.pts++;B.pts++;} }
    const rank={}, thirds=[];
    for(const g of gk){ const ks=groups[g].slice().sort((x,y)=>(T[y].pts-T[x].pts)||(T[y].gd-T[x].gd)||(T[y].gf-T[x].gf)||(T[y].rk-T[x].rk)); rank[g]=ks;
      if(ks[0]){cnt[ks[0]].p1++;cnt[ks[0]].q++;} if(ks[1]){cnt[ks[1]].p2++;cnt[ks[1]].q++;}
      if(ks[2]) thirds.push({key:ks[2],g,pts:T[ks[2]].pts,gd:T[ks[2]].gd,gf:T[ks[2]].gf,rk:T[ks[2]].rk}); }
    thirds.sort((x,y)=>(y.pts-x.pts)||(y.gd-x.gd)||(y.gf-x.gf)||(y.rk-x.rk));
    const top8=thirds.slice(0,8); for(const t of top8) cnt[t.key].q++;
    const assign={}, used=new Array(top8.length).fill(false);
    (function bt(si){ if(si>=thirdSlots.length) return true; const sl=thirdSlots[si];
      for(let ti=0;ti<top8.length;ti++){ if(used[ti])continue; if(sl.allowed.has(top8[ti].g)){ used[ti]=true; assign[sl.mi+'_'+sl.side]=top8[ti].key; if(bt(si+1))return true; used[ti]=false; } }
      return false; })(0);
    const win={}, los={}, reach={};
    // W##/L## use 1-based FIFA match numbers; our koList/win/los are keyed by 0-based array index → −1
    const ref=(r,mi,side)=>{ r=(r||'').trim(); let m; if(r[0]==='3') return assign[mi+'_'+side]||null;
      if(m=r.match(/^([12])([A-L])$/)){ const arr=rank[m[2]]; return arr?arr[+m[1]-1]:null; }
      if(m=r.match(/^W(\d+)$/)) return win[+m[1]-1]||null; if(m=r.match(/^L(\d+)$/)) return los[+m[1]-1]||null; return null; };
    for(const ko of koList){ if(ko.round==='Match for third place') continue;
      const a=ref(ko.t1,ko.i,'t1'), b=ref(ko.t2,ko.i,'t2'); if(!a||!b) continue;
      const rl=RL[ko.round]||1; if(!reach[a]||reach[a]<rl)reach[a]=rl; if(!reach[b]||reach[b]<rl)reach[b]=rl;
      const [l1,l2]=fxLambdas(a,b,ko.venC); const ga=samplePois(l1), gb=samplePois(l2);
      let w,l; if(ga>gb){w=a;l=b;} else if(gb>ga){w=b;l=a;} else { if(Math.random()<0.5){w=a;l=b;}else{w=b;l=a;} }
      win[ko.i]=w; los[ko.i]=l;
    }
    if(finalIdx!=null && win[finalIdx]){ cnt[win[finalIdx]].ch++; const wf=win[finalIdx]; if(!reach[wf]||reach[wf]<5)reach[wf]=5; }
    for(const k in reach){ const r=reach[k]; if(r>=2)cnt[k].r16++; if(r>=3)cnt[k].qf++; if(r>=4)cnt[k].sf++; if(r>=5)cnt[k].fin++; }
  }
  const out={}; for(const k in cnt){ const c=cnt[k]; out[k]={p1:c.p1/N,p2:c.p2/N,q:c.q/N,r16:c.r16/N,qf:c.qf/N,sf:c.sf/N,fin:c.fin/N,ch:c.ch/N}; }
  return out;
}
async function main(){
  try{ __idx=await (await fetch('data/teams/index.json')).json(); }
  catch(e){ document.getElementById('wrap').innerHTML=`<p style="color:var(--muted)">${L('fail')}</p>`; return; }
  try{ __sched=await (await fetch('data/schedule.json')).json(); }catch(e){}
  try{ const r=await fetch('data/results.json',{cache:'no-store'}); if(r.ok){ __staticResults=(await r.json()).matches||{}; } }catch(e){}
  try{ __fifa=(await (await fetch('data/fifa_ranking.json')).json()).ranks||{}; }catch(e){}
  try{ __rt=await (await fetch('data/ratings.json',{cache:'no-store'})).json(); }catch(e){}
  try{ const hm=await (await fetch('data/host_maps.json')).json(); Object.entries(hm.countries||{}).forEach(([code,c])=>{ (c.cities||[]).forEach(ci=>{ __cityHost[ci.city]=code; __cityHost[String(ci.city).toLowerCase()]=code; }); }); }catch(e){}
  await render();
  /* keep it live: re-pull ESPN every 90s while the tab is visible */
  setInterval(()=>{ if(!document.hidden) render(); }, 90000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });
}
async function render(){
  const idx=__idx, sched=__sched, fifa=__fifa;
  const results={...__staticResults};                 // static file as the base
  const espn=await fetchEspnResults();                // live finished results override/fill
  (sched.matches||[]).forEach((m,i)=>{
    if(!m.group||isPh(m.team1)||isPh(m.team2)) return;
    const rec=espn[[nrm2(m.team1),nrm2(m.team2)].sort().join('__')];
    if(rec){ const s1=rec[nrm2(m.team1)], s2=rec[nrm2(m.team2)]; if(s1!=null&&s2!=null) results[String(i)]=[s1,s2]; }
  });
  // flag + code by normalised name (from index.json)
  const meta={}; idx.teams.forEach(t=>{ meta[norm(t.name)]={code:t.code,flag:t.flag,name:t.name,group:t.group}; });

  const stats={};                 // group -> normName -> row
  (sched.matches||[]).forEach((m,i)=>{
    if(!m.group) return;
    const g=m.group.replace(/^Group\s+/,'');
    (stats[g]=stats[g]||{});
    [m.team1,m.team2].forEach(n=>{ const k=norm(n); if(n&&!isPh(n)&&!stats[g][k]) stats[g][k]={key:k,name:n,pj:0,w:0,d:0,l:0,gf:0,ga:0}; });
    const sc=results[String(i)]; const A=stats[g][norm(m.team1)], B=stats[g][norm(m.team2)];
    if(Array.isArray(sc)&&sc.length===2&&A&&B){
      const a=+sc[0],b=+sc[1];
      A.pj++;B.pj++;A.gf+=a;A.ga+=b;B.gf+=b;B.ga+=a;
      if(a>b){A.w++;B.l++;}else if(a<b){B.w++;A.l++;}else{A.d++;B.d++;}
    }
  });

  const groups=Object.keys(stats).sort();
  /* qualification probabilities via the model Monte Carlo (only meaningful before the group stage ends) */
  let qual=null;
  if(__rt&&__rt.dc){
    const baseRows={}; groups.forEach(g=>Object.values(stats[g]).forEach(r=>{ baseRows[r.key]={g, pts:r.w*3+r.d, gf:r.gf, ga:r.ga}; }));
    const simFx=[]; (sched.matches||[]).forEach((mm,i)=>{ if(!mm.group||isPh(mm.team1)||isPh(mm.team2)||results[String(i)]) return;
      const g=mm.group.replace(/^Group\s+/,''); if(stats[g]&&stats[g][norm(mm.team1)]&&stats[g][norm(mm.team2)]) simFx.push({g,k1:norm(mm.team1),k2:norm(mm.team2),lam:fxLambdas(mm.team1,mm.team2,venueHost(mm.ground))}); });
    const koList=(sched.matches||[]).map((mm,i)=>({i,t1:mm.team1,t2:mm.team2,round:mm.round,venC:venueHost(mm.ground)})).filter(x=>{ const mm=sched.matches[x.i]; return !mm.group && /round of|final|quarter|semi|third/i.test(x.round||''); });
    try{ qual=simAll(simFx, baseRows, koList, 2500); }catch(e){ qual=null; }
  }
  const qCol = !!qual;
  /* #3 champion / deep-run section */
  let champHTML='';
  if(qual){
    const meta2={}; idx.teams.forEach(t=>{ meta2[norm(t.name)]={code:t.code,flag:t.flag,name:t.name}; });
    const ranked=Object.keys(qual).map(k=>({k,...qual[k],m:meta2[k]||{name:k}})).filter(x=>x.ch>0.002).sort((a,b)=>b.ch-a.ch).slice(0,16);
    if(ranked.length){
      const mx=ranked[0].ch||1; const pf=x=>x>=0.995?'✓':x<0.005?'<1%':Math.round(x*100)+'%';
      const rows=ranked.map((r,i)=>`<tr>
        <td class="pos">${i+1}</td>
        <td class="team"><a href="${r.m.code?`team.html?code=${r.m.code}`:'#'}">${r.m.flag?`<img src="https://flagcdn.com/w40/${r.m.flag}.png" alt="">`:''}<span>${r.m.name}</span></a></td>
        <td class="opt">${pf(r.sf)}</td><td class="opt">${pf(r.fin)}</td>
        <td class="ch"><div class="chbar"><span style="width:${Math.round(r.ch/mx*100)}%"></span></div><b>${pf(r.ch)}</b></td></tr>`).join('');
      champHTML=`<div class="champ glass"><h2>🏆 ${L('champTitle')}</h2><div class="champ-sub">${L('champSub')}</div>
        <table class="st champ-t"><thead><tr><th></th><th class="lt">${L('team')}</th><th class="opt">${L('cSF')}</th><th class="opt">${L('cFin')}</th><th>${L('cChamp')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
  }
  /* #5 model report card — rigorous backtest + leakage-free live forward-test on this WC */
  let cardHTML='';
  if(__rt&&__rt.backtest){
    const bt=__rt.backtest; let n=0,hits=0,rps=0;
    (sched.matches||[]).forEach((mm,i)=>{ if(!mm.group||isPh(mm.team1)||isPh(mm.team2)) return; const sc=results[String(i)]; if(!Array.isArray(sc)||sc.length!==2) return;
      const [l1,l2]=fxLambdas(mm.team1,mm.team2,venueHost(mm.ground)); const p=probs1x2(l1,l2); const a=+sc[0],b=+sc[1], oi=a>b?0:a<b?2:1;
      n++; if(p.indexOf(Math.max(p[0],p[1],p[2]))===oi)hits++; rps+=rps3(p,oi); });
    const liveLine = n ? L('cardLive').replace('{n}',n).replace('{hits}',hits).replace('{acc}',Math.round(hits/n*100)).replace('{rps}',(rps/n).toFixed(3))+(n<20?` · ${L('cardSmall')}`:'') : L('cardNone');
    const reli = (bt.reliability&&bt.reliability.length) ? `<div class="card-reli"><div class="reli-title">${L('reliTitle')}</div>${reliaSvg(bt.reliability)}<div class="reli-cap">${L('reliCap')}</div></div>` : '';
    cardHTML=`<div class="champ glass card"><h2>🔬 ${L('cardTitle')}</h2>
      <div class="champ-sub">${L('cardBt').replace('{n}',(bt.n||0).toLocaleString()).replace('{rps}',(+bt.rps).toFixed(3)).replace('{base}',(+(bt.baseline_climatology_rps||0)).toFixed(3)).replace('{acc}',Math.round((bt.acc||0)*100)).replace('{ece}',(+(bt.ece||0)).toFixed(3))}</div>
      <div class="card-ece">${L('cardEce').replace('{ece}',Math.round((bt.ece||0)*100))}</div>
      <div class="card-cols">${reli}<div class="card-livewrap"><div class="card-live">${liveLine}</div></div></div></div>`;
  }
  let html=`<h1>${L('title')}</h1>
    <div class="sub">${L('sub')}${qCol?` · <b>${L('cQual')}</b> ${L('qualSub')}`:''}</div>
    <div class="legend">
      <span><i style="background:#2ec27e"></i>${L('q1')}</span>
      <span><i style="background:#35e0d8"></i>${L('q2')}</span>
      <span><i style="background:#f4d76b"></i>${L('q3')}</span>
    </div>
    <div class="groups">`;
  groups.forEach(g=>{
    const rows=Object.values(stats[g])
      .map(r=>({...r,pts:r.w*3+r.d,dg:r.gf-r.ga}))
      .sort((x,y)=>y.pts-x.pts||y.dg-x.dg||y.gf-x.gf||x.name.localeCompare(y.name));
    let body='';
    rows.forEach((r,i)=>{
      const m=meta[r.key]||{flag:'',code:'',name:r.name};
      const flag=m.flag?`<img src="https://flagcdn.com/w40/${m.flag}.png" alt="">`:'';
      const link=m.code?`team.html?code=${m.code}`:'#';
      const cls=i===0?'q1':i===1?'q2':i===2?'q3':'';
      const q=qual?qual[r.key]:null, qv=q?q.q:0;
      const qtxt=!q?'':qv>=0.995?'✓':qv<=0.005?'·':Math.round(qv*100)+'%';
      const qcell=qCol?`<td class="qpct" style="background:rgba(46,194,126,${(qv*0.5).toFixed(3)})" title="${q?'P(1º) '+Math.round(q.p1*100)+'% · P(2º) '+Math.round(q.p2*100)+'%':''}">${qtxt}</td>`:'';
      body+=`<tr class="${cls}">
        <td class="pos">${i+1}</td>
        <td class="team"><a href="${link}">${flag}<span>${m.name}</span>${m.code&&fifa[m.code]?`<span class="fifa" title="Ranking FIFA">#${fifa[m.code]}</span>`:''}</a></td>
        <td class="opt">${r.w}</td><td class="opt">${r.d}</td><td class="opt">${r.l}</td>
        <td class="opt">${r.gf}</td><td class="opt">${r.ga}</td>
        <td class="pts">${r.pts}</td>${qcell}</tr>`;
    });
    html+=`<div class="group glass glass-hover"><h2>${L('grp')} ${g}</h2>
      <table class="st"><thead><tr>
        <th></th><th class="lt">${L('team')}</th>
        <th class="opt">${L('cG')}</th><th class="opt">${L('cE')}</th><th class="opt">${L('cP')}</th>
        <th class="opt">${L('cGF')}</th><th class="opt">${L('cGC')}</th><th>${L('cPts')}</th>${qCol?`<th title="${L('qualSub')}">${L('cQual')}</th>`:''}
      </tr></thead><tbody>${body}</tbody></table></div>`;
  });
  document.getElementById('wrap').innerHTML=html+`</div>`+champHTML+cardHTML;
}
main();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
