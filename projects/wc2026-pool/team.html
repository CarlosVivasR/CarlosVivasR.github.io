<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad · WC 2026</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B3%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .thead{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .thead .flag{width:52px;height:36px;object-fit:cover;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
  .thead h1{font-size:clamp(1.8em,4vw,2.6em);font-weight:700;letter-spacing:-.02em}
  .tsub{color:var(--ink-2);margin-bottom:4px;font-weight:500}.tsub b{font-family:var(--mono);color:var(--cyan)}.tsub b.red{color:var(--red)}
  .coach{font-size:.9em;color:var(--ink-2);margin-bottom:4px}.coach b{color:var(--ink);font-weight:700}
  .legend{font-size:.82em;color:var(--muted);margin-bottom:24px}
  /* probable XI on a pitch */
  .formation{background:linear-gradient(180deg,rgba(46,194,126,.10),rgba(255,255,255,.012));border:1px solid var(--line);
    border-radius:16px;padding:22px 10px;display:flex;flex-direction:column;gap:18px;margin-bottom:8px}
  /* each line stays on ONE row at any width → 4-3-3 structure is preserved */
  .fline{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap}
  .fp{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1 1 0;min-width:0;max-width:118px;text-align:center;color:var(--ink)}
  .fp:hover .pn{color:var(--cyan)}
  .fp .dot{width:32px;height:32px;border-radius:50%;background:rgba(13,17,32,.7);border:2px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.4);flex:none;
    display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:.82em;color:var(--gold-2)}
  .fp .pn{font-size:.74em;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
  @media(max-width:380px){ .fp .pn{font-size:.66em} .formation{padding:18px 6px} }
  .grouphead{font-size:.78em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:26px 0 12px}
  /* fixtures */
  .fixtures{padding:18px 20px;margin-bottom:8px}
  .fixtures h2{font-size:.78em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
  .fix{display:flex;align-items:center;gap:12px;padding:11px 6px;border-top:1px solid var(--line);color:var(--ink);transition:background .15s;border-radius:8px}
  .fix:first-of-type{border-top:none}
  .fix:hover{background:rgba(53,224,216,.1);color:var(--ink)}
  .fix .dt{font-family:var(--mono);font-size:.78em;color:var(--cyan);min-width:64px}
  .fix .opp{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95em}
  .fix .opp img{width:24px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .fix .rd{font-size:.72em;color:var(--muted);background:rgba(255,255,255,.06);border-radius:99px;padding:2px 9px}
  .fix .ven{margin-left:auto;font-size:.78em;color:var(--muted);text-align:right}
  .fix .go{color:var(--cyan);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:14px}
  .pcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 14px;cursor:pointer;color:var(--ink);position:relative}
  .pcard.nolink{cursor:default}
  .pcard .ph{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#0a0e22;box-shadow:0 0 0 1px var(--line-2),0 0 18px rgba(53,224,216,.12)}
  .pcard .avi{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font:800 1.3em var(--disp);background:linear-gradient(150deg,#1a2540,#0a0e22);border:1px solid var(--line-2);color:var(--gold)}
  .pcard .nm{font-weight:700;font-size:.92em;line-height:1.2}
  .pcard .cl{font-size:.74em;color:var(--muted);line-height:1.3}
  .pcard .dorsal{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:.82em;font-weight:800;color:var(--gold-2);min-width:18px;text-align:center}
  .pcard .injb{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:.68em;font-weight:800;color:#fff;background:var(--red);border-radius:99px;padding:2px 7px}
  .pcard .injb.zero{background:rgba(255,255,255,.12);color:var(--ink-2)}
  .note{margin-top:30px;font-size:.78em;color:var(--muted);text-align:center}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#03040c">
</head>
<body>
<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="grid-lines"></div>
<script>window.PAGE={active:'squads',crumbs:[{label:'Plantillas',href:'plantillas.html'},{label:'…'}]};</script>
<div id="site-nav"></div>
<div class="wrap" id="wrap"><p style="color:var(--muted)">Cargando…</p></div>
<script src="assets/nav.js" defer></script>
<script src="assets/search.js" defer></script>
<script src="assets/i18n.js"></script>
<script>
const T={
  es:{groups:['Porteros','Defensas','Centrocampistas','Delanteros','Otros'],months:['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],fail:'No hay datos para este equipo.',squad:'convocados',injTotal:'lesiones acumuladas en sus carreras',legend:'Lista oficial FIFA · clica un jugador para su ficha · pulsa <b style="font-family:var(--mono)">/</b> para buscar.',fixtures:'📅 Partidos',vs:'vs',note:'Fotos: Wikimedia Commons (CC BY-SA) · datos Transfermarkt',coach:'Entrenador',formation:'⚽ Once probable'},
  en:{groups:['Goalkeepers','Defenders','Midfielders','Forwards','Other'],months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],fail:'No data for this team.',squad:'called up',injTotal:'career injuries combined',legend:'Official FIFA squad · tap a player for their profile · press <b style="font-family:var(--mono)">/</b> to search.',fixtures:'📅 Matches',vs:'vs',note:'Photos: Wikimedia Commons (CC BY-SA) · data Transfermarkt',coach:'Coach',formation:'⚽ Probable XI'},
  tr:{groups:['Kaleciler','Defanslar','Orta saha','Forvetler','Diğer'],months:['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'],fail:'Bu takım için veri yok.',squad:'kadroda',injTotal:'kariyer boyu toplam sakatlık',legend:'Resmi FIFA kadrosu · profili için bir oyuncuya dokun · aramak için <b style="font-family:var(--mono)">/</b> tuşuna bas.',fixtures:'📅 Maçlar',vs:'-',note:'Fotoğraflar: Wikimedia Commons (CC BY-SA) · veri Transfermarkt',coach:'Teknik direktör',formation:'⚽ Muhtemel 11'}
};
const L=k=>wcT(T,k);
const CODE=new URLSearchParams(location.search).get('code')||'ARG';
function posGroup(pos){const t=(pos||'').toUpperCase();
  if(t.includes('GK'))return 0;if(t.includes('DF')||t.includes('DEF'))return 1;
  if(t.includes('MF')||t.includes('MID'))return 2;if(t.includes('FW')||t.includes('FOR'))return 3;return 4;}
const GROUPS=L('groups');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
let NUM={};
const dorsal=name=>NUM[norm(name)];
const MON=L('months');
const fmtD=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return`${+d} ${MON[+m-1]||''}`;};
async function main(){
  let d,sched,idx,coaches={},xi={};
  try{ [d,sched,idx]=await Promise.all([
    fetch(`data/teams/${CODE}.json`).then(r=>r.json()),
    fetch('data/schedule.json').then(r=>r.json()).catch(()=>({matches:[]})),
    fetch('data/teams/index.json').then(r=>r.json()).catch(()=>({teams:[]})),
  ]); }
  catch(e){ document.getElementById('wrap').innerHTML=`<p style="color:var(--muted)">${L('fail')}</p>`; return; }
  try{ coaches=(await (await fetch('data/coaches.json')).json()).coaches||{}; }catch(e){}
  try{ xi=await (await fetch('data/team_xi.json')).json(); }catch(e){}
  try{ NUM=(await (await fetch('data/numbers.json')).json())[CODE]||{}; }catch(e){}
  const cur=document.querySelector('.sn-crumbs .cur'); if(cur) cur.textContent=d.team;
  document.title=`${d.team} · WC 2026`;
  const totalInj=d.players.reduce((a,p)=>a+(p.injuries||0),0);
  const flag=d.flag?`<img class="flag" src="https://flagcdn.com/w80/${d.flag}.png">`:'';
  const groups={}; d.players.forEach(p=>{const g=posGroup(p.pos);(groups[g]=groups[g]||[]).push(p);});
  // fixtures for this team
  const flagByName={}; (idx.teams||[]).forEach(t=>flagByName[t.name]=t.flag);
  const matches=sched.matches||[];
  const fixtures=[];
  matches.forEach((m,i)=>{ if(m.team1===d.team||m.team2===d.team){
    const opp = m.team1===d.team ? m.team2 : m.team1;
    fixtures.push({i,opp,date:m.date,round:m.group||m.round,venue:m.ground});
  }});
  let html=`<div class="thead">${flag}<h1>${esc(d.team)}</h1></div>
    <div class="tsub"><b>${d.players.length}</b> ${L('squad')} · <b class="red">${totalInj}</b> ${L('injTotal')}</div>
    ${coaches[CODE]?`<div class="coach">🧑‍🏫 ${L('coach')}: <b>${esc(coaches[CODE])}</b></div>`:''}
    <div class="legend">${L('legend')}</div>`;
  // probable XI on a pitch
  const f=xi[CODE];
  if(f && (f.GK.length || f.DF.length || f.FW.length)){
    const fp=p=>{const n=p?dorsal(p.name):null;return `<a class="fp" href="${p&&p.pid?`player.html?id=${p.pid}`:'#'}"><span class="dot">${n!=null?n:''}</span><span class="pn">${esc(p?p.name:'')}</span></a>`;};
    const fline=arr=>`<div class="fline">${(arr||[]).map(fp).join('')}</div>`;
    html+=`<h2 class="grouphead" style="margin-top:0">${L('formation')}</h2>
      <div class="formation">${fline(f.FW)}${fline(f.MF)}${fline(f.DF)}${fline(f.GK)}</div>`;
  }
  if(fixtures.length){
    html+=`<div class="fixtures glass"><h2>${L('fixtures')}</h2>`;
    fixtures.forEach(f=>{
      const of=flagByName[f.opp]; const ofimg=of?`<img src="https://flagcdn.com/w40/${of}.png">`:'';
      html+=`<a class="fix" href="match.html?m=${f.i}">
        <span class="dt">${fmtD(f.date)}</span>
        <span class="opp">${L('vs')} ${ofimg}${esc(f.opp)}</span>
        <span class="rd">${esc(f.round||'')}</span>
        <span class="ven">${esc((f.venue||'').replace(/\s*\(.*\)/,''))} <span class="go">→</span></span></a>`;
    });
    html+=`</div>`;
  }
  [0,1,2,3,4].forEach(g=>{ if(!groups[g])return;
    html+=`<div class="grouphead">${GROUPS[g]}</div><div class="grid">`;
    groups[g].forEach(p=>{html+=card(p);}); html+=`</div>`; });
  document.getElementById('wrap').innerHTML=html+`<div class="note">${L('note')}</div>`;
}
function card(p){
  const initials=p.name.split(' ').map(s=>s[0]).slice(0,2).join('');
  const av=p.photo?`<img class="ph" src="${p.photo}" alt="${esc(p.name)}" loading="lazy" onerror="this.outerHTML='<div class=avi>${initials}</div>'">`:`<div class="avi">${initials}</div>`;
  const inj=p.injuries==null?'':`<span class="injb ${p.injuries===0?'zero':''}">🩹 ${p.injuries}</span>`;
  const tag=p.pid?'a':'div', href=p.pid?`href="player.html?id=${p.pid}"`:'', cls=p.pid?'pcard glass glass-hover':'pcard glass nolink';
  const n=dorsal(p.name); const numb=n!=null?`<span class="dorsal">${n}</span>`:'';
  return `<${tag} class="${cls}" ${href}>${numb}${inj}${av}<div class="nm">${esc(p.name)}</div><div class="cl">${esc(p.club||'')}</div></${tag}>`;
}
main();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").then(function(r){r&&r.update()}).catch(function(){})})}</script>
</body>
</html>
