<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match · WC 2026</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{--bg:#04060f;--bg-2:#0a0e22;--ink:#fff;--ink-2:rgba(255,255,255,.9);--muted:rgba(255,255,255,.55);
    --gold:#e8c247;--gold-2:#f4d76b;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.22);
    /* §3.1 match-center tokens */
    --mc-home:#5b9bff;--mc-away:#35e0d8;
    --win:#2ec27e;--draw:#9aa0aa;--loss:#ff5a5f;
    --q-auto:#2ec27e;--q-play:#e8c247;--q-out:rgba(255,255,255,.10);
    --mc-tab-h:46px;--mc-head-h:96px;--mc-topbar-h:50px;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--gold);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(4,6,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:920px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:.92em}
  .topbar-links{display:flex;gap:18px;font-size:.92em}.topbar-links a{color:var(--ink-2);font-weight:600}
  .wrap{max-width:920px;margin:0 auto;padding:26px 22px 80px}
  .eyebrow{text-align:center;font-size:.78em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}

  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:8px}
  .side{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:10px;border-radius:16px;transition:background .15s}
  a.side:hover{background:rgba(13,17,32,.5)}
  .side img.flag{width:92px;height:64px;object-fit:cover;border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.4)}
  .side .nm{font-weight:800;font-size:1.25em;line-height:1.15}
  .side .lk{font-size:.74em;color:var(--gold);font-weight:700}
  .side.tbd .nm{color:var(--muted)}
  .vs-mid{font-size:1.4em;font-weight:800;color:var(--muted)}
  .flag-ph{width:92px;height:64px;border-radius:8px;background:rgba(255,255,255,.06);border:1px dashed var(--line-strong)}

  .kick{text-align:center;margin:22px 0 26px}
  .kick .big{font-size:1.5em;font-weight:900}
  .kick .local{color:var(--ink-2);font-size:.95em;margin-top:4px}
  .kick .venuetime{color:var(--muted);font-size:.84em;margin-top:2px}

  .venue{display:grid;grid-template-columns:1.1fr .9fr;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
  @media(max-width:620px){.venue{grid-template-columns:1fr}}
  .venue .photo{width:100%;height:100%;min-height:200px;object-fit:cover;display:block;background:#0a0e22}
  .venue .vbody{padding:20px 22px}
  .venue .vname{font-weight:800;font-size:1.2em}
  .venue .vcity{color:var(--muted);font-size:.9em;margin-bottom:14px}
  .venue .vstats{display:flex;gap:22px;margin-bottom:14px}
  .venue .vstat .v{font-weight:900;color:var(--gold);font-size:1.15em}
  .venue .vstat .k{font-size:.68em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .venue .vfact{font-size:.88em;color:var(--ink-2);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
  .minimap{margin-top:14px}
  .minimap svg{width:100%;height:auto;max-height:160px}
  .minimap .coast{fill:rgba(255,255,255,.13);stroke:rgba(255,255,255,.42);stroke-width:1;vector-effect:non-scaling-stroke}
  .minimap .pin{fill:var(--gold)}.minimap .pinhalo{fill:var(--gold);opacity:.25}

  /* Section blocks */
  .block{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:18px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
  .block h3{font-size:.78em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
  /* comparison bars */
  .cmp-row{margin-bottom:13px}
  .cmp-row .lbl{display:flex;justify-content:space-between;font-size:.8em;color:var(--ink-2);margin-bottom:5px}
  .cmp-row .lbl .k{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:.82em;font-weight:700}
  .cmp-row .lbl b{font-variant-numeric:tabular-nums}
  .cmp-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
  .cmp-bar .l{background:linear-gradient(90deg,#5b9bff,#7db0ff)}.cmp-bar .r{background:linear-gradient(90deg,#f0a868,#e8c247)}
  /* h2h */
  .h2h-score{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
  .h2h-score .n{font-size:1.8em;font-weight:900}.h2h-score .n.w{color:var(--gold)}
  .h2h-score .mid{font-size:.74em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .h2h-last{text-align:center;font-size:.84em;color:var(--ink-2)}
  /* form */
  .form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .form-row .tn{font-weight:700;font-size:.9em;min-width:120px}
  .form-dots{display:flex;gap:6px}
  .fd{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:.72em;font-weight:800;color:#08111f}
  .fd.W{background:#2ec27e}.fd.D{background:#9aa0aa}.fd.L{background:#ff5a5f;color:#fff}
  .climate{display:flex;gap:22px;justify-content:center}
  .climate .ci{text-align:center}.climate .ci .v{font-size:1.5em;font-weight:900;color:var(--gold)}
  .climate .ci .k{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .scoreline{text-align:center;font-size:1.1em;font-weight:800;color:var(--muted);padding:8px 0}

  .squads{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .squads a{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:700;
    background:rgba(255,255,255,.06);border:1px solid var(--line-strong);color:var(--ink);font-size:.92em}
  .squads a:hover{background:rgba(255,255,255,.12)}
  .note{margin-top:26px;font-size:.8em;color:var(--muted);text-align:center}
  /* ===== live match section ===== */
  #live-box{margin:8px 0 6px}
  .lv-head{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:16px}
  .lv-head.in{border-color:rgba(224,70,74,.5);box-shadow:0 0 0 1px rgba(224,70,74,.2)}
  .lv-t{display:flex;align-items:center;gap:9px;font-weight:700;flex:1;justify-content:flex-end;min-width:0}
  .lv-t.r{justify-content:flex-start}
  .lv-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-t img{width:30px;height:21px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12);flex-shrink:0}
  .lv-sc{font-size:2.1em;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;min-width:96px;line-height:1}
  .lv-sc>span{opacity:.4;font-weight:600}
  .lv-st{font-size:.34em;font-weight:800;color:#ff7a7d;margin-top:5px;letter-spacing:.02em}
  .lv-pen{font-size:.4em;font-weight:800;color:var(--gold-2,#f4d76b);letter-spacing:.02em}
  .lv-block{margin-top:14px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .lv-block h4{margin:0 0 12px;font-size:.7em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pred{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:.76em;font-weight:800}
  .pred .pb{display:flex;align-items:center;justify-content:center;min-width:18px;color:#06121a}
  .pred .t1{background:var(--gold)} .pred .dr{background:#5b6472;color:#fff} .pred .t2{background:#35e0d8}
  .pred-lbl{display:flex;justify-content:space-between;font-size:.74em;color:var(--muted);margin-top:6px}
  .pred-lbl span:nth-child(2){text-align:center} .pred-lbl span:last-child{text-align:right}
  .pred-score{margin-top:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .pred-score .ps-h{flex-basis:100%;margin-bottom:7px;font-size:.72em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .pred-score .ps-cap{flex-basis:100%;font-size:.68em;color:var(--muted);opacity:.8;line-height:1.4;margin-top:2px}
  .pred-real{font-size:.82em;color:var(--muted);margin:-2px 0 10px}
  .pred-real b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05em}
  .pred-tag{font-size:.5em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;vertical-align:middle;margin-left:6px}
  .pred-tag.blend{background:rgba(53,224,216,.16);color:#35e0d8;border:1px solid rgba(53,224,216,.4)}
  .pred-tag.model{background:rgba(232,194,71,.14);color:var(--gold-2,#f4d76b);border:1px solid rgba(232,194,71,.4)}
  .pred-tag.market{background:rgba(255,255,255,.08);color:var(--muted);border:1px solid var(--line)}
  .pred-bt{margin-top:12px;font-size:.74em;color:var(--muted);line-height:1.45;padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.03);border:1px dashed var(--line)}
  .pred-xg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:.86em;flex-wrap:wrap}
  .pred-xg .pxg-k{font-weight:800;color:var(--muted);font-size:.92em}
  .pred-xg .pxg-v{font-weight:600;color:var(--ink-2)} .pred-xg .pxg-v b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .pred-sub{font-size:.72em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
  .pred-mkts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pmk{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .pmk-k{font-size:.74em;color:var(--muted);font-weight:600}
  .pmk-v{font-size:.95em;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  @media(max-width:640px){ .pred-mkts{grid-template-columns:1fr} }
  .ps-row{display:flex;gap:7px;flex-wrap:wrap}
  .ps{display:inline-flex;align-items:baseline;gap:3px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:800;font-size:.95em;color:var(--ink-2)}
  .ps i{font-style:normal;opacity:.45;font-weight:600}
  .ps b{font-size:.74em;font-weight:800;color:var(--muted);margin-left:3px}
  .ps.top{background:rgba(232,194,71,.14);border-color:rgba(232,194,71,.45);color:var(--ink)}
  .ps.top b{color:var(--gold-2,#f4d76b)}
  .ev-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.88em}
  .ev-row:last-child{border-bottom:0} .ev-min{color:var(--gold);font-weight:800;width:36px;font-variant-numeric:tabular-nums}
  .ev-tx{color:var(--ink-2)}
  .stat-row{margin-bottom:13px} .stat-row:last-child{margin-bottom:0}
  .stat-top{display:flex;justify-content:space-between;align-items:center;font-size:.86em;margin-bottom:5px}
  .stat-top .sk{color:var(--muted)} .stat-top .sv{font-weight:800;min-width:42px}
  .stat-top .sv:last-child{text-align:right}
  .stat-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
  .stat-bar .l{background:var(--gold)} .stat-bar .r{background:#35e0d8}
  .lineups{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .lu-h{font-weight:800;margin-bottom:9px;font-size:.95em} .lu-form{color:var(--gold);font-size:.82em;margin-left:6px;font-weight:700}
  .pl{display:flex;align-items:center;gap:9px;font-size:.84em;padding:3px 0}
  .pl .pn{width:20px;text-align:center;color:var(--muted);font-family:var(--mono,monospace);font-weight:700;flex-shrink:0}
  .pl .pnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl .pp{margin-left:auto;color:var(--muted);font-size:.85em;flex-shrink:0}
  .lu-subs{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .lu-subs b{display:block;font-size:.66em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
  .lu-subs .pl{opacity:.72}
  /* formation pitch */
  .pf{display:flex;justify-content:space-between;font-size:.8em;font-weight:700;color:var(--ink-2);margin-bottom:9px}
  .pitch{position:relative;background:linear-gradient(180deg,#176540,#0e4a30);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 4px;display:flex;flex-direction:column;overflow:hidden}
  .pitch::before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.16);border-radius:8px;pointer-events:none}
  .pteam{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px;z-index:1}
  .pline{height:1px;background:rgba(255,255,255,.2);margin:7px 12px;position:relative}
  .pline::after{content:"";position:absolute;left:50%;top:50%;width:36px;height:36px;border:1px solid rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%)}
  .frow{display:flex;justify-content:space-around;gap:3px}
  .fpos{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 0;min-width:0;max-width:78px}
  .fdot{width:26px;height:26px;border-radius:50%;background:#fff;color:#0a3b26;display:grid;place-items:center;font-weight:900;font-size:.72em;font-family:var(--mono,monospace);box-shadow:0 1px 3px rgba(0,0,0,.45)}
  .fnm{font-size:.58em;font-weight:700;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .lu-h2{font-size:.66em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
  .subs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .subs-col b{display:block;font-size:.8em;font-weight:800;margin-bottom:6px}
  .sub-pl{display:block;font-size:.8em;color:var(--ink-2);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-pl i{color:var(--muted);font-style:normal;font-family:var(--mono,monospace);margin-right:5px}
  .ev-ic{font-size:1.05em}
  /* commentary */
  .cm-list{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .cm-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85em}
  .cm-row:last-child{border-bottom:0}
  .cm-min{color:var(--gold);font-weight:800;min-width:34px;font-variant-numeric:tabular-nums;flex-shrink:0}
  .cm-tx{color:var(--ink-2);line-height:1.45}
  @media(max-width:640px){ .lineups,.subs{grid-template-columns:1fr} .lv-sc{font-size:1.8em;min-width:80px} .fnm{font-size:.52em} .fdot{width:23px;height:23px} }

  /* ================= MATCH CENTER SHELL (C1/C2/C3 · §3.4/§3.5) ================= */
  /* sticky score header — lifted lv-head, survives tab switches, fixed height */
  #mc-header{position:sticky;top:var(--mc-topbar-h);z-index:40;background:rgba(4,6,15,.92);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  #mc-header .mch-inner{max-width:920px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px}
  #mc-header .lv-head{background:transparent;border:0;border-radius:0;padding:0;flex:1;box-shadow:none}
  #mc-header .lv-head.in{border:0;box-shadow:none}
  #mc-header .lv-head.in .lv-sc{position:relative}
  #mc-header .lv-head.in .lv-sc::before{content:"";position:absolute;left:-14px;top:6px;width:8px;height:8px;border-radius:50%;
    background:#ff5a5f;box-shadow:0 0 0 4px rgba(255,90,95,.18);animation:mcpulse 1.6s ease-in-out infinite}
  @keyframes mcpulse{0%,100%{opacity:1}50%{opacity:.35}}
  .mc-goalflash{animation:mcgoal .9s ease-out}
  @keyframes mcgoal{0%{color:var(--gold-2);text-shadow:0 0 14px rgba(244,215,107,.8)}100%{color:var(--ink);text-shadow:none}}

  /* tab strip — sticky under header */
  #mc-tabs{position:sticky;top:calc(var(--mc-topbar-h) + var(--mc-head-h));z-index:39;background:rgba(4,6,15,.92);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  #mc-tabs .mct-inner{max-width:920px;margin:0 auto;padding:0 22px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  #mc-tabs .mct-inner::-webkit-scrollbar{display:none}
  .mc-tab{position:relative;flex:0 0 auto;scroll-snap-align:center;background:none;border:0;cursor:pointer;
    height:var(--mc-tab-h);min-height:44px;padding:0 14px;color:var(--muted);font-family:inherit;font-weight:700;font-size:.86em;
    letter-spacing:.01em;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .mc-tab[aria-selected="true"]{color:var(--ink)}
  .mc-tab::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;background:var(--gold);
    transform:scaleX(0);transform-origin:center;transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .mc-tab[aria-selected="true"]::after{transform:scaleX(1)}
  .mc-tab[hidden]{display:none}
  .mc-tab .mc-livedot{width:7px;height:7px;border-radius:50%;background:#ff5a5f;animation:mcpulse 1.6s ease-in-out infinite}

  /* panel — swaps with cross-fade */
  #mc-panel{max-width:920px;margin:0 auto;padding:22px 22px 80px}
  #mc-panel .mc-tabpane{animation:mcfade .12s ease-out}
  @keyframes mcfade{from{opacity:0}to{opacity:1}}
  .mc-empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:.9em}

  /* ===== C4 win-prob disclosure ===== */
  .pred-note{font-size:.72em;color:var(--muted);margin-top:9px;line-height:1.45}
  .pred-note b{color:var(--ink-2);font-weight:700}

  /* ===== C5 mirrored timeline (§3.3) ===== */
  .mc-tl{position:relative;padding:4px 0}
  .mc-tl.mirror::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--gold),transparent);transform:translateX(-.5px)}
  .mc-tl-row{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;gap:6px;padding:5px 0}
  .mc-tl-side{display:flex;align-items:center;gap:8px;font-size:.86em;color:var(--ink-2);min-width:0}
  .mc-tl-side.h{justify-content:flex-end;text-align:right}
  .mc-tl-side.a{justify-content:flex-start;text-align:left}
  .mc-tl-side .ev-ic{font-size:1.05em;flex-shrink:0}
  .mc-tl-side .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-tl-min{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.78em;color:var(--gold);text-align:center;
    font-variant-numeric:tabular-nums}
  .mc-tl-row.goal .ev-ic{animation:mcpop .5s cubic-bezier(.2,1.4,.5,1)}
  @keyframes mcpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
  /* flat fallback reuses .ev-row */

function parseKick(date,time){
  const m=(time||'').match(/(\d{1,2}):(\d{2})\s*UTC([+-]\d{1,2})/);
  if(!m) return null;
  const hh=m[1].padStart(2,'0'), mm=m[2], off=m[3];
  const sign=off[0], hrs=String(Math.abs(+off)).padStart(2,'0');
  return new Date(`${date}T${hh}:${mm}:00${sign}${hrs}:00`);
}

  function teamOf(name){ if(!name) return null; if(teamByName[name]) return teamByName[name]; const n=tnorm(name); return teamByNorm[n]||teamByNorm[NAME_ALIAS[n]]||null; }

  window.__agg=agg||{}; window.__prev=(prev.previews||[])[MIDX]||null;
  // venue lookup
  let venue=null, vcountry=null;
  for(const code of Object.keys(maps.countries)){
    const c=maps.countries[code].cities.find(c=>c.city===m.ground);
    if(c){ venue=c; vcountry=code; break; }
  }
  window.__teamByName=teamByName;
  window.__vcountry=vcountry;                 // venue country (USA/CAN/MEX) → host-advantage detection
  render(m,teamByName,venue,vcountry,maps);
  loadMatchLive(m);
}

function sideHTML(name,teamByName){
  if(isPlaceholder(name)) return `<div class="side tbd"><div class="flag-ph"></div><div class="nm">${name||'Por definir'}</div></div>`;
  const t=(window.__teamOf?window.__teamOf(name):teamByName[name]);
  const flag=t?`<img class="flag" src="https://flagcdn.com/w160/${t.flag}.png" alt="${name}">`:`<div class="flag-ph"></div>`;
  if(t) return `<a class="side" href="team.html?code=${t.code}">${flag}<div class="nm">${name}</div><div class="lk">Ver plantilla →</div></a>`;
  return `<div class="side"><div class="flag-ph"></div><div class="nm">${name}</div></div>`;
}

function miniMap(venue,vcountry,maps){
  if(!venue||!BBOX[vcountry]) return '';
  const [minLon,maxLon,minLat,maxLat]=BBOX[vcountry];
  const W=420, midLat=(minLat+maxLat)/2, kx=Math.cos(midLat*Math.PI/180);
  const wLon=(maxLon-minLon)*kx, wLat=(maxLat-minLat), scale=W/wLon, H=Math.round(wLat*scale);
  const proj=(lon,lat)=>[((lon-minLon)*kx*scale).toFixed(1),((maxLat-lat)*scale).toFixed(1)];
  let paths='';
  maps.countries[vcountry].outline.forEach(ring=>{
    let d=''; ring.forEach((pt,i)=>{const[x,y]=proj(pt[0],pt[1]); d+=(i?'L':'M')+x+' '+y;}); d+='Z';
    paths+=`<path class="coast" d="${d}"/>`;
  });
  const [px,py]=proj(venue.lon,venue.lat);
  return `<div class="minimap"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${paths}
    <circle class="pinhalo" cx="${px}" cy="${py}" r="9"/><circle class="pin" cx="${px}" cy="${py}" r="4.5"/></svg></div>`;
}

function render(m,teamByName,venue,vcountry,maps){

function formationRows(team){

  const rows=[]; let i=0;

let __evId=null, __mref=null, __lastSum=null, __sumAt=0, __lvBusy=false;
const matchEvent=(sb,m)=>(sb&&sb.events||[]).find(e=>{ const cs=((e.competitions||[])[0]||{}).competitors||[]; const ns=cs.map(c=>nrmt((c.team||{}).displayName)); return ns.includes(nrmt(m.team1))&&ns.includes(nrmt(m.team2)); });
async function loadMatchLive(m){

  // Find the event by the match's OWN date (so FINISHED/past matches resolve, not just today),
  // with a day's slack for timezone edges, and the full tournament range as a final fallback.
  const dp=(m.date||'').replace(/-/g,'');
  const day=(off)=>{ if(!dp) return null; const d=new Date(Date.UTC(+dp.slice(0,4),+dp.slice(4,6)-1,+dp.slice(6,8)+off)); return d.toISOString().slice(0,10).replace(/-/g,''); };
  const urls=[];

  urls.push(ESPN_SB+'?dates=20260611-20260719', ESPN_SB);
  let ev=null;
  for(const u of urls){ let sb; try{ sb=await fetch(u,{cache:'no-store'}).then(r=>r.json()); }catch(e){ continue; } ev=matchEvent(sb,m); if(ev) break; }
  if(!ev) return;                       // not in ESPN feed → keep the static preview
  __evId=ev.id;

  if((((ev.status||{}).type||{}).state)==='in' && !window.__lvT) window.__lvT=setInterval(refreshLive, 30000);

  }); }
}
async function refreshLive(){
  if(!__evId||!__mref||__lvBusy||document.hidden) return;   // skip overlap + work while tab hidden
  __lvBusy=true;
  try{
    let sb; try{ sb=await fetch(ESPN_SB,{cache:'no-store'}).then(r=>r.json()); }catch(e){}
    const ev=sb&&(sb.events||[]).find(e=>String(e.id)===String(__evId));
    if(!ev) return;
    // §5.3 tab-aware cadence: light scoreboard drives score+clock every 30s.
    // Heavy summary (stats/lineups/commentary) refreshes at most every 60s when a summary-backed
    // tab is active (details/stats/lineups/comm); paused on standings/h2h/bracket (90s when inactive).
    const at=((window.__mc||{}).activeTab)||'details';

/* ====================================================================
   C4 — largest-remainder (Hamilton) de-vig. Replaces A=100-H-D.
   Input: three raw implied probs (any scale). Output: [H,D,A] ints summing to 100.
   ==================================================================== */
/* Shin (1991/93) de-vig: corrects the favourite–longshot bias that proportional de-vig
   leaves in. z=0 reproduces proportional; z>0 shifts mass to the favourite. Bisection,
   zero free params (z solved per-match). Literature-standard estimator. */
function shinFair(r){ const B=r.reduce((a,b)=>a+b,0);
  if(!(B>1)||r.some(x=>!(x>0))) return r.map(x=>x/B);
  const p=z=>r.map(ri=>(Math.sqrt(z*z+4*(1-z)*ri*ri/B)-z)/(2*(1-z)));
  const f=z=>p(z).reduce((a,b)=>a+b,0)-1;
  let lo=0,hi=0.5; if(f(hi)>0) hi=0.99;
  for(let it=0;it<60;it++){ const mid=(lo+hi)/2; if(f(mid)>0) lo=mid; else hi=mid; }
  const out=p((lo+hi)/2), s=out.reduce((a,b)=>a+b,0); return out.map(x=>x/s);
}
function devig3(hp,ap,dp){            // returns [H,D,A] ints summing to 100 — Shin de-vig
  const raw=shinFair([hp,dp,ap]).map(v=>v*100);   // shinFair internal order H,D,A
  const fl=raw.map(Math.floor), rem=100-fl.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<rem;k++) fl[order[k][1]]++;
  return fl;                          // [H,D,A], D=index 1 matches bar markup
}
/* ====================================================================
   Predicted scoreline — independent Poisson model whose expected goals
   (lambda1, lambda2) are REVERSE-ENGINEERED from the de-vigged 1X2 odds.
   This is the standard "expected goals from odds" technique; pure Poisson
   (no fitted Dixon-Coles rho) is used as the honest baseline. Probabilities
   are exact, but the MODE of the distribution has low probability (~8-15%),
   so it is shown as "most likely", never as a certainty.
   ==================================================================== */
const MAXG=8;                          // goals grid 0..8 (tail mass negligible for lambda<4.5)
const DC_RHO=0.13;                     // Dixon-Coles low-score dependence (Coles & Dixon 1997); fixed, not fitted
function poisPmf(lam){ const v=[]; let p=Math.exp(-lam); for(let k=0;k<=MAXG;k++){ v.push(p); p*=lam/(k+1); } return v; }
function dcTau(i,j,l1,l2,rho){ if(i===0&&j===0) return 1-l1*l2*rho; if(i===0&&j===1) return 1+l1*rho; if(i===1&&j===0) return 1+l2*rho; if(i===1&&j===1) return 1-rho; return 1; }
/* rho optional: pure independent Poisson for the FIT (so the 1X2 bar/disclosure stay exact);
   Dixon-Coles correction only for the DISPLAY grid, then renormalised so chip %s sum to 100. */
function scoreGrid(l1,l2,rho){ const a=poisPmf(l1), b=poisPmf(l2), M=[]; let s=0;
  for(let i=0;i<=MAXG;i++){ M[i]=[]; for(let j=0;j<=MAXG;j++){ let p=a[i]*b[j]; if(rho) p=Math.max(0,p*dcTau(i,j,l1,l2,rho)); M[i][j]=p; s+=p; } }
  if(rho&&s>0) for(let i=0;i<=MAXG;i++)for(let j=0;j<=MAXG;j++) M[i][j]/=s;
  return M; }
function gridOutcome(M){ let h=0,d=0,w=0; for(let i=0;i<M.length;i++)for(let j=0;j<M.length;j++){ const p=M[i][j]; if(i>j)h+=p; else if(i===j)d+=p; else w+=p; } return [h,d,w]; }
/* fit (lambda_team1, lambda_team2) so the pure-Poisson 1X2 matches the de-vigged target (pH,pD,pA in 0..1) */
function fitLambdas(pH,pD,pA){
  const err=(l1,l2)=>{ const o=gridOutcome(scoreGrid(l1,l2)); return Math.abs(o[0]-pH)+Math.abs(o[1]-pD)+Math.abs(o[2]-pA); };
  let best={l1:1.3,l2:1.1,e:1e9};
  for(let l1=0.15;l1<=5.5;l1+=0.1) for(let l2=0.15;l2<=5.5;l2+=0.1){ const e=err(l1,l2); if(e<best.e) best={l1,l2,e}; }   // cap 5.5: heavy favourites need lambda>4.2
  for(let l1=Math.max(0.05,best.l1-0.1);l1<=best.l1+0.1;l1+=0.02) for(let l2=Math.max(0.05,best.l2-0.1);l2<=best.l2+0.1;l2+=0.02){ const e=err(l1,l2); if(e<best.e) best={l1,l2,e}; }
  return best;                         // {l1,l2,e}
}
function topScorelines(l1,l2,n,rho){ const M=scoreGrid(l1,l2,rho),arr=[]; for(let i=0;i<M.length;i++)for(let j=0;j<M.length;j++) arr.push({i,j,p:M[i][j]}); arr.sort((x,y)=>y.p-x.p); return arr.slice(0,n); }
/* ====================================================================
   Backtested ratings model (Dixon-Coles core + Elo + log-pool blend with
   the market). Params pre-fitted offline on 49k internationals -> ratings.json
   (RPS 0.169, 60% acc, ECE 0.03). λ come from team ratings (data), the 1X2 is
   blended with the de-vigged odds when they exist, and falls back to the model
   alone when they don't — so every fixture gets a prediction. See wc2026_pool_model/.
   ==================================================================== */
let __ratings=null;
async function loadRatings(){ if(__ratings!==null) return __ratings; try{ __ratings=await fetch('data/ratings.json',{cache:'no-store'}).then(r=>r.json()); }catch(e){ __ratings=false; } return __ratings; }
/* hostAdv: 0 = neutral (default), 1 = team1 plays at home, 2 = team2 — applies the fitted
   home-advantage γ to the host side. WC2026 is neutral EXCEPT host nations at their own venue
   (validated: the all-neutral assumption under-predicted host wins by ~19pp). */
/* current-squad market-value tilt (validated OOS, ΔRPS-0.0009): shifts the goal rates
   toward the better-valued squad. ±0.5·β·(logV_home − logV_away). Absent team → 0 (no harm). */
function valTilt(t1,t2){ const v=__ratings&&__ratings.value; if(!v||!v.logV) return 0; const a=v.logV[nrmt(t1)], b=v.logV[nrmt(t2)]; if(a==null||b==null) return 0; return (v.beta||0)*(a-b); }
function dcLambdas(t1,t2,hostAdv){
  const R=__ratings; if(!R||!R.dc) return null;
  const a=R.dc.teams[nrmt(t1)], b=R.dc.teams[nrmt(t2)]; if(!a||!b) return null;   // nrmt keys match ratings.json
  const G=R.dc.gamma||0, g1=hostAdv===1?G:0, g2=hostAdv===2?G:0, h=valTilt(t1,t2)*0.5;
  return [ Math.exp(R.dc.mu + a.atk - b.def + g1 + h), Math.exp(R.dc.mu + b.atk - a.def + g2 - h) ];
}
function teamHostCode(name){ const k=nrmt(name); return k==='unitedstates'?'USA':k==='mexico'?'MEX':k==='canada'?'CAN':null; }
function modelRho(){ const R=__ratings; return (R&&R.dc&&typeof R.dc.rho==='number')?R.dc.rho:DC_RHO; }
function logPool(model,market,w){ const o=[0,1,2].map(i=>Math.pow(Math.max(model[i],1e-9),w)*Math.pow(Math.max(market[i],1e-9),1-w)); const s=o[0]+o[1]+o[2]; return o.map(x=>x/s); }
/* keep the model's total goals (data-driven level), fit only the supremacy to a target 1X2 */
function fitSupremacy(mu,pH,pA,rho){ let best=null; for(let d=-(mu-0.2); d<=(mu-0.2); d+=0.04){ const l1=(mu+d)/2,l2=(mu-d)/2; if(l1<=0.05||l2<=0.05) continue; const o=gridOutcome(scoreGrid(l1,l2,rho)); const e=Math.abs(o[0]-pH)+Math.abs(o[2]-pA); if(!best||e<best.e) best={l1,l2,e}; } return best; }
function pct100(p){ const raw=p.map(x=>x*100), fl=raw.map(Math.floor); let rem=100-fl.reduce((a,b)=>a+b,0); const ord=raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]); for(let k=0;k<rem;k++) fl[ord[k][1]]++; return fl; }
/* ====================================================================
   C7 — twin-bar 3-way classification (module-level). Dispatch on the
   normalised metric name (trailing % stripped). ESPN labels seen in the
   fixture: Possession, SHOTS, ON GOAL, On Target %, Pass Completion %,
   Corner Kicks, Fouls, Offsides, Yellow/Red Cards, Saves, Accurate Passes…
   ==================================================================== */
const SHARE_OF_TOTAL  = new Set(['possession','total shots','shots','shots on target','on goal',
                                 'total passes','passes','accurate passes','corner kicks',
                                 'attacks','dangerous attacks','crosses','accurate crosses']);
const INDEPENDENT_PCT = new Set(['pass accuracy','pass completion','save percentage',
                                 'tackle success','on-target','on target','cross','long balls']);
const NUMBER_PAIR     = new Set(['fouls','yellow cards','red cards','saves','offsides',
                                 'throw ins','interceptions','blocked shots','clearances',
                                 'effective clearances','tackles','long balls','penalty goals',
                                 'penalty kicks taken','effective tackles','accurate long balls']);
/* raw label (incl. trailing %) drives a deterministic %→PCT route before set lookup,
   so "Long Balls" (count→SHARE/PAIR) and "Long Balls %" (→PCT) never collide on the stripped key */
function statKeyNorm(s){ return (s.label||s.name||'').toLowerCase().replace(/\s*%\s*$/,'').trim(); }
function classifyStat(rawLabel,n){
  if(/%\s*$/.test((rawLabel||'').trim())) return 'PCT';   // any explicit percentage → independent fill
  if(SHARE_OF_TOTAL.has(n)) return 'SHARE';
  if(INDEPENDENT_PCT.has(n)) return 'PCT';
  if(NUMBER_PAIR.has(n)) return 'PAIR';
  return 'PAIR';                      // unknown → fail-safe (number pair, never misleading bar)
}

/* ====================================================================
   C5 — mirrored event timeline with ALL-OR-NOTHING degrade.
   Resolve each side-bearing event against the two competitor ids; if any
   one fails, fall back to the flat single-column list. Match-flow markers
   (Kickoff/Halftime/…) carry no team and are NOT counted against resolution.
   ==================================================================== */
function evIcon(t){ return t.includes('goal')?'⚽':t.includes('yellow')?'🟨':t.includes('red')?'🟥':t.includes('substitut')?'🔄':t.includes('penal')?'🎯':'•'; }
function evWho(e,t){
  let who=((e.participants||[]).map(p=>(p.athlete||{}).displayName).filter(Boolean).join(' / '))||((e.team||{}).displayName||'');
  const isPenGoal=t.includes('goal')&&(t.includes('penalt')||e.penaltyKick);
  if(t.includes('goal')&&e.ownGoal) who+=' (OG)'; else if(isPenGoal) who+=' (P)';
  return who;
}
function buildTimeline(sum,homeId,awayId,homeIsT1,m){
  const ke=(sum&&sum.keyEvents)||[];
  const side=e=>{ const id=String((e.team||{}).id||''); if(id===String(homeId)) return 'home'; if(id===String(awayId)) return 'away'; return null; };
  const rows=ke.filter(e=>/goal|card|substitut|penal/.test(((e.type||{}).text||'').toLowerCase())).slice().reverse();
  if(!rows.length) return '';
  // attempt mirror only if RF1 c5=yes AND every side-bearing event resolves
  const allResolve = rows.every(e=>side(e)!==null);
  if(allResolve){
    const body=rows.map(e=>{
      const t=((e.type||{}).text||'').toLowerCase(), cl=((e.clock||{}).displayValue)||'';
      const ic=evIcon(t), who=esc(evWho(e,t)), sd=side(e);
      // home id is competitor 'home'; map to t1/t2 via homeIsT1 so left rail = team1 visually
      const isT1 = homeIsT1 ? (sd==='home') : (sd==='away');
      const chip=`<img class="mc-flagchip" src="${FLAG(isT1?m.team1:m.team2)}" alt="">`;
      const cell=`<span class="mc-tl-side ${isT1?'h':'a'}"><span class="ev-ic">${ic}</span><span class="who">${who}</span></span>`;
      const empty=`<span class="mc-tl-side empty"></span>`;
      const goalCls=t.includes('goal')?' goal':'';
      return `<div class="mc-tl-row${goalCls}">${isT1?cell:empty}<span class="mc-tl-min">${chip}${esc(cl)}</span>${isT1?empty:cell}</div>`;
    }).join('');
    return `<div class="mc-tl mirror">${body}</div>`;
  }
  // degrade — flat single column (current behaviour), never half-mirror
  const body=rows.map(e=>{
    const t=((e.type||{}).text||'').toLowerCase(), cl=((e.clock||{}).displayValue)||'';
    return `<div class="ev-row"><span class="ev-min">${esc(cl)}</span><span class="ev-ic">${evIcon(t)}</span><span class="ev-tx">${esc(evWho(e,t))}</span></div>`;
  }).join('');
  return `<div class="mc-tl">${body}</div>`;
}

/* ====================================================================
   renderLive — now updates window.__mc then repaints. Does NOT write a
   monolithic #live-box; the component HTML is computed and cached on __mc
   so paintTab() can render the active panel with zero refetch.
   ==================================================================== */
/* Score-matrix heatmap: render the model's FULL joint distribution P(team1=i, team2=j)
   as a coloured grid (rows = team1 goals ↓, cols = team2 goals →). Cell colour = which
   side that scoreline favours (team1 win / draw / team2 win), intensity = probability.
   This replaces the single "predicted scoreline" with the whole landscape of outcomes. */
function scoreHeat(M, m){
  const N=Math.min(6, (M&&M.length)||0); if(!N) return '';
  let maxP=0, mi=0, mj=0;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){ const p=M[i][j]||0; if(p>maxP){maxP=p;mi=i;mj=j;} }
  const RGB={h:'232,194,71',a:'53,224,216',d:'154,163,178'};   // team1 / team2 / draw
  let cells=`<div class="hm-cell hm-corner"></div>`;
  for(let j=0;j<N;j++) cells+=`<div class="hm-cell hm-head">${j}</div>`;
  for(let i=0;i<N;i++){
    cells+=`<div class="hm-cell hm-head row">${i}</div>`;
    for(let j=0;j<N;j++){
      const p=M[i][j]||0, pct=p*100, reg=i>j?'h':i<j?'a':'d';
      const al=maxP>0?Math.pow(p/maxP,0.55):0;            // perceptual intensity so small cells stay visible
      const txt=pct>=0.5?Math.round(pct):'';
      const top=(i===mi&&j===mj)?' hm-top':'';
      cells+=`<div class="hm-cell hm-data${top}" style="background:rgba(${RGB[reg]},${al.toFixed(3)})" title="${esc(m.team1)} ${i}–${j} ${esc(m.team2)} · ${pct.toFixed(1)}%">${txt}</div>`;
    }
  }
  return `<div class="hm-wrap">
    <div class="hm-axes"><img src="${FLAG(m.team1)}" alt="">${esc(m.team1)} ↓ &nbsp;·&nbsp; <img src="${FLAG(m.team2)}" alt="">${esc(m.team2)} →</div>
    <div class="hm-grid" style="--n:${N}">${cells}</div>
    <div class="hm-legend">
      <span class="hm-lg"><i style="background:rgb(232,194,71)"></i>${esc(m.team1)}</span>
      <span class="hm-lg"><i style="background:rgb(154,163,178)"></i>${L('lvDraw')}</span>
      <span class="hm-lg"><i style="background:rgb(53,224,216)"></i>${esc(m.team2)}</span>
      <span class="hm-lg">${L('hmHint')}</span>
    </div></div>`;
}
function renderLive(ev,sum,m){
  const mc=window.__mc; if(!mc) return;
  const c=(ev.competitions||[])[0]||{}; const cs=c.competitors||[];
  const home=cs.find(x=>x.homeAway==='home')||{}, away=cs.find(x=>x.homeAway==='away')||{};
  const st=(ev.status||{}).type||{}; const clk=(ev.status||{}).displayClock||'';
  const homeIsT1=nrmt((home.team||{}).displayName)===nrmt(m.team1);
  const homeId=(home.team||{}).id, awayId=(away.team||{}).id;
  const pre=st.state==='pre';
  const s1=pre?null:(homeIsT1?home.score:away.score), s2=pre?null:(homeIsT1?away.score:home.score);
  /* penalty shootout (knockout only) */
  const sh1=homeIsT1?home.shootoutScore:away.shootoutScore, sh2=homeIsT1?away.shootoutScore:home.shootoutScore;
  const penTx=(sh1!=null&&sh2!=null)?`<span class="lv-pen">(${esc(String(sh1))}–${esc(String(sh2))} ${L('lvPens')})</span>`:'';
  /* store clock base for local interpolation between polls */
  const plus=/\+/.test(clk) || /half|^ht$/i.test(clk);
  window.__lvClock={ sec:((ev.status||{}).clock)||0, at:Date.now(), state:st.state, plus };
  let statusTx;
  if(st.state==='post') statusTx = (sh1!=null?L('lvPenEnd'):L('lvFinal'));
  else if(st.state==='pre') statusTx = L('lvToPlay');
  else { let raw=(clk||st.shortDetail||st.detail||'').trim(); if(/half|^ht$/i.test(raw) && !/\d/.test(raw)) raw=L('lvHT'); statusTx='🔴 '+esc(raw); }
  const scoreNow = `${s1==null?'-':s1}-${s2==null?'-':s2}`;
  const goalFlash = (mc.lastScore && mc.lastScore!==scoreNow && !pre) ? ' mc-goalflash' : '';
  mc.headHTML=`<div class="lv-head ${st.state==='in'?'in':''}">
    <div class="lv-t"><img src="${FLAG(m.team1)}" alt=""><span>${esc(m.team1)}</span></div>
    <div class="lv-sc${goalFlash}">${s1==null?'-':esc(String(s1))} <span>–</span> ${s2==null?'-':esc(String(s2))}${penTx?'<br>'+penTx:''}<div class="lv-st">${statusTx}</div></div>
    <div class="lv-t r"><span>${esc(m.team2)}</span><img src="${FLAG(m.team2)}" alt=""></div></div>`;
  mc.lastScore=scoreNow;

  /* === PREDICTION: backtested Dixon-Coles model + Elo, log-pool blended with the market ===
     Every match gets a prediction: model-only when no odds (fallback), market-blended when odds exist. */
  let pred='';
  const pcb=((sum&&sum.pickcenter)||[])[0];
  let mkt=null;                                            // de-vigged market 1X2 in team1 orientation
  if(pcb){
    const hp=mlPct((pcb.homeTeamOdds||{}).moneyLine), ap=mlPct((pcb.awayTeamOdds||{}).moneyLine), dp=mlPct((pcb.drawOdds||{}).moneyLine);
    if(hp>0&&ap>0&&dp>0){ const [H,D,A]=devig3(hp,ap,dp); const oddsHomeIsT1=nrmt((pcb.homeTeamOdds.team||{}).displayName)===nrmt(m.team1); mkt=oddsHomeIsT1?[H/100,D/100,A/100]:[A/100,D/100,H/100]; }
  }
  const vc=window.__vcountry||null;                        // host advantage only for a host nation at its own venue
  const hostAdv=(teamHostCode(m.team1)&&teamHostCode(m.team1)===vc)?1:(teamHostCode(m.team2)&&teamHostCode(m.team2)===vc)?2:0;
  const dcL=dcLambdas(m.team1, m.team2, hostAdv);
  if(dcL || mkt){
    try{
      const rho=modelRho(); let L1,L2,probs,source;
      if(dcL){
        const modelP=gridOutcome(scoreGrid(dcL[0],dcL[1],rho));      // [h,d,a]
        if(mkt){
          const w=(__ratings&&__ratings.blend&&__ratings.blend.w_model)||0.3;
          probs=logPool(modelP, mkt, w);                            // market-heavy log opinion pool
          const mu=dcL[0]+dcL[1], f=fitSupremacy(mu, probs[0], probs[2], rho)||{l1:dcL[0],l2:dcL[1]};
          L1=f.l1; L2=f.l2; source='blend';
        } else { probs=modelP; L1=dcL[0]; L2=dcL[1]; source='model'; }
      } else { probs=mkt; const f=fitLambdas(mkt[0],mkt[1],mkt[2]); L1=f.l1; L2=f.l2; source='market'; }
      const pp=pct100(probs), p1=pp[0], D=pp[1], p2=pp[2];
      const post=st.state==='post';
      const tops=topScorelines(L1,L2,5,rho).filter(t=>t.p>=0.01);
      const M=scoreGrid(L1,L2,rho);
      const modal=tops[0];
      const heatCap = modal ? `${L('lvLikely')}: <b>${modal.i}–${modal.j}</b> ${Math.round(modal.p*100)}% · ` : '';
      const scoreBlock=`<div class="pred-score"><span class="ps-h">${L('lvHeatTitle')}</span>${scoreHeat(M,m)}<span class="ps-cap">${heatCap}${L('scoreModel')}</span></div>`;
      let btts=0,ov25=0,csH=0,csA=0;
      for(let i=0;i<M.length;i++)for(let j=0;j<M.length;j++){ const p=M[i][j]; if(i>=1&&j>=1)btts+=p; if(i+j>=3)ov25+=p; if(j===0)csH+=p; if(i===0)csA+=p; }
      const fp=x=>Math.round(x*100)+'%';
      const xg=`<div class="pred-xg"><span class="pxg-k">${L('lvXg')}</span><span class="pxg-v"><b>${L1.toFixed(1)}</b> ${esc(m.team1)} · ${esc(m.team2)} <b>${L2.toFixed(1)}</b></span></div>`;
      const rows=[[L('lvBtts'),fp(btts)],[L('lvOver25'),fp(ov25)],[L('lvCs'),`${esc(m.team1)} ${fp(csH)} · ${esc(m.team2)} ${fp(csA)}`],[L('lvDouble'),`1X ${p1+D}% · 12 ${p1+p2}% · X2 ${D+p2}%`]];
      const extraBlock=`${xg}<div class="pred-sub">${L('lvMarkets')}</div><div class="pred-mkts">${rows.map(r=>`<div class="pmk"><span class="pmk-k">${r[0]}</span><span class="pmk-v">${r[1]}</span></div>`).join('')}</div>`;
      const tag=`<span class="pred-tag ${source}">${L(source==='blend'?'lvSrcBlend':source==='model'?'lvSrcModel':'lvSrcMarket')}</span>`;
      const bt=(__ratings&&__ratings.backtest)||null;
      const btLine = bt ? `<div class="pred-bt">${L('lvBacktest').replace('{rps}',(+bt.rps).toFixed(3)).replace('{acc}',Math.round(bt.acc*100)).replace('{n}',(bt.n||0).toLocaleString())}</div>` : '';
      /* finished match: freeze the pre-match read and grade it honestly — did we call the
         1X2, and what probability had we actually assigned to what ended up happening? */
      let realLine='';
      if(post && s1!=null && s2!=null){
        const a=+s1, b=+s2, oi=a>b?0:(a<b?2:1), probs3=[p1,D,p2];
        const given=probs3[oi], predIdx=probs3.indexOf(Math.max(p1,D,p2)), hit=predIdx===oi;
        const outName=oi===0?esc(m.team1):oi===2?esc(m.team2):L('lvDraw');
        let exP=null; const th=tops.find(t=>+t.i===a&&+t.j===b);
        if(th) exP=Math.round(th.p*100); else if(M[a]&&M[a][b]!=null) exP=Math.max(1,Math.round(M[a][b]*100));
        const exTx = exP!=null ? ` <span class="pv-ex">${L('lvScoreOdds').replace('{p}',exP)}</span>` : '';
        realLine=`<div class="pred-real">${L('lvActual')} <b>${esc(String(s1))}–${esc(String(s2))}</b></div>
          <div class="pred-verdict ${hit?'ok':'miss'}"><span class="pv-ic">${hit?'✓':'✗'}</span><span class="pv-tx">${L(hit?'lvHit':'lvMiss').replace('{out}',outName).replace('{p}',given)}${exTx}</span></div>`;
      }
      const noteKey = post ? 'lvPredPostNote' : (source==='market'?'winprobNote':'modelNote');
      pred=`<div class="lv-block${post?' is-post':''}"><h4>${post?L('lvPredPre'):L('lvPred')} ${tag}</h4>
        ${realLine}
        <div class="pred"><div class="pb t1" style="width:${p1}%">${p1}%</div><div class="pb dr" style="width:${D}%">${D>7?D+'%':''}</div><div class="pb t2" style="width:${p2}%">${p2}%</div></div>
        <div class="pred-lbl"><span>${esc(m.team1)}</span><span>${L('lvDraw')}</span><span>${esc(m.team2)}</span></div>
        ${scoreBlock}
        ${extraBlock}
        ${btLine}
        <div class="pred-note">${L(noteKey)}</div></div>`;
    }catch(e){}
  }
  mc.predHTML=pred;

  /* === C5: timeline (mirror or flat) — the first thing you see on a live/finished match.
     Lead with a self-contained live banner (clock + running score) so entering the match
     lands you straight on "what's happening right now", then the event feed. === */
  const tl=buildTimeline(sum,homeId,awayId,homeIsT1,m);
  const scNow=`${s1==null?'-':esc(String(s1))}–${s2==null?'-':esc(String(s2))}`;
  let evBanner='';
  if(st.state==='in'){
    const minTx=esc((clk||'').trim()||statusTx.replace('🔴 ',''));
    evBanner=`<div class="lv-now"><span class="lv-now-dot"></span><b>${minTx}</b><span class="lv-now-sc">${esc(m.team1)} <b>${scNow}</b> ${esc(m.team2)}</span></div>`;
  } else if(st.state==='post'){
    evBanner=`<div class="lv-now done"><span class="lv-now-tag">${statusTx}</span><span class="lv-now-sc">${esc(m.team1)} <b>${scNow}</b> ${esc(m.team2)}</span></div>`;
  }
  mc.eventsHTML = (tl||evBanner)
    ? `<div class="lv-block"><h4>${L('lvEvents')}</h4>${evBanner}${tl||`<div class="lv-noevents">${L('noEventsYet')}</div>`}</div>`
    : '';

  /* === C7: twin-bar stats, 3-way classified === */
  mc.statsHTML='';
  const bt=((sum&&sum.boxscore)||{}).teams||[];
  if(bt.length===2){
    const t1b=bt.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team1))||bt[0];
    const t2b=bt.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team2))||bt[1];
    const map2={}; (t2b.statistics||[]).forEach(s=>map2[s.name]=s);
    const ORDER=['possession','shots','on goal','shots on target','on target %','corner kicks','fouls','offsides','yellow cards','red cards','saves','accurate passes','passes','pass completion %','accurate crosses','crosses'];
    const oi=s=>{ const i=ORDER.indexOf((s.label||s.name||'').toLowerCase()); return i<0?99:i; };
    const rows=(t1b.statistics||[]).slice().sort((x,y)=>oi(x)-oi(y)).map(a=>{
      const b=map2[a.name]; if(!b) return '';
      const v1=parseFloat(a.displayValue)||0, v2=parseFloat(b.displayValue)||0;
      const n=statKeyNorm(a), cls=classifyStat(a.label||a.name||'',n);
      const headHTML=(d1,d2)=>`<div class="mc-stat-top"><span class="sv">${esc(d1)}</span><span class="sk">${esc(statLabel(a))}</span><span class="sv">${esc(d2)}</span></div>`;
      if(cls==='SHARE'){
        const tot=v1+v2||1;                       // zero-guard on share path only
        return `<div class="mc-stat">${headHTML(a.displayValue,b.displayValue)}<div class="mc-share"><div class="l" style="width:${(v1/tot*100).toFixed(1)}%"></div><div class="r" style="width:${(v2/tot*100).toFixed(1)}%"></div></div></div>`;
      }
      if(cls==='PCT'){
        // ESPN gives these as fractions (e.g. "0.9" = 90%) or already 0-100; normalise to 0-100. Never summed.
        const f1=v1<=1?v1*100:v1, f2=v2<=1?v2*100:v2;
        return `<div class="mc-stat">${headHTML(Math.round(f1)+'%',Math.round(f2)+'%')}<div class="mc-pcts">
          <div><div class="mc-pct-track h"><div class="fill" style="width:${Math.min(100,f1).toFixed(0)}%"></div></div><div class="mc-pct-cap"><span>${esc(m.team1)}</span><span>${Math.round(f1)}%</span></div></div>
          <div><div class="mc-pct-track a"><div class="fill" style="width:${Math.min(100,f2).toFixed(0)}%"></div></div><div class="mc-pct-cap"><span>${Math.round(f2)}%</span><span>${esc(m.team2)}</span></div></div>
        </div></div>`;
      }
      // PAIR (and unknown) — plain numbers, no bar (non-zero-sum counts never get a misleading share)
      return `<div class="mc-stat">${headHTML(a.displayValue,b.displayValue)}<div class="mc-numpair">${esc(a.displayValue)} — ${esc(b.displayValue)}</div></div>`;
    }).join('');
    if(rows.replace(/\s/g,'')) mc.statsHTML=`<div class="lv-block"><h4>${L('lvStats')}</h4>${rows}</div>`;
  }

  /* === C9: lineups (live/post) — confirmed-XI guard retained === */
  mc.lineupsHTML='';
  const ros=(sum&&sum.rosters)||[];
  if(ros.length===2 && ros.every(r=>r && r.formation && (r.roster||[]).length)){
    const r1=ros.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team1))||ros[0];
    const r2=ros.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team2))||ros[1];
    const dot=p=>`<div class="fpos"><div class="fdot">${esc(String(p.jersey||''))}</div><div class="fnm">${esc(lastName((p.athlete||{}).displayName))}</div></div>`;
    const rowH=arr=>`<div class="frow">${arr.map(dot).join('')}</div>`;
    const f1=formationRows(r1), f2=formationRows(r2);
    const pitch=`<div class="pitch">
      <div class="pteam">${rowH([f2.gk])}${f2.rows.map(rowH).join('')}</div>
      <div class="pline"></div>
      <div class="pteam">${f1.rows.slice().reverse().map(rowH).join('')}${rowH([f1.gk])}</div></div>`;
    const subEl=t=>{ const s=(t.roster||[]).filter(p=>!p.starter); return s.length?`<div class="subs-col"><b>${esc((t.team||{}).displayName)}</b>${s.map(p=>`<span class="sub-pl"><i>${esc(String(p.jersey||''))}</i> ${esc((p.athlete||{}).displayName||'')}</span>`).join('')}</div>`:''; };
    mc.lineupsHTML=`<div class="lv-block"><h4>${L('lvLineups')}</h4>
      <div class="pf"><span>${esc(m.team1)} · ${esc(r1.formation||'')}</span><span>${esc(r2.formation||'')} · ${esc(m.team2)}</span></div>
      ${pitch}
      <div class="lu-h2">${L('lvSubs')}</div><div class="subs">${subEl(r1)}${subEl(r2)}</div></div>`;
  }

  /* === C11: commentary (own tab) === */
  mc.commHTML='';
  const cm=(sum&&sum.commentary)||[];
  if(cm.length){
    const rows=cm.slice().reverse().slice(0,50).map(x=>{ const tm=((x.time||{}).displayValue)||''; return `<div class="cm-row"><span class="cm-min">${esc(tm)}</span><span class="cm-tx">${esc(x.text||'')}</span></div>`; }).join('');
    mc.commHTML=`<div class="lv-block"><h4>${L('lvComm')}</h4><div class="cm-list">${rows}</div></div>`;
  }

  /* commit state + repaint */
  mc.ev=ev; mc.sum=sum; mc.m=m; mc.state=st.state;
  paintHeader();
  paintActive();
}

/* ====================================================================
   C9b — predicted-XI render path (pre-match). team_xi.json buckets;
   xi_overrides.json wins per team-code. Neither → confirmedSoon.
   ==================================================================== */
function predXICard(code,teamName){
  const base=(window.__teamXI||{})[code], ov=(window.__xiOverrides||{})[code];
  const POS=['GK','DF','MF','FW'];
  if(!base && !ov) return null;
  const flag=(()=>{ const t=Object.values(window.__teamByName||{}).find(x=>x.code===code); return t?`https://flagcdn.com/w40/${t.flag}.png`:''; })();
  let lines='';
  POS.forEach(pk=>{
    let names;
    if(ov && ov[pk]) names=ov[pk].slice();                       // override wins, names are strings
    else if(base && base[pk]) names=base[pk].map(p=>p.name||p);  // base entries are {name,...}
    else names=[];
    if(!names.length) return;
    lines+=`<div class="pxline">${pk}</div>`+names.map(n=>`<div class="pxp"><span class="pos">${pk}</span><span>${esc(n)}</span></div>`).join('');
  });
  if(!lines) return null;
  return `<div class="pxc"><h5>${flag?`<img src="${flag}" alt="">`:''}${esc(teamName)}</h5><div class="pxsub">${L('predXI')}</div>${lines}</div>`;
}

/* ====================================================================
   C12 — H2H single-meeting card (h2h.last is a single dict; no list).
   ==================================================================== */
function h2hPaneHTML(mc){
  const m=mc.m, prev=window.__prev;
  if(prev&&prev.h2h&&prev.h2h.played>0){
    const h=prev.h2h;
    const last=h.last?`<div class="h2h-last"><span style="color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.85em">${L('lastMeeting')}</span><br>${last2(h.last)} <span style="opacity:.6">(${esc(h.last.date)})</span></div>`:'';
    return `<div class="block"><h3>${L('tabH2H')} · ${h.played} ${L('matchups')}</h3>
      <div class="h2h-score">
        <div style="text-align:center"><div class="n ${h.w1>h.w2?'w':''}">${h.w1}</div><div class="mid">${esc(m.team1)}</div></div>
        <div class="mid">${h.d} ${L('draws')}</div>
        <div style="text-align:center"><div class="n ${h.w2>h.w1?'w':''}">${h.w2}</div><div class="mid">${esc(m.team2)}</div></div>
      </div>${last}</div>`;
  }
  return mc.h2hHTML || `<div class="mc-empty">${L('noStats')}</div>`;
}

/* ====================================================================
   registerCoreTabs — Agent-Core's panel renderers, wired via registerTab.
   Agent-Data later registers 'standings' / 'bracket' bodies the same way.
   ==================================================================== */
function registerCoreTabs(){
  registerTab('details', mc=> mc.staticDetails);
  registerTab('events',  mc=> mc.eventsHTML || `<div class="mc-empty">${L('noStats')}</div>`);
  registerTab('predict', mc=> mc.predHTML || `<div class="mc-empty">${L('noStats')}</div>`);
  registerTab('comm', mc=> mc.commHTML || `<div class="mc-empty">${L('noStats')}</div>`);
  registerTab('lineups', mc=>{
    if(mc.lineupsHTML) return mc.lineupsHTML;          // live/post confirmed XI
    // pre-match predicted XI (C9b)
    const m=mc.m;
    const t1=(window.__teamOf?window.__teamOf(m.team1):Object.values(window.__teamByName||{}).find(x=>x.name===m.team1));
    const t2=(window.__teamOf?window.__teamOf(m.team2):Object.values(window.__teamByName||{}).find(x=>x.name===m.team2));
    const c1=t1&&predXICard(t1.code,m.team1), c2=t2&&predXICard(t2.code,m.team2);
    if(c1||c2) return `<div class="lv-block"><h4>${L('predXI')}</h4><div class="predxi">${c1||''}${c2||''}</div></div>`;
    return `<div class="mc-empty">${L('confirmedSoon')}</div>`;
  });
  registerTab('stats', mc=> mc.statsHTML || `<div class="mc-empty">${L('noStats')}</div>`);
  registerTab('h2h', mc=> h2hPaneHTML(mc));
  // 'standings' and 'bracket' bodies are Agent-Data's deliverable (registered later via registerTab).
  // Provide a transient placeholder so the tab is never blank before Agent-Data lands.
  if(!__mcTabs.standings) registerTab('standings', ()=> `<div class="mc-empty">${L('noStats')}</div>`);
  if(!__mcTabs.bracket)   registerTab('bracket',   ()=> `<div class="mc-empty">${L('bracketSoon')}</div>`);
}

/* ====================================================================
   C14 / C15 / C16 — STANDINGS + QUALIFICATION BANDS + BRACKET (Agent-Data)
   ==================================================================== */
/* ----- C14 standings via DOCUMENTED DUPLICATION -----
   DUPLICATED FROM calendar.html (consensus). Keep in sync.
   buildStandings + loadEspnStandings + snrm/SALIAS copied verbatim into
   match-center scope (renamed mc*). snrm is brought VERBATIM and is NOT
   replaced by match.html's nrmt — using nrmt for the ESPN overlay key would
   render every team 0-0-0. results.json path handles the !__mcEspnStand fallback. */
let MC_RESULTS={};
async function mcLoadResults(){
  try{
    const r=await fetch('data/results.json',{cache:'no-store'});
    if(r.ok){ const j=await r.json(); MC_RESULTS=j.matches||{}; }
  }catch(e){ /* no results yet → standings stay at zero */ }
}
let __mcEspnStand=null;
const MC_SALIAS={czechrepublic:'czechia',drcongo:'congodr',turkey:'turkiye',usa:'unitedstates'};
function mcSnrm(s){ let x=(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); return MC_SALIAS[x]||x; }
async function mcLoadEspnStandings(){
  if(document.hidden) return;            // don't poll while tab is hidden
  try{
    const d=await fetch('https://site.api.espn.com/apis/v2/sports/soccer/fifa.world/standings',{cache:'no-store'}).then(r=>r.json());
    const out={};
    (d.children||[]).forEach(g=>{
      const letter=(((g.name||'').match(/Group\s+([A-L])/i))||[])[1]; if(!letter) return;
      out[letter]={};
      ((g.standings&&g.standings.entries)||[]).forEach(e=>{
        const sm={}; (e.stats||[]).forEach(s=>{ sm[s.name]=parseFloat(s.displayValue)||0; });
        out[letter][mcSnrm((e.team||{}).displayName)]={pj:sm.gamesPlayed||0,w:sm.wins||0,d:sm.ties||0,l:sm.losses||0,gf:sm.pointsFor||0,ga:sm.pointsAgainst||0};
      });
    });
    if(Object.keys(out).length){ __mcEspnStand=out; mcRepaintStandingsIfActive(); }
  }catch(e){ /* ESPN unavailable → fall back to results.json */ }
}
/* repaint the standings panel only if it's the active tab (zero-network for other tabs) */
function mcRepaintStandingsIfActive(){
  const mc=window.__mc; if(!mc||mc.activeTab!=='standings') return;
  const m=mc.m||{}; if(!(m.group||m.groupId)) return;   // bracket view: nothing to repaint
  paintTab('standings');
}
/* group letter from match.html schedule shape: m.group = "Group A" → "A" (calendar used m.groupId) */
function mcGroupId(m){ const g=m.group||m.groupId||''; const mm=g.match(/^([A-L])$/i)||g.match(/Group\s+([A-L])/i); return mm?mm[1].toUpperCase():null; }
function mcFlagCode(name){ const t=(window.__teamOf?window.__teamOf(name):(window.__teamByName||{})[name]); return t?t.flag:null; }

/* buildStandings — returns an HTML string for the panel (calendar wrote to #standings-grid).
   Reads window.__schedMatches (full fixture) + MC_RESULTS + __mcEspnStand. */
function mcBuildStandings(){
  const MATCHES=window.__schedMatches||[];
  if(!MATCHES.length) return `<div class="mc-empty">${L('noStats')}</div>`;
  const groups={};
  MATCHES.forEach((m,idx)=>{
    const g=mcGroupId(m); if(!g) return;
    (groups[g]||(groups[g]={}));
    [m.team1,m.team2].forEach(tn=>{
      if(tn && !isPlaceholder(tn) && !groups[g][tn]) groups[g][tn]={team:tn,pj:0,w:0,d:0,l:0,gf:0,ga:0};
    });
    if(!__mcEspnStand){   /* compute from results.json only when ESPN standings aren't available */
      const key=String(idx);   // results.json key = 0-based index into schedule.matches[]
      const sc=MC_RESULTS[key];
      if(Array.isArray(sc) && sc.length===2 && groups[g][m.team1] && groups[g][m.team2]){
        const a=+sc[0], b=+sc[1];
        const A=groups[g][m.team1], B=groups[g][m.team2];
        A.pj++; B.pj++; A.gf+=a; A.ga+=b; B.gf+=b; B.ga+=a;
        if(a>b){ A.w++; B.l++; } else if(a<b){ B.w++; A.l++; } else { A.d++; B.d++; }
      }
    }
  });
  if(__mcEspnStand){    /* overlay live ESPN standings (matched by normalised team name via mcSnrm) */
    Object.keys(groups).forEach(g=>{
      const eg=__mcEspnStand[g]; if(!eg) return;
      Object.values(groups[g]).forEach(r=>{
        const e=eg[mcSnrm(r.team)];
        if(e){ r.pj=e.pj; r.w=e.w; r.d=e.d; r.l=e.l; r.gf=e.gf; r.ga=e.ga; }
      });
    });
  }
  const gids=Object.keys(groups).sort();
  if(!gids.length) return `<div class="mc-empty">${L('noStats')}</div>`;
  const cards=gids.map(g=>{
    const rows=Object.values(groups[g])
      .map(r=>({...r,pts:r.w*3+r.d,dg:r.gf-r.ga}))
      .sort((x,y)=>y.pts-x.pts||y.dg-x.dg||y.gf-x.gf||x.team.localeCompare(y.team));
    const body=rows.map((r,i)=>{
      const code=mcFlagCode(r.team);
      const flag=code?`<img src="https://flagcdn.com/w40/${code}.png" alt="">`:'';
      /* C15 — qualification bands STATIC BY RANK (no live possible-third computation) */
      const cls=i===0?'q-auto':i===1?'q-auto':i===2?'q-play':'q-out';
      return `<tr class="${cls}"><td class="pos">${i+1}</td>`
        +`<td class="team">${flag}${esc(r.team)}</td>`
        +`<td>${r.pj}</td><td class="opt">${r.w}</td><td class="opt">${r.d}</td><td class="opt">${r.l}</td>`
        +`<td class="opt">${r.gf}</td><td class="opt">${r.ga}</td><td>${r.dg>0?'+':''}${r.dg}</td>`
        +`<td class="pts">${r.pts}</td></tr>`;
    }).join('');
    return `<div class="mc-stand-card"><h3>${L('tabTable')} ${g}</h3>`
      +`<div class="mc-stand-scroll"><table class="mc-stand-table"><thead><tr>`
      +`<th></th><th class="lt">${cmpTeamHdr()}</th><th>${L('played')}</th>`
      +`<th class="opt">${L('won')}</th><th class="opt">${L('drawn')}</th><th class="opt">${L('lost')}</th>`
      +`<th class="opt">${L('gf')}</th><th class="opt">${L('ga')}</th><th>${L('gd')}</th><th>${L('pts')}</th>`
      +`</tr></thead><tbody>${body}</tbody></table></div></div>`;
  }).join('');
  /* C15 legend + best-8-of-12-thirds disclaimer (reuses calendar's st.note wording) */
  const legend=`<div class="mc-qlegend">`
    +`<span class="qc auto"><i></i>${L('qualifies')}</span>`
    +`<span class="qc play"><i></i>${L('qPossible')}</span>`
    +`<span class="qc out"><i></i>${L('eliminated')}</span></div>`
    +`<p class="mc-stand-note">${L('stNote')}</p>`;
  return `<div class="mc-stand-grid">${cards}</div>${legend}`;
}
/* team-column header label (reuse the calendar "Team" sense via squadOf? use a neutral label) */
function cmpTeamHdr(){ const lang=document.documentElement.lang||'es'; return lang==='en'?'Team':lang==='tr'?'Takım':'Equipo'; }

/* C16 — knockout bracket → static trilingual placeholder (shown when m has no group) */
function mcBracketPane(){ return `<div class="mc-empty">${L('bracketSoon')}</div>`; }

/* mount Agent-Data panels via the registerTab seam (overrides Agent-Core's transient placeholders) */
registerTab('standings', ()=> mcBuildStandings());
registerTab('bracket',   ()=> mcBracketPane());
/* kick off standings data load + live refresh (calendar parity: 60s) */
mcLoadResults();
mcLoadEspnStandings();
setInterval(mcLoadEspnStandings, 60000);

/* commentary scroll-preservation — only when the Commentary tab is active (§5.2) */
function mountCommentaryScroll(){
  const list=document.querySelector('#mc-panel .cm-list'); if(!list) return;
  const saved=window.__commScroll; if(saved) list.scrollTop=saved;
  list.addEventListener('scroll',()=>{ window.__commScroll=list.scrollTop; },{passive:true});
}

main();
</script>
