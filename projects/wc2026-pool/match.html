<style>
  :root{--bg:#04060f;--bg-2:#0a0e22;--ink:#fff;--ink-2:rgba(255,255,255,.9);--muted:rgba(255,255,255,.55);
    --gold:#e8c247;--gold-2:#f4d76b;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.22);}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--gold);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(4,6,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:920px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:.92em}
  .topbar-links{display:flex;gap:18px;font-size:.92em}.topbar-links a{color:var(--ink-2);font-weight:600}
  .wrap{max-width:920px;margin:0 auto;padding:26px 22px 80px}
  .eyebrow{text-align:center;font-size:.78em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}

  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:8px}
  .side{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:10px;border-radius:16px;transition:background .15s}
  a.side:hover{background:rgba(13,17,32,.5)}
  .side img.flag{width:92px;height:64px;object-fit:cover;border-radius:8px;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.4)}
  .side .nm{font-weight:800;font-size:1.25em;line-height:1.15}
  .side .lk{font-size:.74em;color:var(--gold);font-weight:700}
  .side.tbd .nm{color:var(--muted)}
  .vs-mid{font-size:1.4em;font-weight:800;color:var(--muted)}
  .flag-ph{width:92px;height:64px;border-radius:8px;background:rgba(255,255,255,.06);border:1px dashed var(--line-strong)}

  .kick{text-align:center;margin:22px 0 26px}
  .kick .big{font-size:1.5em;font-weight:900}
  .kick .local{color:var(--ink-2);font-size:.95em;margin-top:4px}
  .kick .venuetime{color:var(--muted);font-size:.84em;margin-top:2px}

  .venue{display:grid;grid-template-columns:1.1fr .9fr;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
  @media(max-width:620px){.venue{grid-template-columns:1fr}}
  .venue .photo{width:100%;height:100%;min-height:200px;object-fit:cover;display:block;background:#0a0e22}
  .venue .vbody{padding:20px 22px}
  .venue .vname{font-weight:800;font-size:1.2em}
  .venue .vcity{color:var(--muted);font-size:.9em;margin-bottom:14px}
  .venue .vstats{display:flex;gap:22px;margin-bottom:14px}
  .venue .vstat .v{font-weight:900;color:var(--gold);font-size:1.15em}
  .venue .vstat .k{font-size:.68em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .venue .vfact{font-size:.88em;color:var(--ink-2);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
  .minimap{margin-top:14px}
  .minimap svg{width:100%;height:auto;max-height:160px}
  .minimap .coast{fill:rgba(255,255,255,.13);stroke:rgba(255,255,255,.42);stroke-width:1;vector-effect:non-scaling-stroke}
  .minimap .pin{fill:var(--gold)}.minimap .pinhalo{fill:var(--gold);opacity:.25}

  /* Section blocks */
  .block{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:18px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
  .block h3{font-size:.78em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
  /* comparison bars */
  .cmp-row{margin-bottom:13px}
  .cmp-row .lbl{display:flex;justify-content:space-between;font-size:.8em;color:var(--ink-2);margin-bottom:5px}
  .cmp-row .lbl .k{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:.82em;font-weight:700}
  .cmp-row .lbl b{font-variant-numeric:tabular-nums}
  .cmp-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
  .cmp-bar .l{background:linear-gradient(90deg,#5b9bff,#7db0ff)}.cmp-bar .r{background:linear-gradient(90deg,#f0a868,#e8c247)}
  /* h2h */
  .h2h-score{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
  .h2h-score .n{font-size:1.8em;font-weight:900}.h2h-score .n.w{color:var(--gold)}
  .h2h-score .mid{font-size:.74em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .h2h-last{text-align:center;font-size:.84em;color:var(--ink-2)}
  /* form */
  .form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .form-row .tn{font-weight:700;font-size:.9em;min-width:120px}
  .form-dots{display:flex;gap:6px}
  .fd{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:.72em;font-weight:800;color:#08111f}
  .fd.W{background:#2ec27e}.fd.D{background:#9aa0aa}.fd.L{background:#ff5a5f;color:#fff}
  .climate{display:flex;gap:22px;justify-content:center}
  .climate .ci{text-align:center}.climate .ci .v{font-size:1.5em;font-weight:900;color:var(--gold)}
  .climate .ci .k{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .scoreline{text-align:center;font-size:1.1em;font-weight:800;color:var(--muted);padding:8px 0}

  .squads{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .squads a{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:700;
    background:rgba(255,255,255,.06);border:1px solid var(--line-strong);color:var(--ink);font-size:.92em}
  .squads a:hover{background:rgba(255,255,255,.12)}
  .note{margin-top:26px;font-size:.8em;color:var(--muted);text-align:center}
  /* ===== live match section ===== */
  #live-box{margin:8px 0 6px}
  .lv-head{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:16px}
  .lv-head.in{border-color:rgba(224,70,74,.5);box-shadow:0 0 0 1px rgba(224,70,74,.2)}
  .lv-t{display:flex;align-items:center;gap:9px;font-weight:700;flex:1;justify-content:flex-end;min-width:0}
  .lv-t.r{justify-content:flex-start}
  .lv-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-t img{width:30px;height:21px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12);flex-shrink:0}
  .lv-sc{font-size:2.1em;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;min-width:96px;line-height:1}
  .lv-sc>span{opacity:.4;font-weight:600}
  .lv-st{font-size:.34em;font-weight:800;color:#ff7a7d;margin-top:5px;letter-spacing:.02em}
  .lv-block{margin-top:14px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .lv-block h4{margin:0 0 12px;font-size:.7em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pred{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:.76em;font-weight:800}
  .pred .pb{display:flex;align-items:center;justify-content:center;min-width:18px;color:#06121a}
  .pred .t1{background:var(--gold)} .pred .dr{background:#5b6472;color:#fff} .pred .t2{background:#35e0d8}
  .pred-lbl{display:flex;justify-content:space-between;font-size:.74em;color:var(--muted);margin-top:6px}
  .pred-lbl span:nth-child(2){text-align:center} .pred-lbl span:last-child{text-align:right}
  .ev-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.88em}
  .ev-row:last-child{border-bottom:0} .ev-min{color:var(--gold);font-weight:800;width:36px;font-variant-numeric:tabular-nums}
  .ev-tx{color:var(--ink-2)}
  .stat-row{margin-bottom:13px} .stat-row:last-child{margin-bottom:0}
  .stat-top{display:flex;justify-content:space-between;align-items:center;font-size:.86em;margin-bottom:5px}
  .stat-top .sk{color:var(--muted)} .stat-top .sv{font-weight:800;min-width:42px}
  .stat-top .sv:last-child{text-align:right}
  .stat-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
  .stat-bar .l{background:var(--gold)} .stat-bar .r{background:#35e0d8}
  .lineups{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .lu-h{font-weight:800;margin-bottom:9px;font-size:.95em} .lu-form{color:var(--gold);font-size:.82em;margin-left:6px;font-weight:700}
  .pl{display:flex;align-items:center;gap:9px;font-size:.84em;padding:3px 0}
  .pl .pn{width:20px;text-align:center;color:var(--muted);font-family:var(--mono,monospace);font-weight:700;flex-shrink:0}
  .pl .pnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl .pp{margin-left:auto;color:var(--muted);font-size:.85em;flex-shrink:0}
  .lu-subs{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .lu-subs b{display:block;font-size:.66em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
  .lu-subs .pl{opacity:.72}
  /* formation pitch */
  .pf{display:flex;justify-content:space-between;font-size:.8em;font-weight:700;color:var(--ink-2);margin-bottom:9px}
  .pitch{position:relative;background:linear-gradient(180deg,#176540,#0e4a30);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 4px;display:flex;flex-direction:column;overflow:hidden}
  .pitch::before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.16);border-radius:8px;pointer-events:none}
  .pteam{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px;z-index:1}
  .pline{height:1px;background:rgba(255,255,255,.2);margin:7px 12px;position:relative}
  .pline::after{content:"";position:absolute;left:50%;top:50%;width:36px;height:36px;border:1px solid rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%)}
  .frow{display:flex;justify-content:space-around;gap:3px}
  .fpos{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 0;min-width:0;max-width:78px}
  .fdot{width:26px;height:26px;border-radius:50%;background:#fff;color:#0a3b26;display:grid;place-items:center;font-weight:900;font-size:.72em;font-family:var(--mono,monospace);box-shadow:0 1px 3px rgba(0,0,0,.45)}
  .fnm{font-size:.58em;font-weight:700;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .lu-h2{font-size:.66em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
  .subs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .subs-col b{display:block;font-size:.8em;font-weight:800;margin-bottom:6px}
  .sub-pl{display:block;font-size:.8em;color:var(--ink-2);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-pl i{color:var(--muted);font-style:normal;font-family:var(--mono,monospace);margin-right:5px}
  .ev-ic{font-size:1.05em}
  /* commentary */
  .cm-list{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .cm-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85em}
  .cm-row:last-child{border-bottom:0}
  .cm-min{color:var(--gold);font-weight:800;min-width:34px;font-variant-numeric:tabular-nums;flex-shrink:0}
  .cm-tx{color:var(--ink-2);line-height:1.45}
  @media(max-width:640px){ .lineups,.subs{grid-template-columns:1fr} .lv-sc{font-size:1.8em;min-width:80px} .fnm{font-size:.52em} .fdot{width:23px;height:23px} }
</style>

<div id="site-nav"></div>
<div class="wrap" id="wrap"><p style="color:var(--muted)">Cargando…</p></div>

<script src="assets/i18n.js"></script>
<script>
const T={
  es:{fail:'No se pudo cargar el partido.',cap:'aforo',opened:'inaugurado',cmp:'Comparativa de plantillas',valTotal:'Valor total',ageAvg:'Edad media',years:'años',caps:'Internacionalidades',inj:'Lesiones acumuladas',h2h:'Cara a cara',matchups:'enfrentamientos',last:'Último',draws:'emp.',form:'Forma reciente',cond:'Condiciones de la sede',temp:'temp. típica jun-jul',alt:'altitud',score:'Marcador',toPlay:'Por jugar',vs:'vs',localTime:'(tu hora local)',venueTime:'Hora local de la sede:',squadOf:'Plantilla de',note:'Fotos: Wikimedia Commons (CC BY-SA) · resultados históricos: martj42 (CC0) · datos del proyecto',locale:'es-ES',cal:'Calendario',lvPred:'Predicción',lvStats:'Estadísticas',lvLineups:'Alineaciones',lvEvents:'Eventos',lvComm:'Comentario en directo',lvSubs:'Suplentes',lvDraw:'Empate',lvToPlay:'Por jugar',lvFinal:'Final',lvHT:'Descanso',liveData:'Datos en vivo: ESPN'},
  en:{fail:'Could not load the match.',cap:'capacity',opened:'opened',cmp:'Squad comparison',valTotal:'Total value',ageAvg:'Average age',years:'yrs',caps:'Caps',inj:'Career injuries',h2h:'Head to head',matchups:'meetings',last:'Last',draws:'draws',form:'Recent form',cond:'Venue conditions',temp:'typical temp Jun–Jul',alt:'altitude',score:'Score',toPlay:'To be played',vs:'vs',localTime:'(your local time)',venueTime:'Venue local time:',squadOf:'Squad of',note:'Photos: Wikimedia Commons (CC BY-SA) · historical results: martj42 (CC0) · project data',locale:'en-GB',cal:'Calendar',lvPred:'Prediction',lvStats:'Stats',lvLineups:'Lineups',lvEvents:'Events',lvComm:'Live commentary',lvSubs:'Substitutes',lvDraw:'Draw',lvToPlay:'Scheduled',lvFinal:'Full Time',lvHT:'Half-time',liveData:'Live data: ESPN'},
  tr:{fail:'Maç yüklenemedi.',cap:'kapasite',opened:'açılış',cmp:'Kadro karşılaştırması',valTotal:'Toplam değer',ageAvg:'Yaş ortalaması',years:'yaş',caps:'Milli maç',inj:'Kariyer sakatlıkları',h2h:'Karşılıklı',matchups:'karşılaşma',last:'Son',draws:'berabere',form:'Son form',cond:'Saha koşulları',temp:'tipik sıcaklık Haz–Tem',alt:'rakım',score:'Skor',toPlay:'Oynanacak',vs:'-',localTime:'(senin yerel saatin)',venueTime:'Sahanın yerel saati:',squadOf:'Kadrosu:',note:'Fotoğraflar: Wikimedia Commons (CC BY-SA) · geçmiş sonuçlar: martj42 (CC0) · proje verisi',locale:'tr-TR',cal:'Takvim',lvPred:'Tahmin',lvStats:'İstatistikler',lvLineups:'Kadrolar',lvEvents:'Olaylar',lvComm:'Canlı anlatım',lvSubs:'Yedekler',lvDraw:'Beraberlik',lvToPlay:'Programlandı',lvFinal:'Maç sonu',lvHT:'Devre arası',liveData:'Canlı veri: ESPN'}
};
const L=k=>wcT(T,k);
const LOC=L('locale');
const MIDX = parseInt(new URLSearchParams(location.search).get('m')||'0',10);
const BBOX={USA:[-125,-66.5,24,49.6],MEX:[-117.5,-86.5,14.4,32.8],CAN:[-129,-73,42,55.5]};

function parseKick(date,time){
  const m=(time||'').match(/(\d{1,2}):(\d{2})\s*UTC([+-]\d{1,2})/);
  if(!m) return null;
  const hh=m[1].padStart(2,'0'), mm=m[2], off=m[3];
  const sign=off[0], hrs=String(Math.abs(+off)).padStart(2,'0');
  return new Date(`${date}T${hh}:${mm}:00${sign}${hrs}:00`);
}
function isPlaceholder(n){ return !n || /^([12][A-L]|W\d+|L\d+|RU|3[A-L])/i.test(n) || /\bB$/.test(n); }

async function main(){
  let sched,teams,maps,agg,prev;
  try{
    [sched,teams,maps,agg,prev]=await Promise.all([
      fetch('data/schedule.json').then(r=>r.json()),
      fetch('data/teams/index.json').then(r=>r.json()),
      fetch('data/host_maps.json').then(r=>r.json()),
      fetch('data/teams/aggregates.json').then(r=>r.json()).catch(()=>({})),
      fetch('data/match_previews.json').then(r=>r.json()).catch(()=>({previews:[]})),
    ]);
  }catch(e){ document.getElementById('wrap').innerHTML=`<p style="color:var(--muted)">${L('fail')}</p>`; return; }
  const matches=sched.matches||sched;
  const m=matches[MIDX];
  if(!m){ document.getElementById('wrap').innerHTML='<p style="color:var(--muted)">Partido no encontrado.</p>'; return; }

  const teamByName={}; teams.teams.forEach(t=>teamByName[t.name]=t);
  window.__agg=agg||{}; window.__prev=(prev.previews||[])[MIDX]||null;
  // venue lookup
  let venue=null, vcountry=null;
  for(const code of Object.keys(maps.countries)){
    const c=maps.countries[code].cities.find(c=>c.city===m.ground);
    if(c){ venue=c; vcountry=code; break; }
  }
  window.__teamByName=teamByName;
  render(m,teamByName,venue,vcountry,maps);
  loadMatchLive(m);
}

function sideHTML(name,teamByName){
  if(isPlaceholder(name)) return `<div class="side tbd"><div class="flag-ph"></div><div class="nm">${name||'Por definir'}</div></div>`;
  const t=teamByName[name];
  const flag=t?`<img class="flag" src="https://flagcdn.com/w160/${t.flag}.png" alt="${name}">`:`<div class="flag-ph"></div>`;
  if(t) return `<a class="side" href="team.html?code=${t.code}">${flag}<div class="nm">${name}</div><div class="lk">Ver plantilla →</div></a>`;
  return `<div class="side"><div class="flag-ph"></div><div class="nm">${name}</div></div>`;
}

function miniMap(venue,vcountry,maps){
  if(!venue||!BBOX[vcountry]) return '';
  const [minLon,maxLon,minLat,maxLat]=BBOX[vcountry];
  const W=420, midLat=(minLat+maxLat)/2, kx=Math.cos(midLat*Math.PI/180);
  const wLon=(maxLon-minLon)*kx, wLat=(maxLat-minLat), scale=W/wLon, H=Math.round(wLat*scale);
  const proj=(lon,lat)=>[((lon-minLon)*kx*scale).toFixed(1),((maxLat-lat)*scale).toFixed(1)];
  let paths='';
  maps.countries[vcountry].outline.forEach(ring=>{
    let d=''; ring.forEach((pt,i)=>{const[x,y]=proj(pt[0],pt[1]); d+=(i?'L':'M')+x+' '+y;}); d+='Z';
    paths+=`<path class="coast" d="${d}"/>`;
  });
  const [px,py]=proj(venue.lon,venue.lat);
  return `<div class="minimap"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${paths}
    <circle class="pinhalo" cx="${px}" cy="${py}" r="9"/><circle class="pin" cx="${px}" cy="${py}" r="4.5"/></svg></div>`;
}

function render(m,teamByName,venue,vcountry,maps){
  const dt=parseKick(m.date,m.time);
  const localStr = dt ? dt.toLocaleString(LOC,{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : m.date;
  const roundTxt = m.group ? `${m.group} · ${m.round}` : m.round;
  const cap = venue&&venue.capacity ? venue.capacity.toLocaleString(LOC) : null;
  const t1=teamByName[m.team1], t2=teamByName[m.team2];

  const venueHTML = venue ? `
    <div class="venue">
      ${venue.photo?`<img class="photo" src="${venue.photo}" alt="${venue.stadium}" onerror="this.style.display='none'">`:'<div class="photo"></div>'}
      <div class="vbody">
        <div class="vname">${venue.stadium}</div>
        <div class="vcity">${(venue.city||'').replace(/\s*\(.*\)/,'')}</div>
        <div class="vstats">
          ${cap?`<div class="vstat"><div class="v">${cap}</div><div class="k">${L('cap')}</div></div>`:''}
          ${venue.opened?`<div class="vstat"><div class="v">${venue.opened}</div><div class="k">${L('opened')}</div></div>`:''}
        </div>
        ${venue.fact?`<div class="vfact">${venue.fact}</div>`:''}
        ${miniMap(venue,vcountry,maps)}
      </div>
    </div>` : '';

  // ---- Comparison / H2H / form / climate ----
  const agg=window.__agg||{}, prev=window.__prev;
  const a1=t1&&agg[t1.code], a2=t2&&agg[t2.code];
  const cmpHTML = (a1&&a2) ? `
    <div class="block"><h3>${L('cmp')}</h3>
      ${cmpRow(L('valTotal'), a1.value_total, a2.value_total, v=>'€'+(v/1e6).toFixed(0)+'M')}
      ${cmpRow(L('ageAvg'), a1.age_avg, a2.age_avg, v=>v+' '+L('years'), true)}
      ${cmpRow(L('caps'), a1.caps_total, a2.caps_total, v=>v)}
      ${cmpRow(L('inj'), a1.injuries_total, a2.injuries_total, v=>v)}
    </div>` : '';

  let h2hHTML='';
  if(prev&&prev.h2h&&prev.h2h.played>0){
    const h=prev.h2h;
    const last=h.last?`${L('last')}: ${last2(h.last)} <span style="opacity:.6">(${h.last.date})</span>`:'';
    h2hHTML=`<div class="block"><h3>${L('h2h')} · ${h.played} ${L('matchups')}</h3>
      <div class="h2h-score">
        <div style="text-align:center"><div class="n ${h.w1>h.w2?'w':''}">${h.w1}</div><div class="mid">${esc(m.team1)}</div></div>
        <div class="mid">${h.d} ${L('draws')}</div>
        <div style="text-align:center"><div class="n ${h.w2>h.w1?'w':''}">${h.w2}</div><div class="mid">${esc(m.team2)}</div></div>
      </div>
      <div class="h2h-last">${last}</div></div>`;
  }

  const formHTML = (prev&&(prev.form1.length||prev.form2.length)) ? `
    <div class="block"><h3>${L('form')}</h3>
      ${formRow(m.team1, prev.form1)}
      ${formRow(m.team2, prev.form2)}
    </div>` : '';

  const climHTML = (prev&&prev.climate) ? `
    <div class="block"><h3>${L('cond')}</h3>
      <div class="climate">
        <div class="ci"><div class="v">${prev.climate.temp_c}°C</div><div class="k">${L('temp')}</div></div>
        <div class="ci"><div class="v">${prev.climate.alt_m} m</div><div class="k">${L('alt')}</div></div>
      </div></div>` : '';

  const scoreHTML = `<div class="block"><h3>${L('score')}</h3><div class="scoreline">${L('toPlay')} · ${dt?dt.toLocaleDateString(LOC,{day:'numeric',month:'long'}):''}</div></div>`;

  const squadLinks = [t1,t2].filter(Boolean).map(t=>`<a href="team.html?code=${t.code}"><img src="https://flagcdn.com/w40/${t.flag}.png" style="width:22px;height:16px;border-radius:3px;object-fit:cover"> ${L('squadOf')} ${t.name}</a>`).join('');

  document.getElementById('wrap').innerHTML = `
    <div class="eyebrow">${roundTxt}</div>
    <div class="vs">
      ${sideHTML(m.team1,teamByName)}
      <div class="vs-mid">${L('vs')}</div>
      ${sideHTML(m.team2,teamByName)}
    </div>
    <div class="kick">
      <div class="big">${dt?dt.toLocaleDateString(LOC,{day:'numeric',month:'short'}):''} · ${dt?dt.toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'}):m.time}</div>
      <div class="local">${localStr} <span style="opacity:.6">${L('localTime')}</span></div>
      <div class="venuetime">${L('venueTime')} ${m.time||'—'}</div>
    </div>
    <div id="live-box"></div>
    ${venueHTML}
    ${cmpHTML}
    ${h2hHTML}
    ${formHTML}
    ${climHTML}
    ${scoreHTML}
    ${squadLinks?`<div class="squads">${squadLinks}</div>`:''}
    <div class="note">${L('note')}</div>`;
  document.title = `${m.team1} vs ${m.team2} · WC 2026`;
  const cb=document.querySelector('.sn-crumbs'); if(cb) cb.innerHTML=`<a href="calendar.html">${L('cal')}</a><span class="sep">›</span><span class="cur">${esc(m.team1)} ${L('vs')} ${esc(m.team2)}</span>`;
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function cmpRow(label,v1,v2,fmt,lowerBetter){
  v1=v1||0; v2=v2||0; const tot=v1+v2||1;
  const p1=Math.round(v1/tot*100), p2=100-p1;
  return `<div class="cmp-row">
    <div class="lbl"><b>${fmt(v1)}</b><span class="k">${label}</span><b>${fmt(v2)}</b></div>
    <div class="cmp-bar"><div class="l" style="width:${p1}%"></div><div class="r" style="width:${p2}%"></div></div></div>`;
}
function formRow(name,form){
  const dots=(form||[]).slice().reverse().map(f=>`<span class="fd ${f.r}" title="${f.date} vs ${esc(f.opp)} ${f.gf}-${f.ga}">${f.r}</span>`).join('');
  return `<div class="form-row"><span class="tn">${esc(name)}</span><div class="form-dots">${dots||'<span style="color:var(--muted);font-size:.85em">sin datos</span>'}</div></div>`;
}
function last2(l){ return `${esc(l.home)} ${l.hs}-${l.as} ${esc(l.away)}`; }

/* ===== LIVE match data from ESPN (free, CORS-enabled) ===== */
const ESPN_SB='https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';
const ESPN_SUM='https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=';
const TEAM_ALIAS={czechrepublic:'czechia',drcongo:'congodr',turkey:'turkiye',usa:'unitedstates'};
function nrmt(s){ let x=(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); return TEAM_ALIAS[x]||x; }
function mlPct(ml){ ml=parseFloat(ml); if(isNaN(ml)) return null; return ml<0 ? (-ml)/((-ml)+100) : 100/(ml+100); }
function FLAG(name){ const t=(window.__teamByName||{})[name]; return t?`https://flagcdn.com/w40/${t.flag}.png`:''; }
const STAT_ES={'possession':'Posesión','shots':'Tiros','on goal':'Tiros a puerta','fouls':'Faltas','yellow cards':'T. amarillas','red cards':'T. rojas','offsides':'Fueras de juego','corner kicks':'Córners','saves':'Paradas','passes':'Pases','accurate passes':'Pases acertados','pass completion %':'% acierto pase','on target %':'% a puerta','accurate crosses':'Centros acertados','crosses':'Centros','penalty goals':'Goles de penalti','penalty kicks taken':'Penaltis lanzados','total shots':'Tiros','shots on target':'Tiros a puerta'};
const STAT_TR={'possession':'Topa sahip olma','shots':'Şutlar','on goal':'İsabetli şut','fouls':'Fauller','yellow cards':'Sarı kart','red cards':'Kırmızı kart','offsides':'Ofsayt','corner kicks':'Korner','saves':'Kurtarış','passes':'Pas','accurate passes':'İsabetli pas','pass completion %':'Pas isabeti %','on target %':'İsabet %','accurate crosses':'İsabetli orta','crosses':'Orta','penalty goals':'Penaltı golü','penalty kicks taken':'Kullanılan penaltı','total shots':'Şutlar','shots on target':'İsabetli şut'};
function statLabel(s){ const lang=(document.documentElement.lang)||'es'; const raw=s.label||s.name||''; const k=raw.toLowerCase(); if(lang==='es') return STAT_ES[k]||raw; if(lang==='tr') return STAT_TR[k]||raw; return raw; }
function lastName(n){ const p=(n||'').trim().split(' '); return p.length>1?p[p.length-1]:n||''; }
/* parse "4-1-4-1" + starters → {gk, rows:[[...],[...]]} from defence to attack */
function formationRows(team){
  const starters=(team.roster||[]).filter(p=>p.starter);
  let gk=starters.find(p=>/^g/i.test((p.position||{}).abbreviation||''))||starters[0];
  const rest=starters.filter(p=>p!==gk);
  const form=(team.formation||'').split('-').map(n=>parseInt(n,10)).filter(n=>n>0);
  const rows=[]; let i=0;
  (form.length?form:[rest.length]).forEach(n=>{ rows.push(rest.slice(i,i+n)); i+=n; });
  if(i<rest.length) rows.push(rest.slice(i));
  return {gk, rows};
}
let __evId=null, __mref=null;
async function loadMatchLive(m){
  __mref=m;
  let sb; try{ sb=await fetch(ESPN_SB,{cache:'no-store'}).then(r=>r.json()); }catch(e){ return; }
  const ev=(sb.events||[]).find(e=>{ const cs=((e.competitions||[])[0]||{}).competitors||[]; const ns=cs.map(c=>nrmt((c.team||{}).displayName)); return ns.includes(nrmt(m.team1))&&ns.includes(nrmt(m.team2)); });
  if(!ev) return;                       // not in ESPN feed → keep the static preview
  __evId=ev.id;
  let sum=null; try{ sum=await fetch(ESPN_SUM+ev.id,{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  renderLive(ev,sum,m);
  if((((ev.status||{}).type||{}).state)==='in' && !window.__lvT) window.__lvT=setInterval(refreshLive, 30000);
}
async function refreshLive(){
  if(!__evId||!__mref) return;
  let sb,sum;
  try{ sb=await fetch(ESPN_SB,{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  const ev=sb&&(sb.events||[]).find(e=>String(e.id)===String(__evId));
  try{ sum=await fetch(ESPN_SUM+__evId,{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  if(ev){ renderLive(ev,sum,__mref); if((((ev.status||{}).type||{}).state)==='post' && window.__lvT){ clearInterval(window.__lvT); window.__lvT=null; } }
}
function renderLive(ev,sum,m){
  const box=document.getElementById('live-box'); if(!box) return;
  const c=(ev.competitions||[])[0]||{}; const cs=c.competitors||[];
  const home=cs.find(x=>x.homeAway==='home')||{}, away=cs.find(x=>x.homeAway==='away')||{};
  const st=(ev.status||{}).type||{}; const clk=(ev.status||{}).displayClock||'';
  const homeIsT1=nrmt((home.team||{}).displayName)===nrmt(m.team1);
  const s1=homeIsT1?home.score:away.score, s2=homeIsT1?away.score:home.score;
  let statusTx;
  if(st.state==='post') statusTx = L('lvFinal');
  else if(st.state==='pre') statusTx = L('lvToPlay');
  else { let raw=(clk||st.shortDetail||st.detail||'').trim(); if(/half|^ht$/i.test(raw) && !/\d/.test(raw)) raw=L('lvHT'); statusTx='🔴 '+esc(raw); }
  const head=`<div class="lv-head ${st.state==='in'?'in':''}">
    <div class="lv-t"><img src="${FLAG(m.team1)}" alt=""><span>${esc(m.team1)}</span></div>
    <div class="lv-sc">${s1==null?'-':esc(String(s1))} <span>–</span> ${s2==null?'-':esc(String(s2))}<div class="lv-st">${statusTx}</div></div>
    <div class="lv-t r"><span>${esc(m.team2)}</span><img src="${FLAG(m.team2)}" alt=""></div></div>`;
  /* prediction */
  let pred='';
  const pc=((sum&&sum.pickcenter)||[])[0];
  if(pc){
    const hp=mlPct((pc.homeTeamOdds||{}).moneyLine), ap=mlPct((pc.awayTeamOdds||{}).moneyLine), dp=mlPct((pc.drawOdds||{}).moneyLine);
    if(hp!=null&&ap!=null&&dp!=null){
      const sum3=hp+ap+dp; let H=Math.round(hp/sum3*100), D=Math.round(dp/sum3*100), A=100-H-D;
      const pcHomeIsT1=nrmt((pc.homeTeamOdds.team||{}).displayName)===nrmt(m.team1);
      const p1=pcHomeIsT1?H:A, p2=pcHomeIsT1?A:H;
      pred=`<div class="lv-block"><h4>${L('lvPred')}</h4>
        <div class="pred"><div class="pb t1" style="width:${p1}%">${p1}%</div><div class="pb dr" style="width:${D}%">${D>7?D+'%':''}</div><div class="pb t2" style="width:${p2}%">${p2}%</div></div>
        <div class="pred-lbl"><span>${esc(m.team1)}</span><span>${L('lvDraw')}</span><span>${esc(m.team2)}</span></div></div>`;
    }
  }
  /* events (icon + minute + player — language-neutral) */
  let events='';
  const ke=(sum&&sum.keyEvents)||[];
  const evRows=ke.filter(e=>/goal|card|substitut|penal/.test(((e.type||{}).text||'').toLowerCase())).slice().reverse().map(e=>{
    const cl=((e.clock||{}).displayValue)||''; const t=((e.type||{}).text||'').toLowerCase();
    const ic=t.includes('goal')?(e.ownGoal?'⚽':'⚽'):t.includes('yellow')?'🟨':t.includes('red')?'🟥':t.includes('substitut')?'🔄':t.includes('penal')?'🎯':'•';
    const who=((e.participants||[]).map(p=>(p.athlete||{}).displayName).filter(Boolean).join(' / '))||((e.team||{}).displayName||'');
    return `<div class="ev-row"><span class="ev-min">${esc(cl)}</span><span class="ev-ic">${ic}</span><span class="ev-tx">${esc(who)}</span></div>`;
  }).join('');
  if(evRows) events=`<div class="lv-block"><h4>${L('lvEvents')}</h4>${evRows}</div>`;
  /* stats */
  let stats='';
  const bt=((sum&&sum.boxscore)||{}).teams||[];
  if(bt.length===2){
    const t1b=bt.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team1))||bt[0];
    const t2b=bt.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team2))||bt[1];
    const map2={}; (t2b.statistics||[]).forEach(s=>map2[s.name]=s);
    const ORDER=['possession','shots','on goal','shots on target','on target %','corner kicks','fouls','offsides','yellow cards','red cards','saves','accurate passes','passes','pass completion %','accurate crosses','crosses'];
    const oi=s=>{ const i=ORDER.indexOf((s.label||s.name||'').toLowerCase()); return i<0?99:i; };
    const rows=(t1b.statistics||[]).slice().sort((x,y)=>oi(x)-oi(y)).map(a=>{
      const b=map2[a.name]; if(!b) return '';
      const v1=parseFloat(a.displayValue)||0, v2=parseFloat(b.displayValue)||0, tot=v1+v2||1;
      return `<div class="stat-row"><div class="stat-top"><span class="sv">${esc(a.displayValue)}</span><span class="sk">${esc(statLabel(a))}</span><span class="sv">${esc(b.displayValue)}</span></div>
        <div class="stat-bar"><div class="l" style="width:${Math.round(v1/tot*100)}%"></div><div class="r" style="width:${Math.round(v2/tot*100)}%"></div></div></div>`;
    }).join('');
    if(rows.replace(/\s/g,'')) stats=`<div class="lv-block"><h4>${L('lvStats')}</h4>${rows}</div>`;
  }
  /* lineups → formation pitch + substitutes */
  let lineups='';
  const ros=(sum&&sum.rosters)||[];
  if(ros.length===2){
    const r1=ros.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team1))||ros[0];
    const r2=ros.find(t=>nrmt((t.team||{}).displayName)===nrmt(m.team2))||ros[1];
    const dot=p=>`<div class="fpos"><div class="fdot">${esc(String(p.jersey||''))}</div><div class="fnm">${esc(lastName((p.athlete||{}).displayName))}</div></div>`;
    const rowH=arr=>`<div class="frow">${arr.map(dot).join('')}</div>`;
    const f1=formationRows(r1), f2=formationRows(r2);
    const pitch=`<div class="pitch">
      <div class="pteam">${rowH([f2.gk])}${f2.rows.map(rowH).join('')}</div>
      <div class="pline"></div>
      <div class="pteam">${f1.rows.slice().reverse().map(rowH).join('')}${rowH([f1.gk])}</div></div>`;
    const subEl=t=>{ const s=(t.roster||[]).filter(p=>!p.starter); return s.length?`<div class="subs-col"><b>${esc((t.team||{}).displayName)}</b>${s.map(p=>`<span class="sub-pl"><i>${esc(String(p.jersey||''))}</i> ${esc((p.athlete||{}).displayName||'')}</span>`).join('')}</div>`:''; };
    lineups=`<div class="lv-block"><h4>${L('lvLineups')}</h4>
      <div class="pf"><span>${esc(m.team1)} · ${esc(r1.formation||'')}</span><span>${esc(r2.formation||'')} · ${esc(m.team2)}</span></div>
      ${pitch}
      <div class="lu-h2">${L('lvSubs')}</div><div class="subs">${subEl(r1)}${subEl(r2)}</div></div>`;
  }
  /* live commentary (text comes from ESPN in English) */
  let comm='';
  const cm=(sum&&sum.commentary)||[];
  if(cm.length){
    const rows=cm.slice().reverse().slice(0,50).map(x=>{ const tm=((x.time||{}).displayValue)||''; return `<div class="cm-row"><span class="cm-min">${esc(tm)}</span><span class="cm-tx">${esc(x.text||'')}</span></div>`; }).join('');
    comm=`<div class="lv-block"><h4>${L('lvComm')}</h4><div class="cm-list">${rows}</div></div>`;
  }
  box.innerHTML = head + events + pred + stats + lineups + comm;
}

main();
</script>
