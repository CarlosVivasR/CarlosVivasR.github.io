<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias · WC 2026</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  h1{font-size:clamp(1.9em,4vw,2.6em);font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
  .sub{color:var(--ink-2);margin-bottom:22px;font-size:.94em}
  .nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .nitem{display:block;border:1px solid var(--line);border-radius:14px;padding:16px;background:rgba(255,255,255,.03);color:var(--ink);transition:transform .18s,border-color .18s}
  .nitem:hover{transform:translateY(-3px);border-color:var(--cyan);color:var(--ink)}
  .nitem .nt{font-weight:700;font-size:.98em;line-height:1.3;margin-bottom:8px}
  .nitem .nm{display:flex;justify-content:space-between;gap:10px;font-size:.78em;color:var(--muted)}
  .nitem .src{font-weight:700;color:var(--gold-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nstate{color:var(--muted);font-size:.92em;padding:20px 0}
  .nstate a{color:var(--cyan)}
  .nfilter{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
  .nfilter label{font-size:.82em;font-weight:700;color:var(--muted)}
  .nfilter select{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.9em;font-weight:600;cursor:pointer;max-width:280px}
  .nfilter select:focus{outline:none;border-color:var(--cyan)}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#03040c">
</head>
<body>
<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="grid-lines"></div>
<script>window.PAGE={active:'home',crumbs:[{label:'Inicio',href:'index.html'},{label:'Noticias'}]};</script>
<div id="site-nav"></div>
<div class="wrap" id="wrap"><h1 id="h1">Noticias</h1><div class="sub" id="sub"></div><div class="nfilter"><label id="flabel" for="team-filter"></label><select id="team-filter"></select></div><div class="nstate" id="state">Cargando…</div><div class="nlist" id="nlist"></div></div>
<script src="assets/nav.js" defer></script>
<script src="assets/search.js" defer></script>
<script src="assets/i18n.js"></script>
<script>
const T={
  es:{title:'Noticias del Mundial',sub:'Titulares recientes sobre el Mundial 2026 · actualizado en vivo.',loading:'Cargando titulares…',fail:'No se pudieron cargar las noticias ahora mismo.',open:'Abrir en Google News',q:'Mundial 2026 FIFA',hl:'es-419',gl:'ES',filterBy:'Filtrar por equipo:',allTeams:'Todos los equipos',qShort:'Mundial',rel:['ahora','hace {n} min','hace {n} h','hace {n} d']},
  en:{title:'World Cup news',sub:'Recent headlines about the 2026 World Cup · updated live.',loading:'Loading headlines…',fail:'Could not load the news right now.',open:'Open in Google News',q:'World Cup 2026',hl:'en-US',gl:'US',filterBy:'Filter by team:',allTeams:'All teams',qShort:'World Cup',rel:['now','{n} min ago','{n} h ago','{n} d ago']},
  tr:{title:'Dünya Kupası haberleri',sub:'2026 Dünya Kupası hakkında güncel başlıklar · canlı.',loading:'Başlıklar yükleniyor…',fail:'Haberler şu an yüklenemedi.',open:'Google News\'te aç',q:'2026 Dünya Kupası',hl:'tr',gl:'TR',filterBy:'Takıma göre filtrele:',allTeams:'Tüm takımlar',qShort:'Dünya Kupası',rel:['şimdi','{n} dk önce','{n} sa önce','{n} g önce']}
};
const L=k=>wcT(T,k);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function rel(d){ const t=L('rel'); const s=(Date.now()-d)/1000; if(s<60)return t[0]; if(s<3600)return t[1].replace('{n}',Math.floor(s/60)); if(s<86400)return t[2].replace('{n}',Math.floor(s/3600)); return t[3].replace('{n}',Math.floor(s/86400)); }

function render(items){
  const arr=(items||[]).slice().sort((a,b)=>(b.date||0)-(a.date||0));  // newest first
  const st=document.getElementById('state'); if(st) st.style.display='none';
  document.getElementById('nlist').innerHTML=arr.map(n=>`
    <a class="nitem" href="${esc(n.link)}" target="_blank" rel="noopener">
      <div class="nt">${esc(n.title)}</div>
      <div class="nm"><span class="src">${esc(n.src||'')}</span><span>${n.date?rel(n.date):''}</span></div>
    </a>`).join('');
}
function parseItems(xml){
  try{
    const doc=new DOMParser().parseFromString(xml,'text/xml');
    return [...doc.querySelectorAll('item')].slice(0,30).map(it=>{
      const title=(it.querySelector('title')||{}).textContent||'';
      const link=(it.querySelector('link')||{}).textContent||'';
      const src=(it.querySelector('source')||{}).textContent||'';
      const pd=(it.querySelector('pubDate')||{}).textContent||'';
      const clean=src&&title.endsWith(' - '+src)?title.slice(0,-(src.length+3)):title;  // strip " - Source"
      return {title:clean, link, src, date:pd?Date.parse(pd):0};
    }).filter(n=>n.title&&n.link);
  }catch(e){ return []; }
}
async function fetchVia(p,rss){
  const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),9000);
  try{
    const r=await fetch(p(rss),{signal:ctrl.signal});
    if(!r.ok) throw 0;
    const txt=await r.text();
    if(!txt.includes('<item')) throw 0;
    return txt;
  } finally { clearTimeout(to); }
}
const PROXIES=[
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  u=>`https://thingproxy.freeboard.io/fetch/${u}`
];
const lang=()=>(window.WC_LANG||'es');
const rssUrl=q=>{const hl=L('hl'),gl=L('gl');return `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=${hl}&gl=${gl}&ceid=${gl}:${hl.split('-')[0]}`;};
const gnUrl=q=>`https://news.google.com/search?q=${encodeURIComponent(q)}&hl=${L('hl')}`;
async function liveItems(q){ let xml=null; try{ xml=await Promise.any(PROXIES.map(p=>fetchVia(p,rssUrl(q)))); }catch(e){} return xml?parseItems(xml):[]; }
function setState(txt){ const st=document.getElementById('state'); st.style.display=''; st.textContent=txt; }
function failState(q){ const st=document.getElementById('state'); st.style.display=''; st.innerHTML=`${L('fail')} <a href="${gnUrl(q)}" target="_blank" rel="noopener">${L('open')} →</a>`; }

let GENERAL=[], currentFilter='';   // currentFilter: '' = general feed, else team name

async function loadGeneral(){
  const CK='wc26news_'+lang(); let shown=GENERAL.length>0;
  if(shown) render(GENERAL);
  if(!shown){ try{ const c=JSON.parse(localStorage.getItem(CK)||'null'); if(c&&c.items&&c.items.length){ GENERAL=c.items; render(GENERAL); shown=true; } }catch(e){} }
  if(!shown){ try{ const r=await fetch('data/news.json',{cache:'no-cache'}); if(r.ok){ const j=await r.json(); const it=j[lang()]||[]; if(it.length){ GENERAL=it; render(GENERAL); shown=true; } } }catch(e){} }
  if(!shown) setState(L('loading'));
  const items=await liveItems(L('q'));
  if(items.length){ GENERAL=items; try{ localStorage.setItem(CK,JSON.stringify({items,ts:Date.now()})); }catch(e){} if(currentFilter==='') render(GENERAL); return; }
  if(!shown && currentFilter==='') failState(L('q'));
}
async function loadTeam(name){
  setState(L('loading')); document.getElementById('nlist').innerHTML='';
  const q=`"${name}" ${L('qShort')}`;
  const items=await liveItems(q);
  if(currentFilter!==name) return;             // user switched away while loading
  if(items.length) render(items); else failState(q);
}
async function buildFilter(){
  let teams=[];
  try{ const r=await fetch('data/teams/index.json',{cache:'no-cache'}); if(r.ok) teams=(await r.json()).teams||[]; }catch(e){}
  teams.sort((a,b)=>a.name.localeCompare(b.name));
  const sel=document.getElementById('team-filter');
  document.getElementById('flabel').textContent=L('filterBy');
  sel.innerHTML=`<option value="">${L('allTeams')}</option>`+teams.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
  sel.addEventListener('change',()=>{ currentFilter=sel.value; if(currentFilter==='') (GENERAL.length?render(GENERAL):loadGeneral()); else loadTeam(currentFilter); });
}
async function main(){
  document.getElementById('h1').textContent=L('title');
  document.getElementById('sub').textContent=L('sub');
  buildFilter();
  loadGeneral();
}
main();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
