<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>World Cup 2026</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">

<script>if(!matchMedia("(prefers-reduced-motion:reduce)").matches)document.documentElement.classList.add("pre");</script>
<style>
  :root{
    --bg:#04060f; --bg-2:#0a0e22;
    --ink:#ffffff; --ink-2:rgba(255,255,255,.9); --muted:rgba(255,255,255,.6);
    --gold:#e8c247; --gold-2:#f4d76b; --cyan:#35e0d8;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.22);
    --disp:'Space Grotesk',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--gold);text-decoration:none}
  h1,h2,h3{font-family:var(--disp)}

  /* Fixed dimmed globe background */
  #scene-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.6;filter:saturate(1.1)}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg, rgba(4,6,15,.95) 0%, rgba(4,6,15,.82) 36%, rgba(4,6,15,.55) 72%, rgba(4,6,15,.34) 100%)}

  main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 20px 90px}
  @keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  html.pre .hero-left>*{opacity:0;animation:heroIn .8s cubic-bezier(.16,1,.3,1) forwards}
  html.pre .hero-left>*:nth-child(1){animation-delay:.06s}
  html.pre .hero-left>*:nth-child(2){animation-delay:.15s}
  html.pre .hero-left>*:nth-child(3){animation-delay:.24s}
  html.pre .hero-left>*:nth-child(4){animation-delay:.33s}
  html.pre .hero-right{opacity:0;animation:heroIn .9s cubic-bezier(.16,1,.3,1) .22s forwards}
  html.pre .hero h1{opacity:1;animation:none}
  .hero h1 span{display:inline-block;white-space:pre}

  /* ===== Compact hero ===== */
  .hero{display:grid;grid-template-columns:1.02fr .98fr;gap:48px;align-items:center;min-height:76vh;padding:24px 0 40px}
  .hero-left{text-align:left}
  .hero-right{min-width:0;display:flex;flex-direction:column;justify-content:center}
  .hero-top{display:flex;justify-content:center;margin-bottom:18px}
  .lang-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:99px;overflow:hidden;background:rgba(10,14,22,.6);backdrop-filter:blur(8px)}
  .lang-toggle button{background:transparent;border:none;padding:6px 13px;font-family:inherit;font-size:.76em;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.05em;transition:all .15s}
  .lang-toggle button:hover{color:var(--ink)}
  .lang-toggle button.active{background:var(--gold);color:#0a0a0a}
  .hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:.72em;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);background:rgba(232,194,71,.08);border:1px solid rgba(232,194,71,.25);padding:6px 15px;border-radius:999px;margin-bottom:16px}
  .hero-kicker .pulse{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(232,194,71,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,194,71,.55)}70%{box-shadow:0 0 0 9px rgba(232,194,71,0)}100%{box-shadow:0 0 0 0 rgba(232,194,71,0)}}
  .hero h1{font-size:clamp(3em,7.5vw,5.6em);font-weight:700;letter-spacing:-.045em;line-height:.9;color:#fff;margin-bottom:18px}
  .hero h1 .yr{display:block;color:var(--gold);font-weight:700;line-height:.92;margin-top:2px}
  .hero .sub{color:var(--ink-2);font-size:clamp(.98em,1.5vw,1.15em);font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-start}
  .host-flags{display:inline-flex;gap:5px;vertical-align:middle}
  .host-flags img{width:21px;height:15px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}

  /* compact countdown strip */
  .countdown{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0 4px}
  .cd-unit{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:70px;backdrop-filter:blur(8px)}
  .cd-unit .num{font-family:var(--disp);font-size:1.5em;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
  .cd-unit .lbl{font-size:.62em;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
  .cd-cap{font-size:.78em;color:var(--muted);margin-top:12px}
  .cd-cap b{color:var(--ink-2);font-weight:600}
  /* live state */
  .live-hero{display:inline-flex;align-items:center;gap:9px;background:rgba(224,70,74,.14);border:1px solid rgba(224,70,74,.5);color:#ff7a7d;font-weight:800;font-size:1.05em;padding:9px 18px;border-radius:99px}
  .live-hero img{width:21px;height:15px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.3);vertical-align:-2px}
  .live-hero .lh-vs{opacity:.55;font-weight:600;font-size:.82em;margin:0 1px}
  .lh-dot{width:10px;height:10px;border-radius:50%;background:#ff3b3b;flex-shrink:0;animation:lhpulse 1.4s infinite}
  @keyframes lhpulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.55)}70%{box-shadow:0 0 0 9px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
  .hm-m.live{border-color:rgba(224,70,74,.55)!important;box-shadow:0 0 0 1px rgba(224,70,74,.25)}
  .hm-m .live-badge{color:#ff5a5d;font-weight:800;display:inline-flex;align-items:center;gap:4px}
  .hm-m .live-badge .lh-dot{width:7px;height:7px}
  .hm-m .hm-sc{margin-left:auto;font-weight:800;font-size:1.1em;color:var(--ink);font-variant-numeric:tabular-nums}
  .hm-m .tm{display:flex;align-items:center;gap:8px}
  .live-hero .lh-vs{font-weight:900;font-size:1.05em;color:#fff;margin:0 3px}
  .live-hero .lh-min{background:rgba(255,255,255,.15);border-radius:99px;padding:1px 8px;font-size:.78em;margin-left:4px}
  .hm-m .hm-goals{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.8em;color:var(--ink-2);line-height:1.5}

  .cta-row{display:flex;justify-content:flex-start;gap:12px;flex-wrap:wrap;margin-top:26px}
  .cta{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:99px;font-weight:700;font-size:.98em;transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .2s,background .2s,scale .12s;border:1px solid transparent;cursor:pointer}
  .cta:active{scale:.96}
  .hero .sub .cnt{font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
  .cta.primary{background:var(--gold);color:#0a0a0a;box-shadow:0 6px 18px rgba(232,194,71,.16)}
  .cta.primary:hover{transform:translateY(-2px);color:#0a0a0a}
  .cta.ghost{background:rgba(255,255,255,.06);color:var(--ink);border-color:var(--line-strong);backdrop-filter:blur(8px)}
  .cta.ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-2px);color:var(--ink)}

  /* === Match Spotlight hero === */
  .spotlight{margin:0;max-width:none;display:flex;flex-direction:column;gap:10px}
  .model-track{max-width:560px;margin:0 auto 4px}
  .mt-card{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:11px 16px;border-radius:14px;
    background:linear-gradient(160deg,rgba(53,224,216,.08),rgba(255,255,255,.02));border:1px solid rgba(53,224,216,.28)}
  .mt-card .mt-h{font-size:.72em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#35e0d8}
  .mt-card .mt-stat{font-size:.98em;color:var(--ink-2);font-variant-numeric:tabular-nums} .mt-card .mt-stat b{color:var(--ink);font-weight:800}
  .mt-card .mt-sub{font-size:.84em;color:var(--muted)}
  .mt-card .mt-bt{font-size:.72em;color:var(--muted)}
  .sp-card{position:relative;display:block;text-align:center;border-radius:20px;padding:22px 20px 18px;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--line-strong);box-shadow:0 14px 40px rgba(0,0,0,.45);
    color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
  .sp-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.28);color:var(--ink)}
  .sp-card.live{border-color:rgba(224,70,74,.55);box-shadow:0 0 0 1px rgba(224,70,74,.25),0 14px 44px rgba(224,70,74,.18)}
  .sp-card.live::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% -10%,rgba(224,70,74,.16),transparent 60%);pointer-events:none}
  .sp-pill{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:.66em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 13px;border-radius:99px;margin-bottom:14px}
  .sp-pill.live{background:rgba(224,70,74,.16);color:#ff7a7d;border:1px solid rgba(224,70,74,.5)}
  .sp-pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff3b3b;animation:lhpulse 1.4s infinite}
  .sp-pill.next{background:rgba(232,194,71,.12);color:var(--gold);border:1px solid rgba(232,194,71,.3)}
  .sp-pill.done{background:rgba(255,255,255,.07);color:var(--muted);border:1px solid var(--line)}
  .sp-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
  .sp-team{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
  .sp-team>span{font-weight:800;font-size:1.02em;line-height:1.15;letter-spacing:-.01em}
  .sp-flag{width:62px;height:42px;object-fit:cover;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.14)}
  .sp-flag.ph{display:inline-block;background:repeating-linear-gradient(45deg,#1a1f33,#1a1f33 5px,#222842 5px,#222842 10px)}
  .sp-score{font-family:var(--disp);font-size:2.7em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.02em;white-space:nowrap}
  .sp-score i{opacity:.4;font-style:normal;margin:0 6px;font-weight:600}
  .sp-vs{font-family:var(--disp);font-size:1.2em;font-weight:700;color:var(--muted);letter-spacing:.08em}
  .sp-status{margin-top:13px;min-height:22px}
  .sp-min{display:inline-flex;align-items:center;gap:6px;font-size:.92em;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .sp-min.live{color:#ff7a7d}
  .sp-min.soon{color:var(--gold)}
  .sp-scorers{margin-top:8px;font-size:.8em;color:var(--muted);line-height:1.5}
  .sp-cta{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font-size:.86em;font-weight:800;color:var(--gold);letter-spacing:.02em;transition:gap .2s}
  .sp-card:hover .sp-cta{gap:11px}
  .sp-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .sp-chip{flex:1 1 0;min-width:150px;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);
    color:var(--ink-2);font-size:.82em;font-weight:700;transition:border-color .2s,transform .15s}
  .sp-chip:hover{border-color:var(--line-strong);transform:translateY(-1px);color:var(--ink)}
  .sp-chip img{width:22px;height:15px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  .sp-chip .sc{font-variant-numeric:tabular-nums;font-weight:800}
  .sp-chip .sc.live{color:#ff7a7d}
  @media(max-width:600px){ .sp-flag{width:50px;height:34px} .sp-score{font-size:2.1em} .sp-team>span{font-size:.9em} }

  /* ===== Section blocks ===== */
  .blk{margin-top:34px}
  .blk-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .blk-head h2{font-size:1.45em;font-weight:600;letter-spacing:-.02em;position:relative;padding-left:15px}
  .blk-head h2::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:3px;border-radius:2px;background:var(--gold)}
  .blk-head .all{margin-left:auto;color:var(--gold);font-weight:700;font-size:.86em}
  .blk-head .all:hover{color:var(--gold-2)}

  /* próximos partidos */
  .hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
  .hm-m{display:block;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(160deg,rgba(13,17,32,.55),rgba(255,255,255,.015));color:var(--ink);transition:transform .18s,border-color .18s}
  .hm-m:hover{transform:translateY(-3px);border-color:var(--gold);color:var(--ink)}
  .hm-m .top{display:flex;justify-content:space-between;font-size:.71em;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-bottom:8px;gap:8px}
  .hm-m .top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hm-m .tm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.96em;margin:3px 0}
  .hm-m .tm img{width:23px;height:15px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18);flex:none}
  .hm-m .when{font-size:.78em;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums}

  /* two-column home: matches · data */
  .home-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:26px;margin-top:34px;align-items:start}
  .home-cols .blk{margin-top:0;min-width:0}
  @media(max-width:860px){.home-cols{grid-template-columns:1fr;gap:30px}}
  @media(max-width:900px){
    .hero{grid-template-columns:1fr;gap:24px;min-height:auto;padding:30px 0 32px}
    .hero-left{text-align:center}
    .hero .sub,.cta-row{justify-content:center}
    .spotlight{max-width:560px;margin:0 auto}
    .veil{background:radial-gradient(ellipse at 50% 26%, rgba(4,6,15,.4) 0%, rgba(4,6,15,.8) 60%, rgba(4,6,15,.97) 100%)}
  }
  /* data widgets (right column) */
  .dwidget{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);padding:14px 14px 8px;margin-bottom:14px}
  .dwidget h3{font-size:.68em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-family:'Inter',sans-serif}
  .drow{display:flex;align-items:center;gap:9px;padding:6px 2px;border-top:1px solid var(--line);font-size:.88em}
  .drow:first-of-type{border-top:none}
  .drow .pos{width:16px;color:var(--muted);font-family:var(--mono);font-weight:700;font-size:.82em;flex:none}
  .drow img{width:22px;height:15px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18);flex:none}
  .drow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow .nm .sm{color:var(--muted);font-size:.85em;font-weight:500}
  .drow .vv{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:.85em;color:var(--gold);flex:none}

  footer{position:relative;z-index:2;padding:34px 24px;text-align:center;color:var(--muted);font-size:.82em;background:var(--bg);border-top:1px solid var(--line)}
  footer a{color:var(--ink-2)}

  @media (max-width:640px){
    .hero{padding:44px 0 16px}
    .cd-unit{padding:9px 13px;min-width:62px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>

<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('scene-canvas');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile = matchMedia('(max-width:640px)').matches;
try {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0,0,8);
  const renderer = new THREE.WebGLRenderer({canvas, antialias:!mobile, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, mobile?1.5:2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.AmbientLight(0xffffff,.7));
  const key=new THREE.DirectionalLight(0xfff1d0,1.3); key.position.set(4,5,6); scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,.5); fill.position.set(0,1,9); scene.add(fill);
  const sg=new THREE.BufferGeometry(); const N=mobile?500:1000; const pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){const r=40+Math.random()*40,t=Math.random()*6.28,p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t);pos[i*3+1]=r*Math.sin(p)*Math.sin(t);pos[i*3+2]=r*Math.cos(p);}
  sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.1,transparent:true,opacity:.8})));
  const R=3.4, seg=mobile?48:64;
  const tl=new THREE.TextureLoader(); tl.crossOrigin='anonymous';
  const tex=tl.load(`https://threejs.org/examples/textures/planets/earth_atmos_${mobile?'1024':'2048'}.jpg`);
  tex.colorSpace=THREE.SRGBColorSpace;
  const earth=new THREE.Mesh(new THREE.SphereGeometry(R,seg,seg),
    new THREE.MeshStandardMaterial({map:tex,roughness:.9,metalness:0}));

  const bt=__rbase.backtest||{}; const histTx=mtL('mt.hist').replace('{acc}',Math.round((bt.acc||0)*100)).replace('{rps}',(+(bt.rps||0)).toFixed(3));
  const recs=(window.__liveData||[]).filter(r=>r.state==='post' && r.hs!=null && r.as!=null);
  let n=0,hits=0,rsum=0;
  recs.forEach(r=>{ const p=mtProbs(r.hName,r.aName, mtHost(r.hName)?1:0); if(!p) return; const hs=+r.hs,as=+r.as; const act=hs>as?0:hs==as?1:2; const pred=p.indexOf(Math.max(p[0],p[1],p[2])); n++; if(pred===act)hits++; rsum+=mtRps(p,act); });
  if(!n){ el.innerHTML=`<div class="mt-card"><span class="mt-h">🎯 ${mtL('mt.title')}</span><span class="mt-sub">${mtL('mt.none')}</span><span class="mt-bt">${histTx}</span></div>`; return; }
  const small = n<20 ? ` · ${mtL('mt.small')}` : '';
  el.innerHTML=`<div class="mt-card"><span class="mt-h">🎯 ${mtL('mt.title')}</span>`
    +`<span class="mt-stat"><b>${hits}/${n}</b> ${mtL('mt.hits')} · <b>${Math.round(hits/n*100)}%</b> · RPS <b>${(rsum/n).toFixed(3)}</b>${small}</span>`
    +`<span class="mt-bt">${histTx}</span></div>`;
}

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<script>
(function(){
  var root=document.documentElement;
  /* safety: if the CSS entrance never advances (tab opened in background), force-reveal */
  setTimeout(function(){
    root.classList.remove("pre");
    document.querySelectorAll(".hero-left > *, .hero-right, .home-cols .blk, .hero h1 span").forEach(function(el){
      if(getComputedStyle(el).opacity==="0"){ el.style.opacity="1"; el.style.transform="none"; }
    });
    document.querySelectorAll(".hero .sub .cnt").forEach(function(el){ if(el.dataset.to && el.textContent==="0") el.textContent=el.dataset.to; });
  }, 2600);
  /* anime.js motion (optional, respects reduced-motion) */
  if(!window.anime || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  function run(){
    try{
      /* signature: headline letters cascade in (word only; the "2026" sits below it as a block) */
      var hw=document.querySelector(".hero h1 .hw");
      if(hw && hw.querySelectorAll("span").length===0){
        var frag=document.createDocumentFragment();
        hw.textContent.split("").forEach(function(c){ var s=document.createElement("span"); s.textContent=c; frag.appendChild(s); });
        hw.textContent=""; hw.appendChild(frag);
        anime({targets:".hero h1 .hw span", translateY:[60,0], opacity:[0,1], rotate:[6,0], easing:"easeOutExpo", duration:900, delay:anime.stagger(34,{start:120})});
      }
      /* hero stat counters (48 / 104 / 16 tick up) */
      var subSpan=document.querySelector('.hero .sub span[data-i18n="hero.sub"]');
      if(subSpan && !subSpan.querySelector(".cnt")){
        subSpan.innerHTML=subSpan.textContent.replace(/\d+/g,function(n){ return '<span class="cnt" data-to="'+n+'">0</span>'; });
        document.querySelectorAll(".hero .sub .cnt").forEach(function(el){ var o={v:0}; anime({targets:o, v:+el.dataset.to, round:1, easing:"easeOutExpo", duration:1500, delay:350, update:function(){ el.textContent=o.v; }}); });
      }
      /* magnetic primary CTA */
      var mag=document.querySelector(".cta.primary");
      if(mag){
        mag.addEventListener("mousemove",function(e){ var r=mag.getBoundingClientRect(); mag.style.transform="translate("+((e.clientX-r.left-r.width/2)*.22)+"px,"+((e.clientY-r.top-r.height/2)*.3)+"px)"; });
        mag.addEventListener("mouseleave",function(){ mag.style.transform=""; });
      }
      /* scroll reveals for the lower sections */
      var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ anime({targets:e.target, opacity:[0,1], translateY:[26,0], easing:"easeOutExpo", duration:800}); io.unobserve(e.target); } }); }, {threshold:.16});
      document.querySelectorAll(".home-cols .blk").forEach(function(b){ b.style.opacity=0; io.observe(b); });
    }catch(e){}
  }
  if(document.readyState!=="loading") run(); else document.addEventListener("DOMContentLoaded", run);
})();
</script>
